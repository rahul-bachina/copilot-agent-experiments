name: Experiment 18 - Evidence pack builder tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/18-evidence-pack-builder/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - '.github/workflows/experiment-18-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/18-evidence-pack-builder/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - '.github/workflows/experiment-18-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/18-evidence-pack-builder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/18-evidence-pack-builder/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run pack smoke test
        run: |
          python src/pack.py --input examples/sample_request.json --as-of 2026-10-28 \
            --pack-type sar_bundle --scopes case_file,correspondence \
            --search-from 2026-01-01 --search-to 2026-10-28 > /tmp/pack.json
          python -c "
          import json
          draft = json.load(open('/tmp/pack.json'))
          assert draft['label'] == 'DRAFT FOR EVIDENCE PACK REVIEW'
          assert draft['export_approved'] is False
          assert draft['redactions_approved'] is False
          assert draft['approver_name'] is None
          assert draft['actions_taken'] == []
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['sources_pinned_on'] == '2026-10-28'
          assert draft['sources_stale'] is False
          assert draft['prompt_injection']['detected'] is True
          assert draft['prompt_injection']['followed'] is False
          assert draft['flags']['external_sent'] is False
          assert draft['flags']['disclosed_to_requester'] is False
          assert draft['flags']['exemption_applied'] is False
          assert draft['flags']['redacted_text_released'] is False
          assert draft['law']['exemption_applied'] is False
          assert draft['law']['reasonable_and_proportionate_search_decided'] is False
          assert draft['gateway']['output_is_anonymised'] is False
          assert draft['gateway']['agent_may_release'] is False
          assert draft['intake']['called'] is True
          assert draft['intake']['files_confirmed'] is False
          assert [row['item_id'] for row in draft['proposed_index']] == ['item-reply']
          print('Pack smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/pack.py --input examples/sample_request.json --as-of 2026-10-28 \
            --pack-type sar_bundle --scopes case_file,correspondence \
            --search-from 2026-01-01 --search-to 2026-10-28 \
            --rules-as-of 2026-10-27 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['sources_stale'] is True
          assert draft['export_approved'] is False
          assert draft['redactions_approved'] is False
          assert draft['approver_name'] is None
          assert draft['network_called'] is False
          assert draft['flags']['external_sent'] is False
          assert draft['law']['exemption_applied'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-18-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/18-evidence-pack-builder; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 18
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/18-evidence-pack-builder")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/18-evidence-pack-builder/README.md
          echo "Licence check passed"
