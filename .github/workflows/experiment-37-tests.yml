name: Experiment 37 - Underwriting submission summary tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/37-underwriting-submission-summary/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/37-underwriting-submission-summary.md'
      - '.github/workflows/experiment-37-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/37-underwriting-submission-summary/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/37-underwriting-submission-summary.md'
      - '.github/workflows/experiment-37-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/37-underwriting-submission-summary

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/37-underwriting-submission-summary/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run sandbox smoke test
        run: |
          python src/summarise.py --submission examples/sample_submission.json --as-of 2026-11-05 > /tmp/summary.json
          python -c "
          import json
          draft = json.load(open('/tmp/summary.json'))
          assert draft['label'] == 'DRAFT FOR THE UNDERWRITER. NOT A COVERAGE OR PRICING DECISION.'
          assert draft['catalogue_id'] == 'B006'
          assert draft['autonomy'] == 'A0'
          assert draft['summary']['stated_fact_count'] == 7
          assert draft['summary']['verdict_total'] == 7
          assert draft['summary']['gap_count'] == 1
          assert draft['summary']['failure_count'] == 0
          assert 'grand_total' not in draft['summary']
          assert draft['checker_passed'] is True
          assert draft['do_not_rely'] is True
          assert draft['coverage_decision'] is None
          assert draft['price_suggested'] is None
          assert draft['terms_suggested'] is None
          assert draft['broker_contacted'] is False
          assert draft['underwriting_system_written'] is False
          assert draft['bound'] is False
          assert draft['summary_accepted_as_decision'] is False
          assert draft['solely_automated_decision'] is False
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['foundry_called'] is False
          assert draft['a3_recommended'] is False
          assert draft['actions_taken'] == []
          assert draft['intake']['called'] is True
          assert draft['intake']['experiment_id'] == 'exp-12-document-intake'
          assert draft['intake']['handed_off'] is False
          assert draft['experiment_29_number_check'] is True
          assert draft['experiment_33_imported'] is False
          assert draft['experiment_35_imported'] is False
          assert draft['sections']['stated_warranties']['status'] == 'not_stated'
          assert draft['sections']['stated_warranties']['items'][0]['value'] == 'not stated'
          assert draft['sections']['stated_warranties']['items'][0]['inferred'] is False
          blob = json.dumps(draft['facts'])
          assert '2500000' in blob
          assert 'different occupancy' not in blob
          print('Sandbox smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/summarise.py --submission examples/sample_submission.json --as-of 2027-02-10 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['do_not_rely'] is True
          assert 'source_pin_stale' in draft['do_not_rely_reasons']
          assert draft['coverage_decision'] is None
          assert draft['broker_contacted'] is False
          assert draft['a3_recommended'] is False
          assert draft['network_called'] is False
          opened = [row for row in draft['sources'] if row['id'] == 'ia2015-s3']
          assert opened and opened[0]['stale'] is True
          boundary = next(item for item in draft['sources'] if item['id'] == 'catalogue-boundary')
          assert boundary['stale'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          for flag in --accept --decline --suggest-price --suggest-terms --contact-broker --write-system --bind; do
            set +e
            python src/summarise.py --submission examples/sample_submission.json --as-of 2026-11-05 "$flag" > /tmp/prohibited.json
            code=$?
            set -e
            test "$code" -eq 2
            test ! -s /tmp/prohibited.json
          done
          echo "Prohibited-action smoke test passed"

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert report['not_an_llm_judge'] is True
          assert report['not_a_coverage_decision'] is True
          assert report['experiment_35_imported'] is False
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          assert 'grand_total' not in summary
          assert summary['facts_are_not_summed'] is True
          assert 14 not in summary.values()
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 12:
              print('ERROR: expected 12 cases')
              raise SystemExit(1)
          quotes = [case['stated_fact_count'] for case in report['cases'] if case['id'] in {'northfen-warehouse', 'northfen-warehouse-again'}]
          assert quotes == [7, 7]
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-37-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/37-underwriting-submission-summary docs-site/docs/experiments/37-underwriting-submission-summary.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No currency symbol copied into the source
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          roots = [
              Path("experiments/37-underwriting-submission-summary"),
              Path("docs-site/docs/experiments/37-underwriting-submission-summary.md"),
          ]
          import re
          currency = re.compile(r"[£€]|\$\d")
          failed = False
          for root in roots:
              if not root.exists():
                  continue
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml"}:
                      continue
                  if "tests" in path.parts:
                      continue
                  text = path.read_text(errors="ignore")
                  if currency.search(text):
                      print(f"Currency symbol in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Currency check passed")
          PY

      - name: No obvious secrets in Experiment 37
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/37-underwriting-submission-summary")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/37-underwriting-submission-summary/README.md
          echo "Licence check passed"
