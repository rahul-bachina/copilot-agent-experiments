name: Experiment 21 - IT service desk tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/21-it-service-desk/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - '.github/workflows/experiment-21-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/21-it-service-desk/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'docs-site/docs/experiments/21-it-service-desk.md'
      - '.github/workflows/experiment-21-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/21-it-service-desk

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/21-it-service-desk/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run desk smoke test
        run: |
          python src/desk.py --input examples/sample_ticket.json --as-of 2026-10-29 > /tmp/desk.json
          python -c "
          import json
          draft = json.load(open('/tmp/desk.json'))
          assert draft['label'] == 'DRAFT FOR SERVICE DESK REVIEW'
          assert draft['catalogue_id'] == 'Q009'
          assert draft['autonomy'] == 'A1'
          assert draft['human_approval'] is None
          assert draft['actions_taken'] == []
          assert draft['executed'] is False
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['ticket_text_echoed'] is False
          assert draft['outcome'] == 'standard_fix_proposed'
          assert draft['article']['id'] == 'kb-vpn-809'
          assert draft['article']['body_quoted'] is True
          assert draft['identity']['trusted'] is True
          assert draft['proposed_fix']['executed'] is False
          assert draft['proposed_fix']['privileged'] is False
          assert draft['flags']['password_reset'] is False
          assert draft['flags']['mfa_changed'] is False
          assert draft['flags']['access_granted'] is False
          assert draft['flags']['device_changed'] is False
          assert draft['flags']['fix_executed'] is False
          assert draft['flags']['ticket_written'] is False
          assert draft['flags']['message_sent'] is False
          assert draft['pii_gateway']['output_is_anonymised'] is False
          assert draft['pii_gateway']['agent_may_release'] is False
          assert 'automated AI chatbot' in draft['ai_disclosure']
          print('Desk smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/desk.py --input examples/sample_ticket.json --as-of 2027-10-29 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          blob = json.dumps(draft)
          assert draft['any_source_stale'] is True
          assert draft['rules_current'] is False
          assert draft['outcome'] == 'stale_article'
          assert draft['human_approval'] is None
          assert draft['network_called'] is False
          assert draft['flags']['stale_article_quoted'] is False
          assert draft['flags']['fix_executed'] is False
          assert 'Quit the VPN client and open it again.' not in blob
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from desk import DeskForbidden, record_review, reset_password, triage
          ticket = json.loads(Path('examples/sample_ticket.json').read_text())
          ticket['summary'] = 'I forgot my password.'
          draft = triage(ticket, '2026-10-29')
          assert draft['outcome'] == 'privileged_handover'
          refused = record_review(draft, {
              'decision': 'reset_password',
              'actor': 'analyst',
              'actor_id': 'SYN-ANALYST-007',
          })
          assert refused['review']['refused'] is True
          assert refused['review']['reason'] == 'prohibited_decision'
          assert refused['flags']['password_reset'] is False
          assert refused['human_approval'] is None
          try:
              reset_password()
          except DeskForbidden:
              pass
          else:
              raise SystemExit('reset_password should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-21-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/21-it-service-desk docs-site/docs/experiments/21-it-service-desk.md; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 21
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/21-it-service-desk")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/21-it-service-desk/README.md
          echo "Licence check passed"
