name: Experiment 72 - Compliance obligation register tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/72-compliance-obligation-register/**'
      - 'experiments/68-regulatory-change-briefing/**'
      - 'experiments/69-policy-control-mapping/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-72-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/72-compliance-obligation-register/**'
      - 'experiments/68-regulatory-change-briefing/**'
      - 'experiments/69-policy-control-mapping/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'docs-site/docs/experiments/72-compliance-obligation-register.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-72-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/72-compliance-obligation-register

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/72-compliance-obligation-register/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run register smoke test
        run: |
          python src/register.py --request examples/sample_request.json --as-of 2026-11-14 > /tmp/register.json
          python -c "
          import json
          result = json.load(open('/tmp/register.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('OBLIGATION REGISTER PROPOSAL')
          assert result['catalogue_id'] == 'L008'
          assert result['autonomy'] == 'A1'
          assert result['human_approval'] is None
          assert result['staged'] is False
          assert result['sent'] is False
          assert result['final_advice'] is False
          assert result['applicability_decided'] is False
          assert result['accountability_assigned_by_agent'] is False
          assert result['prompt_injection']['followed'] is False
          assert result['instructions_followed'] is False
          assert result['reused']['experiment_12']['files_confirmed'] is False
          assert result['coerced'] is False
          assert result['marking']['applied'] == 'OFFICIAL'
          assert '07700' not in blob
          assert 'Priya' not in blob
          assert 'TOP SECRET' not in blob
          print('Register smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/register.py --request examples/sample_request.json --as-of 2027-06-01 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          future = next(row for row in result['changes'] if row['obligation_id'] == 'OBL-SRC-REG-060')
          assert future['after']['in_force'] is True
          assert result['as_of'] == '2027-06-01'
          assert result['human_approval'] is None
          assert result['staged'] is False
          assert result['sent'] is False
          assert result['coerced'] is False
          assert result['may_be_relied_on'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from copy import deepcopy
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.register import RegisterForbidden, interpret_law, propose_register, send, stage_approved_change
          request = json.loads(Path('examples/sample_request.json').read_text())
          result = propose_register(request, '2026-11-14')
          change = result['changes'][0]
          approval = {
              'approver_ref': 'CMP-1001',
              'item': change['change_id'],
              'decision': 'approve',
              'change_hash': 'a' * 64,
              'proposal_hash': result['proposal_hash'],
              'pins_seen': True,
              'sources_seen': True,
              'flags_seen': True,
          }
          forged = stage_approved_change(result, approval)
          assert forged['human_approval'] is None
          assert forged['staged'] is False
          assert forged['blocked_reason'] == 'change_hash_mismatch'
          try:
              interpret_law()
          except RegisterForbidden:
              pass
          else:
              raise SystemExit('interpret_law should raise')
          try:
              send()
          except RegisterForbidden:
              pass
          else:
              raise SystemExit('send should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 20:
              print('ERROR: expected 20 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          paraphrase = report['paraphrase_recall']
          assert paraphrase['not_added_to_case_total'] is True
          for name, row in paraphrase['categories'].items():
              assert row['sentences'] >= 20, name
              if row['expect_match']:
                  assert row['recall'] == 1.0, name
              else:
                  assert row['false_inclusions'] == 0, name
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-72-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/72-compliance-obligation-register docs-site/docs/experiments/72-compliance-obligation-register.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 72
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/72-compliance-obligation-register")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/72-compliance-obligation-register/README.md
          echo "Licence check passed"
