name: Experiment 59 - New starter guide tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/59-new-starter-guide/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/11-era-2025-hr-assistant/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - 'experiments/21-it-service-desk/**'
      - 'experiments/57-collaboration-space-onboarding/**'
      - 'experiments/58-employee-handbook/**'
      - '.github/workflows/experiment-59-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/59-new-starter-guide/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/11-era-2025-hr-assistant/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - 'experiments/21-it-service-desk/**'
      - 'experiments/57-collaboration-space-onboarding/**'
      - 'experiments/58-employee-handbook/**'
      - 'docs-site/docs/experiments/59-new-starter-guide.md'
      - '.github/workflows/experiment-59-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/59-new-starter-guide

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/59-new-starter-guide/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run draft smoke test
        run: |
          python src/guide.py --pack fixtures/pack.json --directory fixtures/directory.json --scope examples/sample_scope.json --request examples/sample_request.json --as-of 2026-11-17 > /tmp/guide.json
          python -c "
          import json
          result = json.load(open('/tmp/guide.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('DRAFT NEW STARTER GUIDE')
          assert result['catalogue_id'] == 'H002'
          assert result['autonomy'] == 'A1'
          assert result['human_approval'] is None
          assert result['outcome'] == 'draft'
          assert result['role_id'] == 'workshop-technician'
          assert result['role_source'] == 'directory'
          assert result['adjustment_decided'] is None
          assert result['right_to_work_decided'] is None
          assert result['legal_advice'] is False
          assert result['flags']['shared_with_starter'] is False
          assert result['flags']['equipment_requested'] is False
          assert result['flags']['account_created'] is False
          assert result['flags']['access_granted'] is False
          assert result['flags']['training_enrolled'] is False
          assert result['flags']['provisioned'] is False
          assert result['flags']['external_send'] is False
          assert result['flags']['network_called'] is False
          assert result['experiment_21']['grant_access_called'] is False
          assert result['experiment_21']['executed'] is False
          assert result['experiment_11']['compliance_conclusion'] is None
          claims = {row['phrase']: row['included'] for row in result['claims']}
          assert claims['client entertainment'] is False
          assert claims['fire briefing'] is True
          assert 'MEDICAL-FILE-CANARY' not in blob
          assert 'CANARY-DRAFT-BODY' not in blob
          print('Draft smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/guide.py --pack fixtures/pack.json --directory fixtures/directory.json --scope examples/sample_scope.json --request examples/sample_request.json --as-of 2027-06-01 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          assert result['stale']['rules_current'] is False
          assert result['may_be_relied_on'] is False
          assert result['human_approval'] is None
          assert result['flags']['network_called'] is False
          assert result['flags']['equipment_requested'] is False
          assert all(row.get('stale') is True for row in result['statutory'])
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.guide import (
              GuideForbidden, approve_checklist, create_account, draft_guide,
              enrol_training, grant_access, request_equipment, send_externally, share_checklist,
          )
          pack = json.loads(Path('fixtures/pack.json').read_text())
          directory = json.loads(Path('fixtures/directory.json').read_text())
          scope = json.loads(Path('examples/sample_scope.json').read_text())
          request = json.loads(Path('examples/sample_request.json').read_text())
          result = draft_guide(pack, directory, scope, request, '2026-11-17')
          forged = dict(result)
          forged['human_approval'] = {
              'source': 'deterministic_approval_step',
              'actor_id': result['line_manager_id'],
              'actor_role': 'Line manager',
              'decision': 'approve',
              'checklist_id': result['checklist_id'],
              'item_digest': result['item_digest'],
              'approval_reference': 'RB-NS-5901',
          }
          refused = share_checklist(forged)
          assert refused['flags']['shared_with_starter'] is False
          wrong = approve_checklist(result, {
              'actor_id': 'SYN-MGR-5902',
              'actor_role': 'Line manager',
              'decision': 'approve',
              'checklist_id': result['checklist_id'],
              'item_digest': result['item_digest'],
              'approval_reference': 'RB-NS-5904',
          })
          assert wrong['human_approval'] is None
          for function in (request_equipment, create_account, grant_access, enrol_training, send_externally):
              try:
                  function()
              except GuideForbidden:
                  pass
              else:
                  raise SystemExit(function.__name__ + ' should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 18:
              print('ERROR: expected 18 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-59-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/59-new-starter-guide docs-site/docs/experiments/59-new-starter-guide.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 59
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/59-new-starter-guide")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/59-new-starter-guide/README.md
          echo "Licence check passed"
