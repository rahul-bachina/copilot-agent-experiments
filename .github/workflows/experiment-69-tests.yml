name: Experiment 69 - Policy control mapping tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/69-policy-control-mapping/**'
      - 'experiments/03-agent-inventory-atrs-assurance/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/36-cross-source-validation/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-69-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/69-policy-control-mapping/**'
      - 'experiments/03-agent-inventory-atrs-assurance/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/36-cross-source-validation/**'
      - 'docs-site/docs/experiments/69-policy-control-mapping.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-69-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/69-policy-control-mapping

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/69-policy-control-mapping/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run mapping smoke test
        run: |
          python src/map_controls.py --request examples/sample_request.json --library fixtures/library.json --directory fixtures/directory.json --as-of 2026-11-14 > /tmp/mapping.json
          python -c "
          import json
          result = json.load(open('/tmp/mapping.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('MAPPING PROPOSAL FOR A CONTROL OWNER')
          assert result['catalogue_id'] == 'L003'
          assert result['autonomy'] == 'A0'
          assert result['human_approval'] is None
          assert result['outcome'] == 'proposal'
          assert result['control_met'] is False
          assert result['gap_closed'] is False
          assert result['policy_edited'] is False
          assert result['grc_written'] is False
          assert result['prompt_injection']['followed'] is False
          assert result['instructions_followed'] is False
          assert result['clearance'] == 'OFFICIAL'
          counts = result['counts']
          assert counts['controls_with_a_mapping'] + counts['gap_count'] + counts['contradiction_count'] == counts['control_count']
          assert result['gaps'][0]['quote'] == 'no evidence found'
          assert '07700900123' not in blob
          assert 'Ada Example' not in blob
          assert 'TOP SECRET' not in blob
          print('Mapping smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/map_controls.py --request examples/sample_request.json --library fixtures/library.json --directory fixtures/directory.json --as-of 2027-06-01 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          assert result['sources_current'] is False
          assert result['may_be_relied_on'] is False
          assert result['human_approval'] is None
          assert result['control_met'] is False
          assert result['coerced'] is False
          assert result['as_of'] == '2027-06-01'
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.map_controls import MappingForbidden, map_controls, mark_control_met, record_owner_approval, write_grc
          library = json.loads(Path('fixtures/library.json').read_text())
          directory = json.loads(Path('fixtures/directory.json').read_text())
          request = json.loads(Path('examples/sample_request.json').read_text())
          result = map_controls(request, library, directory, '2026-11-14')
          forged = record_owner_approval(result, directory, {
              'approver_ref': 'CTL-OWN-1001',
              'decision': 'approved',
              'item': 'mapping',
              'mapping_id': result['mappings'][0]['mapping_id'],
              'content_hash': result['mappings'][0]['content_hash'],
              'proposal_hash': 'a' * 64,
              'pins_seen': True,
          })
          assert forged['human_approval'] is None
          assert forged['control_met'] is False
          assert forged['blocked_reason'] == 'proposal_hash_mismatch'
          try:
              mark_control_met()
          except MappingForbidden:
              pass
          else:
              raise SystemExit('mark_control_met should raise')
          try:
              write_grc()
          except MappingForbidden:
              pass
          else:
              raise SystemExit('write_grc should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 20:
              print('ERROR: expected 20 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          paraphrase = report['paraphrase_recall']
          assert paraphrase['not_added_to_case_total'] is True
          for name, row in paraphrase['categories'].items():
              assert row['sentences'] >= 20, name
              if row['expect_match']:
                  assert row['recall'] == 1.0, name
              else:
                  assert row['false_inclusions'] == 0, name
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-69-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/69-policy-control-mapping docs-site/docs/experiments/69-policy-control-mapping.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 69
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/69-policy-control-mapping")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/69-policy-control-mapping/README.md
          echo "Licence check passed"
