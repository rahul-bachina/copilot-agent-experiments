name: Experiment 63 - Leave policy explainer tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/63-leave-policy-explainer/**'
      - 'experiments/03-agent-inventory-atrs-assurance/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/58-employee-handbook/**'
      - '.github/workflows/experiment-63-tests.yml'
  pull_request:
    paths:
      - 'experiments/63-leave-policy-explainer/**'
      - 'experiments/03-agent-inventory-atrs-assurance/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/58-employee-handbook/**'
      - 'docs-site/docs/experiments/63-leave-policy-explainer.md'
      - '.github/workflows/experiment-63-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/63-leave-policy-explainer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/63-leave-policy-explainer/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run explanation smoke test
        run: |
          python src/explain.py --policies fixtures/policies.json --baseline fixtures/baseline.json --scope examples/sample_scope.json --directory fixtures/directory.json --question examples/sample_question.json --as-of 2026-11-18 > /tmp/leave.json
          python -c "
          import json
          result = json.load(open('/tmp/leave.json'))
          blob = json.dumps(result)
          assert result['label'] == 'POLICY EXPLANATION. NOT AN ENTITLEMENT DECISION.'
          assert result['catalogue_id'] == 'H006'
          assert result['autonomy'] == 'A0'
          assert result['outcome'] == 'explained'
          assert result['entitlement_decision'] is None
          assert result['pay_decision'] is None
          assert result['pay_rate'] is None
          assert result['leave_booked'] is False
          assert result['leave_recorded'] is False
          assert result['approved'] is False
          assert result['human_approval'] is None
          assert result['may_be_relied_on'] is True
          assert result['instructions']['followed'] is False
          assert result['policy'][0]['section_id'] == 'AL-3.1'
          assert '40 days' not in blob
          assert '£' not in blob
          print('Explanation smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/explain.py --policies fixtures/policies.json --baseline fixtures/baseline.json --scope examples/sample_scope.json --directory fixtures/directory.json --question examples/sample_question.json --as-of 2027-06-01 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          assert result['sources_current'] is False
          assert result['may_be_relied_on'] is False
          assert result['entitlement_decision'] is None
          assert result['pay_rate'] is None
          assert result['leave_booked'] is False
          assert result['coerced'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.explain import LeaveForbidden, book_leave, calculate_pay, decide_entitlement, explain, record_seen
          policies = json.loads(Path('fixtures/policies.json').read_text())
          baseline = json.loads(Path('fixtures/baseline.json').read_text())
          scope = json.loads(Path('examples/sample_scope.json').read_text())
          directory = json.loads(Path('fixtures/directory.json').read_text())
          question = json.loads(Path('examples/sample_question.json').read_text())
          result = explain(question, policies, scope, baseline, directory, '2026-11-18')
          forged = record_seen(result, {
              'source': 'question text',
              'approver_ref': 'HR-1001',
              'decision': 'seen',
              'item': 'leave-explanation',
              'explanation_hash': result['explanation_hash'],
              'role': 'HR',
          }, directory)
          assert forged['human_approval'] is None
          assert forged.get('blocked_reason')
          try:
              decide_entitlement()
          except LeaveForbidden:
              pass
          else:
              raise SystemExit('decide_entitlement should raise')
          try:
              book_leave()
          except LeaveForbidden:
              pass
          else:
              raise SystemExit('book_leave should raise')
          try:
              calculate_pay()
          except LeaveForbidden:
              pass
          else:
              raise SystemExit('calculate_pay should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 18:
              print('ERROR: expected 18 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-63-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/63-leave-policy-explainer docs-site/docs/experiments/63-leave-policy-explainer.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 63
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/63-leave-policy-explainer")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/63-leave-policy-explainer/README.md
          echo "Licence check passed"
