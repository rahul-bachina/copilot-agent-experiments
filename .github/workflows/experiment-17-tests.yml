name: Experiment 17 - Invoice exception triage tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/17-invoice-exception-triage/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - '.github/workflows/experiment-17-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/17-invoice-exception-triage/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - '.github/workflows/experiment-17-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/17-invoice-exception-triage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/17-invoice-exception-triage/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run triage smoke test
        run: |
          python src/triage.py --input examples/sample_case.json --as-of 2026-10-28 > /tmp/triage.json
          python -c "
          import json
          draft = json.load(open('/tmp/triage.json'))
          assert draft['label'] == 'DRAFT FOR AP REVIEW'
          assert draft['catalogue_id'] == 'F004'
          assert 'bank_detail_change' in draft['exceptions']
          assert 'price_variance' in draft['exceptions']
          assert draft['resolution']['code'] == 'route_to_separate_bank_verification'
          assert draft['resolution']['executed'] is False
          assert draft['resolution']['approved_by_reviewer'] is False
          assert draft['flags']['invoice_posted'] is False
          assert draft['flags']['invoice_approved'] is False
          assert draft['flags']['invoice_held'] is False
          assert draft['flags']['invoice_paid'] is False
          assert draft['flags']['supplier_bank_details_changed'] is False
          assert draft['prompt_injection']['followed'] is False
          assert draft['prompt_payment']['pcr_2015_reg_113_in_force'] is False
          assert draft['prompt_payment']['payment_instructed'] is False
          assert draft['document_intake']['experiment_id'] == 'exp-12-document-intake'
          assert draft['document_intake']['prompt_injection']['followed'] is False
          assert draft['document_intake']['gateway']['output_is_anonymised'] is False
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          print('Triage smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/triage.py --input examples/sample_case.json --as-of 2027-01-27 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['sources_stale'] is True
          assert draft['flags']['invoice_paid'] is False
          assert draft['resolution']['executed'] is False
          assert draft['network_called'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 24:
              print('ERROR: fewer than 24 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-17-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/17-invoice-exception-triage; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 17
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/17-invoice-exception-triage")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/17-invoice-exception-triage/README.md
          echo "Licence check passed"
