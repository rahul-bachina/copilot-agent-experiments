name: Experiment 20 - Complaints root-cause MI tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/20-complaints-root-cause-mi/**'
      - 'experiments/02-consumer-duty-complaint-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - '.github/workflows/experiment-20-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/20-complaints-root-cause-mi/**'
      - 'experiments/02-consumer-duty-complaint-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - '.github/workflows/experiment-20-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/20-complaints-root-cause-mi

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/20-complaints-root-cause-mi/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run draft smoke test
        run: |
          python src/report.py --input examples/sample_batch.json --as-of 2026-10-29 > /tmp/draft.json
          python -c "
          import json
          draft = json.load(open('/tmp/draft.json'))
          blob = json.dumps(draft)
          assert draft['label'].startswith('DRAFT MANAGEMENT INFORMATION')
          assert draft['catalogue_id'] == 'UK04'
          assert draft['autonomy'] == 'A0'
          assert draft['is_final_regulatory_return'] is False
          assert draft['submitted'] is False
          assert draft['published'] is False
          assert draft['sent'] is False
          assert draft['clusters_validated'] is False
          assert draft['narrative_validated'] is False
          assert draft['complying_with_consumer_duty'] is None
          assert draft['code_compliant'] is None
          assert draft['ofgem_return_complete'] is None
          assert draft['actions_taken'] == []
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['output_is_anonymised'] is False
          assert draft['agent_may_release'] is False
          assert draft['sources_pinned_on'] == '2026-10-29'
          assert draft['sources_stale'] is False
          assert draft['prompt_injection']['detected'] is True
          assert draft['prompt_injection']['followed'] is False
          assert draft['records'][0]['theme'] == 'fees_and_charges'
          assert draft['figures']['redress_pence']['value'] == 1000
          assert draft['figures']['redress_pence']['record_ids'] == ['FS1']
          assert 'QQ 12 34 56 A' not in blob
          print('Draft smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/report.py --input examples/sample_batch.json --as-of 2027-04-01 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['sources_stale'] is True
          assert draft['is_final_regulatory_return'] is False
          assert draft['clusters_validated'] is False
          assert draft['narrative_validated'] is False
          assert draft['submitted'] is False
          assert draft['published'] is False
          assert draft['sent'] is False
          assert draft['complying_with_consumer_duty'] is None
          assert draft['ofgem_return_complete'] is None
          assert draft['network_called'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 24:
              print('ERROR: fewer than 24 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-20-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/20-complaints-root-cause-mi; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 20
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/20-complaints-root-cause-mi")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/20-complaints-root-cause-mi/README.md
          echo "Licence check passed"
