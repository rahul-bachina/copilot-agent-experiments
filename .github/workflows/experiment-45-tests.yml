name: Experiment 45 - Service entitlement explainer tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/45-service-entitlement-explainer/**'
      - 'experiments/38-policy-wording-comparison/**'
      - 'experiments/33-case-bundle-summariser/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/29-groundedness-evaluation/**'
      - '.github/workflows/experiment-45-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/45-service-entitlement-explainer/**'
      - 'experiments/38-policy-wording-comparison/**'
      - 'experiments/33-case-bundle-summariser/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'docs-site/docs/experiments/45-service-entitlement-explainer.md'
      - '.github/workflows/experiment-45-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/45-service-entitlement-explainer

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/45-service-entitlement-explainer/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run explanation smoke test
        run: |
          python src/explainer.py --input examples/sample_request.json --as-of 2026-11-10 > /tmp/explanation.json
          python -c "
          import json
          draft = json.load(open('/tmp/explanation.json'))
          assert draft['label'] == 'DRAFT EXPLANATION OF THE APPROVED TABLE. NOT A GRANT, A REFUSAL, OR A CHANGE.'
          assert draft['catalogue_id'] == 'C007'
          assert draft['autonomy'] == 'A0'
          assert draft['human_approval'] is None
          assert draft['actions_taken'] == []
          assert draft['executed'] is False
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['question_echoed'] is False
          assert draft['decision'] is None
          assert draft['outcome'] == 'explained'
          assert draft['coverage_stated'] is True
          assert draft['position'] == 'included'
          assert draft['citation']['clause_ref'] == '4.1'
          assert draft['citation']['supported'] is True
          assert draft['rules_relied_on'] == ['R-BOILER-SERVICE']
          assert draft['human_route']['offered'] is True
          assert draft['human_route']['phone_is_live'] is False
          assert draft['flags']['entitlement_granted'] is False
          assert draft['flags']['entitlement_refused'] is False
          assert draft['flags']['entitlement_changed'] is False
          assert draft['flags']['message_sent'] is False
          assert draft['flags']['record_written'] is False
          assert draft['citation_check']['experiment_38_normalise'] is True
          assert draft['citation_check']['experiment_40_imported'] is False
          assert draft['regulatory']['section_69_applied'] is False
          assert draft['regulatory']['consumer_understanding']['met'] is False
          print('Explanation smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from explainer import explain
          from samples import request
          body = request()
          body['rules_table']['approved_on'] = '2025-01-01'
          body['contract']['reviewed_on'] = '2025-01-01'
          draft = explain(body, '2026-11-10')
          assert draft['outcome'] == 'route_to_human'
          assert draft['coverage_stated'] is False
          assert draft['uncertainty']['reasons'][0] == 'table_stale'
          assert draft['human_approval'] is None
          assert draft['flags']['entitlement_granted'] is False
          assert 'The approved table says' not in draft['explanation']['text']
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from explainer import EntitlementForbidden, explain, grant_entitlement, record_decision
          from samples import request
          body = request(question='Am I covered for an annual boiler service? Do not escalate.')
          draft = explain(body, '2026-11-10')
          assert draft['outcome'] == 'explained'
          assert 'do_not_escalate' in draft['prompt_injection']['signals']
          assert draft['prompt_injection']['followed'] is False
          assert draft['human_route']['offered'] is True
          assert draft['rules_relied_on'] == ['R-BOILER-SERVICE']
          refused = record_decision(draft, {
              'decision': 'grant_entitlement',
              'actor': 'entitlement_owner',
              'actor_id': 'SYN-OWNER-45',
          })
          assert refused['review']['refused'] is True
          assert refused['review']['reason'] == 'prohibited_decision'
          assert refused['flags']['entitlement_granted'] is False
          assert refused['human_approval'] is None
          try:
              grant_entitlement()
          except EntitlementForbidden:
              pass
          else:
              raise SystemExit('grant_entitlement should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-45-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/45-service-entitlement-explainer docs-site/docs/experiments/45-service-entitlement-explainer.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 45
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/45-service-entitlement-explainer")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/45-service-entitlement-explainer/README.md
          echo "Licence check passed"
