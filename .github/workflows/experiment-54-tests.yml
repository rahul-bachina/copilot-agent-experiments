name: Experiment 54 - Excel assumption review tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/54-excel-assumption-review/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - 'experiments/30-agent-regression-test-generator/**'
      - 'experiments/36-cross-source-validation/**'
      - '.github/workflows/experiment-54-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/54-excel-assumption-review/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - 'experiments/30-agent-regression-test-generator/**'
      - 'experiments/36-cross-source-validation/**'
      - 'docs-site/docs/experiments/54-excel-assumption-review.md'
      - '.github/workflows/experiment-54-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/54-excel-assumption-review

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/54-excel-assumption-review/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run review smoke test
        run: |
          python src/review.py --input examples/sample_pack.json --confirm examples/scope_confirmation.json --as-of 2026-11-13 > /tmp/review.json
          python -c "
          import json
          report = json.load(open('/tmp/review.json'))
          assert report['label'].startswith('REVIEW FOR THE MODEL OWNER')
          assert report['catalogue_id'] == 'M006'
          assert report['autonomy'] == 'A0'
          assert report['outcome'] == 'review_for_model_owner'
          assert report['human_approval']['step'] == 'confirm_workbook_ranges_and_formulas'
          assert report['human_approval']['findings_accepted'] is None
          assert report['actions_taken'] == []
          assert report['executed'] is False
          assert report['model_called'] is False
          assert report['network_called'] is False
          assert report['flags']['workbook_modified'] is False
          assert report['flags']['assumption_judged'] is False
          assert report['flags']['benchmark_invented'] is False
          assert report['flags']['graph_called'] is False
          assert report['sensitivity']['baseline'] == '169014.3'
          assert report['protective_marking'] == 'OFFICIAL-SENSITIVE'
          assert report['retention_label'] == 'legal-hold'
          blob = json.dumps(report)
          assert 'jane.example@northmere.example' not in blob
          assert '07700900123' not in blob
          assert 'Jane Example' not in blob
          assert report['prompt_injection']['followed'] is False
          assert report['human_route']['agent_edits_workbook'] is False
          print('Review smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/review.py --input examples/sample_pack.json --confirm examples/scope_confirmation.json --as-of 2027-05-13 > /tmp/stale.json
          python -c "
          import json
          report = json.load(open('/tmp/stale.json'))
          assert report['stale']['rules_current'] is False
          assert report['outcome'] == 'stale_sources'
          assert report['ranges_inspected'] == []
          assert report['human_approval'] is None
          assert report['network_called'] is False
          assert report['flags']['workbook_modified'] is False
          assert report['protective_marking'] == 'OFFICIAL-SENSITIVE'
          assert report['retention_label'] == 'legal-hold'
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from review import ReviewForbidden, edit_workbook, assert_assumption, invent_benchmark
          for function in (edit_workbook, assert_assumption, invent_benchmark):
              try:
                  function()
              except ReviewForbidden:
                  pass
              else:
                  raise SystemExit(function.__name__ + ' should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-54-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/54-excel-assumption-review docs-site/docs/experiments/54-excel-assumption-review.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 54
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/54-excel-assumption-review")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/54-excel-assumption-review/README.md
          echo "Licence check passed"
