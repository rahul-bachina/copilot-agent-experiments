name: Experiment 33 - Case-bundle summariser tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/33-case-bundle-summariser/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/33-case-bundle-summariser.md'
      - '.github/workflows/experiment-33-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/33-case-bundle-summariser/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/33-case-bundle-summariser.md'
      - '.github/workflows/experiment-33-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/33-case-bundle-summariser

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/33-case-bundle-summariser/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run sample smoke test
        run: |
          python src/summarise.py --bundle examples/sample_bundle.json --as-of 2026-11-04 > /tmp/summary.json
          python -c "
          import json
          draft = json.load(open('/tmp/summary.json'))
          assert draft['label'] == 'DRAFT FOR THE DECISION-MAKER. NOT A DECISION.'
          assert draft['catalogue_id'] == 'UK09'
          assert draft['autonomy'] == 'A0'
          assert draft['case_outcome'] is None
          assert draft['disclosure_decision'] is None
          assert draft['credibility_finding'] is None
          assert draft['outcome_recommended'] is False
          assert draft['summary_accepted_as_reading_aid'] is False
          assert draft['sentences_reviewed_by_decision_maker'] is False
          assert draft['summary_is_not_a_decision'] is True
          assert draft['actions_taken'] == []
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['foundry_called'] is False
          assert draft['a3_recommended'] is False
          assert draft['checker_passed'] is True
          assert draft['do_not_rely'] is True
          assert draft['summary']['sentence_count'] == 2
          assert draft['summary']['extractive_sentence_count'] == 2
          assert draft['summary']['failure_count'] == 0
          assert draft['summary']['verdict_total'] == 2
          assert draft['summary']['verdicts']['supported'] == 2
          assert draft['summary']['gap_count'] == 0
          assert draft['summary']['contradiction_count'] == 0
          assert draft['summary']['not_used_count'] == 3
          assert sum(draft['summary']['verdicts'].values()) == draft['summary']['sentence_count']
          assert draft['prompt_injection']['followed'] is False
          print('Sample smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/summarise.py --bundle examples/sample_bundle.json --as-of 2027-03-01 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['do_not_rely'] is True
          assert draft['pins_stale'] is True
          assert draft['case_outcome'] is None
          assert draft['disclosure_decision'] is None
          assert draft['credibility_finding'] is None
          assert draft['summary_accepted_as_reading_aid'] is False
          assert draft['a3_recommended'] is False
          assert draft['network_called'] is False
          assert draft['foundry_called'] is False
          opened = [row for row in draft['sources'] if row.get('stale_applicable')]
          assert opened and all(row['stale'] is True for row in opened)
          boundary = next(row for row in draft['sources'] if row['id'] == 'catalogue-boundary')
          assert boundary['stale'] is False
          assert boundary['reopened_for_this_experiment'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          for flag in recommend-outcome decide-disclosure find-credible accept-summary send write-record; do
            set +e
            python src/summarise.py --bundle examples/sample_bundle.json --as-of 2026-11-04 --$flag > /tmp/prohibited.json
            code=$?
            set -e
            test "$code" -eq 2
            test ! -s /tmp/prohibited.json
          done
          echo "Prohibited-action smoke test passed"

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert report['foundry_called'] is False
          assert report['sentences_added_to_total_cases'] is False
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          assert 'Not a case outcome' in report['evaluation_label']
          summary = report['summary']
          assert summary['passed'] + summary['failed'] == summary['total_cases']
          assert 'errors' not in summary
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['failed']:
              print(f\"ERROR: {summary['failed']} failed\")
              raise SystemExit(1)
          if summary['total_cases'] < 26:
              print('ERROR: fewer than 26 cases')
              raise SystemExit(1)
          sentence_sum = sum(row['sentence_count'] or 0 for row in report['cases'])
          if sentence_sum == summary['total_cases']:
              print('ERROR: sentence counts and case counts were collapsed')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-33-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/33-case-bundle-summariser docs-site/docs/experiments/33-case-bundle-summariser.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No prices copied
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          roots = [
              Path("experiments/33-case-bundle-summariser"),
              Path("docs-site/docs/experiments/33-case-bundle-summariser.md"),
          ]
          price = re.compile(r"(£|€|\$\d|free of charge|\d+ Copilot Credits)", re.I)
          failed = False
          for root in roots:
              if not root.exists():
                  continue
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml"}:
                      continue
                  if price.search(path.read_text(errors="ignore")):
                      print(f"Price-like text in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Price check passed")
          PY

      - name: No obvious secrets in Experiment 33
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/33-case-bundle-summariser")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/33-case-bundle-summariser/README.md
          echo "Licence check passed"
