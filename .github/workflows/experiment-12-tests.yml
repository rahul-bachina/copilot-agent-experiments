name: Experiment 12 - Document intake tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/12-document-intake/**'
      - '.github/workflows/experiment-12-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/12-document-intake/**'
      - '.github/workflows/experiment-12-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/12-document-intake

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/12-document-intake/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run intake smoke test
        run: |
          python src/intake.py --input examples/sample_batch.json --as-of 2026-10-27 > /tmp/intake.json
          python -c "
          import json
          draft = json.load(open('/tmp/intake.json'))
          assert draft['label'] == 'DRAFT FOR INTAKE REVIEW'
          assert draft['files_confirmed'] is False
          assert draft['purpose_confirmed'] is False
          assert draft['reviewer_decision'] is None
          assert draft['actions_taken'] == []
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['catalogue_pinned_on'] == '2026-10-27'
          assert draft['catalogue_stale'] is False
          assert draft['prompt_injection']['detected'] is True
          assert draft['prompt_injection']['followed'] is False
          assert draft['flags']['accepted_into_queue'] is False
          assert draft['flags']['external_sent'] is False
          assert draft['flags']['production_record_written'] is False
          assert draft['flags']['redacted_text_released'] is False
          assert draft['gateway']['output_is_anonymised'] is False
          assert draft['gateway']['agent_may_release'] is False
          print('Intake smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/intake.py --input examples/sample_batch.json --as-of 2027-04-01 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['catalogue_stale'] is True
          assert draft['any_document_stale'] is True
          assert draft['rules_current'] is False
          assert draft['files_confirmed'] is False
          assert draft['purpose_confirmed'] is False
          assert draft['reviewer_decision'] is None
          assert draft['network_called'] is False
          assert all(row['date_status'] == 'stale' for row in draft['files'])
          print('Stale-data smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-12-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/12-document-intake; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 12
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/12-document-intake")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/12-document-intake/README.md
          echo "Licence check passed"
