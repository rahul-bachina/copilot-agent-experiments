name: Experiment 28 - Prompt Injection Test Agent tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/28-prompt-injection-test/**'
      - 'experiments/01-foi-complaint-triage/copilot-studio/system-prompt.md'
      - 'experiments/01-foi-complaint-triage/schema/tools.json'
      - 'experiments/01-foi-complaint-triage/agent-manifest.yaml'
      - 'experiments/03-agent-inventory-atrs-assurance/src/**'
      - 'experiments/08-uk-pii-redaction-gateway/src/**'
      - 'experiments/08-uk-pii-redaction-gateway/copilot-studio/system-prompt.md'
      - 'experiments/08-uk-pii-redaction-gateway/schema/tools.json'
      - 'experiments/08-uk-pii-redaction-gateway/agent-manifest.yaml'
      - 'experiments/12-document-intake/copilot-studio/system-prompt.md'
      - 'experiments/12-document-intake/schema/tools.json'
      - 'experiments/12-document-intake/agent-manifest.yaml'
      - 'experiments/25-instruction-quality-reviewer/src/**'
      - 'experiments/25-instruction-quality-reviewer/copilot-studio/system-prompt.md'
      - 'experiments/25-instruction-quality-reviewer/schema/tools.json'
      - 'experiments/25-instruction-quality-reviewer/agent-manifest.yaml'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/28-prompt-injection-test.md'
      - '.github/workflows/experiment-28-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/28-prompt-injection-test/**'
      - 'experiments/01-foi-complaint-triage/copilot-studio/system-prompt.md'
      - 'experiments/01-foi-complaint-triage/schema/tools.json'
      - 'experiments/01-foi-complaint-triage/agent-manifest.yaml'
      - 'experiments/03-agent-inventory-atrs-assurance/src/**'
      - 'experiments/08-uk-pii-redaction-gateway/src/**'
      - 'experiments/08-uk-pii-redaction-gateway/copilot-studio/system-prompt.md'
      - 'experiments/08-uk-pii-redaction-gateway/schema/tools.json'
      - 'experiments/08-uk-pii-redaction-gateway/agent-manifest.yaml'
      - 'experiments/12-document-intake/copilot-studio/system-prompt.md'
      - 'experiments/12-document-intake/schema/tools.json'
      - 'experiments/12-document-intake/agent-manifest.yaml'
      - 'experiments/25-instruction-quality-reviewer/src/**'
      - 'experiments/25-instruction-quality-reviewer/copilot-studio/system-prompt.md'
      - 'experiments/25-instruction-quality-reviewer/schema/tools.json'
      - 'experiments/25-instruction-quality-reviewer/agent-manifest.yaml'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/28-prompt-injection-test.md'
      - '.github/workflows/experiment-28-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/28-prompt-injection-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/28-prompt-injection-test/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run sandbox smoke test
        run: |
          python src/run.py --bundle examples/sample_bundle.json --as-of 2026-11-02 > /tmp/report.json
          python -c "
          import json
          draft = json.load(open('/tmp/report.json'))
          assert draft['label'] == 'DRAFT FOR SECURITY REVIEWER'
          assert draft['catalogue_id'] == 'G006'
          assert draft['autonomy'] == 'A0'
          assert draft['reviewer_assessed'] is False
          assert draft['remediation_applied'] is False
          assert draft['published'] is False
          assert draft['production_targeted'] is False
          assert draft['actions_taken'] == []
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['foundry_red_team_called'] is False
          assert draft['a3_recommended'] is False
          assert draft['suite_version'] == '2026.1'
          assert draft['summary']['passed'] == 20
          assert draft['summary']['failed'] == 0
          assert draft['scoring_double'] is False
          assert draft['do_not_rely'] is False
          text = json.dumps(draft)
          assert 'QQ 12 34 56 A' not in text
          print('Sandbox smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/run.py --bundle examples/sample_bundle.json --as-of 2027-05-01 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['do_not_rely'] is True
          assert draft['reviewer_assessed'] is False
          assert draft['remediation_applied'] is False
          assert draft['published'] is False
          assert draft['a3_recommended'] is False
          assert draft['network_called'] is False
          assert draft['summary']['passed'] == 20
          opened = [row for row in draft['sources'] if row.get('stale_applicable')]
          assert opened and all(row['stale'] is True for row in opened)
          boundary = next(row for row in draft['sources'] if row['id'] == 'catalogue-boundary')
          assert boundary['stale'] is False
          assert boundary['reopened_for_this_experiment'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          set +e
          python src/run.py --bundle examples/sample_bundle.json --as-of 2026-11-02 --assess > /tmp/assess.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/assess.json
          set +e
          python src/run.py --bundle examples/sample_bundle.json --as-of 2026-11-02 --remediate > /tmp/remediate.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/remediate.json
          set +e
          python src/run.py --bundle examples/sample_bundle.json --as-of 2026-11-02 --publish > /tmp/publish.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/publish.json
          echo "Prohibited-action smoke test passed"

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert report['not_an_attack_success_rate'] is True
          assert report['foundry_red_team_called'] is False
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-28-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/28-prompt-injection-test docs-site/docs/experiments/28-prompt-injection-test.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No prices copied
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          roots = [
              Path("experiments/28-prompt-injection-test"),
              Path("docs-site/docs/experiments/28-prompt-injection-test.md"),
          ]
          price = re.compile(r"(£|€|\$\d|free of charge|\d+ Copilot Credits)", re.I)
          failed = False
          for root in roots:
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml"}:
                      continue
                  if price.search(path.read_text(errors="ignore")):
                      print(f"Price-like text in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Price check passed")
          PY

      - name: No obvious secrets in Experiment 28
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/28-prompt-injection-test")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/28-prompt-injection-test/README.md
          echo "Licence check passed"
