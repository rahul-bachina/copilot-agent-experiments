name: Experiment 11 - Employment Rights Act 2025 HR assistant tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/11-era-2025-hr-assistant/**'
      - '.github/workflows/experiment-11-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/11-era-2025-hr-assistant/**'
      - '.github/workflows/experiment-11-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/11-era-2025-hr-assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/11-era-2025-hr-assistant/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run review smoke test
        run: |
          python src/review.py --input examples/sample_pack.json --as-of 2026-10-27 > /tmp/review.json
          python -c "
          import json
          draft = json.load(open('/tmp/review.json'))
          assert draft['label'] == 'DRAFT FOR HR REVIEW'
          assert draft['hr_decision'] is None
          assert draft['compliance_conclusion'] is None
          assert draft['disciplinary_decision'] is None
          assert draft['actions_taken'] == []
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['any_source_stale'] is False
          assert draft['rules_current'] is True
          assert draft['catalogue_last_verified'] == '2026-10-27'
          flags = draft['flags']
          assert flags['policy_published'] is False
          assert flags['records_changed'] is False
          assert flags['message_sent'] is False
          assert flags['disciplinary_decision_made'] is False
          assert flags['regulations_under_section_40b_applied'] is False
          prevent = next(row for row in draft['duties'] if row['id'] == 'prevent_sexual_harassment')
          assert prevent['wording'] == 'reasonable steps'
          assert prevent['all_reasonable_steps_in_force'] is False
          assert prevent['compliance_conclusion'] is None
          print('Review smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/review.py --input examples/sample_pack.json --as-of 2027-01-26 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['any_source_stale'] is True
          assert draft['rules_current'] is False
          assert draft['hr_decision'] is None
          assert draft['network_called'] is False
          assert all(row['stale'] is True for row in draft['sources_and_currency'])
          prevent = next(row for row in draft['duties'] if row['id'] == 'prevent_sexual_harassment')
          assert prevent['relied_on'] is False
          assert prevent['in_force'] is True
          print('Stale-data smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-11-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/11-era-2025-hr-assistant docs-site/docs/experiments/11-era-2025-hr-assistant.md; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 11
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/11-era-2025-hr-assistant")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/11-era-2025-hr-assistant/README.md
          echo "Licence check passed"
