name: Experiment 40 - Customer self-service tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/40-customer-self-service/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/02-consumer-duty-complaint-intake/**'
      - '.github/workflows/experiment-40-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/40-customer-self-service/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/02-consumer-duty-complaint-intake/**'
      - 'docs-site/docs/experiments/40-customer-self-service.md'
      - '.github/workflows/experiment-40-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/40-customer-self-service

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/40-customer-self-service/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run reply smoke test
        run: |
          python src/service.py --input examples/sample_enquiry.json --as-of 2026-11-06 > /tmp/reply.json
          python -c "
          import json
          draft = json.load(open('/tmp/reply.json'))
          assert draft['label'] == 'DRAFT FOR CUSTOMER SERVICE REVIEW'
          assert draft['catalogue_id'] == 'C001'
          assert draft['autonomy'] == 'A1'
          assert draft['human_approval'] is None
          assert draft['actions_taken'] == []
          assert draft['executed'] is False
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['enquiry_text_echoed'] is False
          assert draft['outcome'] == 'knowledge_answer'
          assert draft['article']['id'] == 'kb-energy-meter-reading'
          assert draft['article']['body_quoted'] is True
          assert draft['human_route']['offered'] is True
          assert draft['human_route']['phone_is_live'] is False
          assert draft['flags']['password_reset'] is False
          assert draft['flags']['payment_taken'] is False
          assert draft['flags']['complaint_closed'] is False
          assert draft['flags']['tariff_changed'] is False
          assert draft['flags']['contract_changed'] is False
          assert draft['flags']['record_changed'] is False
          assert draft['flags']['message_sent'] is False
          assert draft['pii_gateway']['output_is_anonymised'] is False
          assert draft['pii_gateway']['agent_may_release'] is False
          assert 'automated AI chatbot' in draft['ai_disclosure']
          assert draft['regulatory']['ofgem']['licence_condition_verified'] is False
          assert draft['regulatory']['significant_decision_taken'] is False
          print('Reply smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/service.py --input examples/sample_enquiry.json --as-of 2027-11-06 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          blob = json.dumps(draft)
          assert draft['any_source_stale'] is True
          assert draft['rules_current'] is False
          assert draft['outcome'] == 'stale_article'
          assert draft['human_approval'] is None
          assert draft['network_called'] is False
          assert draft['flags']['stale_article_quoted'] is False
          assert draft['flags']['record_changed'] is False
          assert 'does not submit the reading' not in blob
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from service import ServiceForbidden, draft_reply, record_review, reset_password
          enquiry = json.loads(Path('examples/sample_enquiry.json').read_text())
          enquiry['text'] = 'I forgot my password.'
          draft = draft_reply(enquiry, '2026-11-06')
          assert draft['outcome'] == 'prohibited_password'
          refused = record_review(draft, {
              'decision': 'reset_password',
              'actor': 'customer',
              'actor_id': 'SYN-ACC-1040',
          })
          assert refused['review']['refused'] is True
          assert refused['review']['reason'] == 'prohibited_decision'
          assert refused['flags']['password_reset'] is False
          assert refused['human_approval'] is None
          try:
              reset_password()
          except ServiceForbidden:
              pass
          else:
              raise SystemExit('reset_password should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-40-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/40-customer-self-service docs-site/docs/experiments/40-customer-self-service.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 40
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/40-customer-self-service")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/40-customer-self-service/README.md
          echo "Licence check passed"
