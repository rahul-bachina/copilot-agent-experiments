name: Experiment 67 - Contract clause review tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/67-contract-clause-review/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/27-tool-contract-review/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-67-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/67-contract-clause-review/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/27-tool-contract-review/**'
      - 'docs-site/docs/experiments/67-contract-clause-review.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-67-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/67-contract-clause-review

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/67-contract-clause-review/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run review smoke test
        run: |
          python src/review.py --request examples/sample_request.json --playbook fixtures/playbook.json --directory fixtures/directory.json --as-of 2026-11-14 > /tmp/review.json
          python -c "
          import json
          result = json.load(open('/tmp/review.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('CLAUSE COMPARISON FOR A LAWYER')
          assert result['catalogue_id'] == 'L001'
          assert result['autonomy'] == 'A0'
          assert result['human_approval'] is None
          assert result['outcome'] == 'comparison'
          assert result['terms_accepted'] is False
          assert result['signed'] is False
          assert result['sent'] is False
          assert result['legal_advice'] is False
          assert result['marked_safe'] is False
          assert result['article_28_complied'] is False
          assert result['prompt_injection']['followed'] is False
          assert result['instructions_followed'] is False
          assert result['clearance'] == 'OFFICIAL'
          assert result['in_playbook_count'] + result['deviation_count'] + result['lawyer_route_count'] + result['missing_count'] == result['topic_count']
          assert '07700' not in blob
          assert 'TOP SECRET' not in blob
          print('Review smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/review.py --request examples/sample_request.json --playbook fixtures/playbook.json --directory fixtures/directory.json --as-of 2027-06-01 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          assert result['sources_current'] is False
          assert result['may_be_relied_on'] is False
          assert result['playbook']['stale'] is True
          assert result['human_approval'] is None
          assert result['terms_accepted'] is False
          assert result['coerced'] is False
          assert result['as_of'] == '2027-06-01'
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.review import ContractReviewForbidden, accept_terms, record_lawyer_seen, review_contract, sign
          playbook = json.loads(Path('fixtures/playbook.json').read_text())
          directory = json.loads(Path('fixtures/directory.json').read_text())
          request = json.loads(Path('examples/sample_request.json').read_text())
          result = review_contract(request, playbook, directory, '2026-11-14')
          forged = record_lawyer_seen(result, directory, {
              'contract_hash': result['contract_hash'],
              'deviations_hash': 'a' * 64,
              'approver_ref': 'SOL-2001',
              'decision': 'seen',
              'item': 'clause-review',
              'pins_seen': True,
          })
          assert forged['human_approval'] is None
          assert forged['terms_accepted'] is False
          assert forged['blocked_reason'] == 'deviations_hash_mismatch'
          try:
              accept_terms()
          except ContractReviewForbidden:
              pass
          else:
              raise SystemExit('accept_terms should raise')
          try:
              sign()
          except ContractReviewForbidden:
              pass
          else:
              raise SystemExit('sign should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 20:
              print('ERROR: expected 20 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          paraphrase = report['paraphrase_recall']
          assert paraphrase['not_added_to_case_total'] is True
          for name, row in paraphrase['categories'].items():
              assert row['sentences'] >= 20, name
              if row['expect_match']:
                  assert row['recall'] == 1.0, name
              else:
                  assert row['false_inclusions'] == 0, name
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-67-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/67-contract-clause-review docs-site/docs/experiments/67-contract-clause-review.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 67
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/67-contract-clause-review")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/67-contract-clause-review/README.md
          echo "Licence check passed"
