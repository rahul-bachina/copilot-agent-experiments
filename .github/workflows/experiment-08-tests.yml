name: Experiment 08 - UK PII Gateway Tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - '.github/workflows/experiment-08-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - '.github/workflows/experiment-08-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/08-uk-pii-redaction-gateway

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/08-uk-pii-redaction-gateway/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run gateway smoke test
        run: |
          python src/gateway.py --input examples/sample_input.txt --caller exp-08-ci > /tmp/proposal.json
          python -c "
          import json
          proposal = json.load(open('/tmp/proposal.json'))
          assert proposal['anonymisation']['output_is_anonymised'] is False
          assert proposal['release']['agent_may_release'] is False
          assert proposal['release']['agent_may_send'] is False
          assert proposal['security']['actions_taken'] == []
          assert proposal['audit_log']['raw_values_logged'] is False
          assert proposal['redacted_text'].startswith('[REDACTION PROPOSAL. Not anonymised.')
          print('Gateway smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic_rules'
          assert report['not_a_model_evaluation'] is True
          assert report['not_a_live_recall_rate'] is True
          assert report['output_is_anonymised'] is False
          assert report['evaluation_label'].startswith('SMOKE TEST')
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          print(f\"Planted-type recall: {summary['recall_on_planted_types_percent']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 30:
              print('ERROR: expected 30 synthetic cases')
              raise SystemExit(1)
          if summary['known_miss_cases'] != 6:
              print('ERROR: expected 6 known-miss cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-08-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/08-uk-pii-redaction-gateway; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 08
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/08-uk-pii-redaction-gateway")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/08-uk-pii-redaction-gateway/README.md
          echo "Licence check passed"
