name: Experiment 41 - Case summary tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/41-case-summary/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - '.github/workflows/experiment-41-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/41-case-summary/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'docs-site/docs/experiments/41-case-summary.md'
      - '.github/workflows/experiment-41-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/41-case-summary

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/41-case-summary/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run summary smoke test
        run: |
          python src/summarise.py --case examples/sample_case.json --as-of 2026-11-09 > /tmp/summary.json
          python -c "
          import json
          draft = json.load(open('/tmp/summary.json'))
          assert draft['label'].startswith('DRAFT FOR THE SERVICE REPRESENTATIVE')
          assert draft['catalogue_id'] == 'C002'
          assert draft['autonomy'] == 'A0'
          assert draft['human_approval'] is None
          assert draft['accuracy_checked'] is False
          assert draft['actions_taken'] == []
          assert draft['case_outcome'] is None
          assert draft['customer_contacted'] is False
          assert draft['record_changed'] is False
          assert draft['complaint_closed'] is False
          assert draft['redress_offered'] is False
          assert draft['checker_passed'] is True
          assert draft['do_not_rely'] is True
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['foundry_called'] is False
          assert draft['summary']['sentence_count'] == 4
          assert draft['summary']['verdict_total'] == 4
          assert draft['summary']['failure_count'] == 0
          assert draft['pii_gateway']['output_is_anonymised'] is False
          assert draft['pii_gateway']['redacted_text_copied'] is False
          assert draft['regulatory']['ico_ai_accuracy_page_opened'] is False
          assert draft['regulatory']['significant_decision_taken'] is False
          print('Summary smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/summarise.py --case examples/sample_case.json --as-of 2027-03-01 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['pins_stale'] is True
          assert draft['summary']['sentence_count'] == 0
          assert draft['do_not_rely'] is True
          assert draft['human_approval'] is None
          assert draft['customer_contacted'] is False
          assert draft['record_changed'] is False
          assert draft['network_called'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from summarise import CaseSummaryForbidden, contact_customer, record_accuracy_check, summarise
          case = json.loads(Path('examples/sample_case.json').read_text())
          draft = summarise(case, '2026-11-09')
          refused = record_accuracy_check(draft, {
              'decision': 'contact_customer',
              'role': 'Service representative',
              'name': 'Sam Representative',
          })
          assert refused['review']['refused'] is True
          assert refused['review']['reason'] == 'prohibited_decision'
          assert refused['customer_contacted'] is False
          assert refused['human_approval'] is None
          try:
              contact_customer()
          except CaseSummaryForbidden:
              pass
          else:
              raise SystemExit('contact_customer should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-41-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/41-case-summary docs-site/docs/experiments/41-case-summary.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 41
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/41-case-summary")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/41-case-summary/README.md
          echo "Licence check passed"
