name: Experiment 52 - Word proposal drafting tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/52-word-proposal-drafting/**'
      - 'experiments/09-casework-correspondence-draft/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'experiments/36-cross-source-validation/**'
      - 'experiments/43-response-drafting/**'
      - '.github/workflows/experiment-52-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/52-word-proposal-drafting/**'
      - 'experiments/09-casework-correspondence-draft/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'experiments/36-cross-source-validation/**'
      - 'experiments/43-response-drafting/**'
      - 'docs-site/docs/experiments/52-word-proposal-drafting.md'
      - '.github/workflows/experiment-52-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/52-word-proposal-drafting

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/52-word-proposal-drafting/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run proposal smoke test
        run: |
          python src/proposal.py --input examples/sample_invitation.json --as-of 2026-11-12 > /tmp/proposal.json
          python -c "
          import json
          draft = json.load(open('/tmp/proposal.json'))
          assert draft['label'] == 'DRAFT FOR AUTHOR ACCEPTANCE. NOT SUBMITTED.'
          assert draft['catalogue_id'] == 'M004'
          assert draft['autonomy'] == 'A1'
          assert draft['human_approval'] is None
          assert draft['actions_taken'] == []
          assert draft['executed'] is False
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['requirement_text_recorded'] is False
          assert draft['outcome'] == 'draft_for_author'
          assert draft['flags']['submitted'] is False
          assert draft['flags']['sent'] is False
          assert draft['flags']['uploaded'] is False
          assert draft['flags']['used_anywhere'] is False
          rows = {row['requirement_id']: row for row in draft['compliance_matrix']}
          assert rows['R1']['requirement_met'] is True
          assert rows['R1']['status'] == 'met'
          assert rows['R5']['status'] == 'discrepancy'
          assert rows['R5']['requirement_met'] is False
          assert rows['R6']['status'] == 'gap'
          blob = json.dumps(draft)
          assert '950' not in blob
          assert '400' not in blob
          assert '450' not in blob
          assert draft['regulatory']['assessment_summary_produced'] is False
          assert draft['regulatory']['ppn_026_met'] is False
          assert draft['regulatory']['cyber_essentials_held'] is None
          assert draft['word']['graph_called'] is False
          assert draft['word']['word_api_called'] is False
          assert draft['human_route']['offered'] is True
          assert draft['human_route']['agent_submits'] is False
          print('Proposal smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/proposal.py --input examples/sample_invitation.json --as-of 2027-05-12 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          blob = json.dumps(draft)
          assert draft['stale']['rules_current'] is False
          assert draft['outcome'] == 'stale_sources'
          assert draft['human_approval'] is None
          assert draft['network_called'] is False
          assert draft['flags']['submitted'] is False
          assert all(row['status'] == 'stale_sources' for row in draft['compliance_matrix'])
          assert all(row['requirement_met'] is False for row in draft['compliance_matrix'])
          assert 'staffs a service desk' not in blob
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from proposal import ProposalForbidden, draft_proposal, record_acceptance, submit_bid
          pack = json.loads(Path('examples/sample_invitation.json').read_text())
          draft = draft_proposal(pack, '2026-11-12')
          ids = [row['requirement_id'] for row in draft['compliance_matrix']]
          refused = record_acceptance(draft, {
              'decision': 'submit_bid',
              'actor_role': 'author',
              'actor_id': 'SYN-AUTH-052',
              'proposal_id': 'SYN-BID-5201',
              'complete_draft_seen': True,
              'rows_acknowledged': ids,
              'author_checks_seen': True,
              'gaps_seen': True,
          })
          assert refused['review']['refused'] is True
          assert refused['flags']['submitted'] is False
          assert refused['human_approval'] is None
          try:
              submit_bid()
          except ProposalForbidden:
              pass
          else:
              raise SystemExit('submit_bid should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-52-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/52-word-proposal-drafting docs-site/docs/experiments/52-word-proposal-drafting.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 52
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/52-word-proposal-drafting")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/52-word-proposal-drafting/README.md
          echo "Licence check passed"
