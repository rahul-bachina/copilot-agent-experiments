name: Experiment 53 - PowerPoint narrative builder tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/53-powerpoint-narrative-builder/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'experiments/36-cross-source-validation/**'
      - '.github/workflows/experiment-53-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/53-powerpoint-narrative-builder/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'experiments/36-cross-source-validation/**'
      - 'docs-site/docs/experiments/53-powerpoint-narrative-builder.md'
      - '.github/workflows/experiment-53-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/53-powerpoint-narrative-builder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/53-powerpoint-narrative-builder/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run narrative smoke test
        run: |
          python src/narrative.py --input examples/sample_pack.json --as-of 2026-11-13 > /tmp/outline.json
          python -c "
          import json
          outline = json.load(open('/tmp/outline.json'))
          assert outline['label'] == 'OUTLINE FOR PRESENTER APPROVAL. NOT A DECK. NOT SHARED.'
          assert outline['catalogue_id'] == 'M005'
          assert outline['autonomy'] == 'A1'
          assert outline['human_approval'] is None
          assert outline['actions_taken'] == []
          assert outline['executed'] is False
          assert outline['model_called'] is False
          assert outline['network_called'] is False
          assert outline['request_text_recorded'] is False
          assert outline['outcome'] == 'outline_for_presenter'
          assert outline['flags']['slides_produced'] is False
          assert outline['flags']['shared'] is False
          assert outline['flags']['published'] is False
          assert outline['flags']['logo_added'] is False
          assert outline['flags']['figure_invented'] is False
          claims = {row['claim_id']: row for row in outline['claims']}
          assert claims['KEY']['sourced'] is True
          assert claims['Q2']['sourced'] is True
          assert claims['Q3']['sourced'] is True
          gaps = {row['point_id']: row for row in outline['gaps']}
          assert gaps['Q4']['sourced'] is False
          assert gaps['Q5']['reason'] == 'logo_not_approved'
          assert gaps['Q6']['reason'] == 'negated'
          blob = json.dumps(outline)
          assert 'half' not in blob
          assert 'published price' not in blob
          assert '1240' in blob
          assert outline['regulatory']['wcag_22_aa_met'] is False
          assert outline['regulatory']['accessibility_certified'] is False
          assert outline['flags']['graph_called'] is False
          assert outline['markings']['applied'] == 'OFFICIAL'
          assert outline['markings']['downgraded'] is False
          assert outline['human_route']['offered'] is True
          assert outline['human_route']['agent_shares'] is False
          print('Narrative smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/narrative.py --input examples/sample_pack.json --as-of 2027-05-13 > /tmp/stale.json
          python -c "
          import json
          outline = json.load(open('/tmp/stale.json'))
          blob = json.dumps(outline)
          assert outline['stale']['rules_current'] is False
          assert outline['outcome'] == 'stale_sources'
          assert outline['human_approval'] is None
          assert outline['network_called'] is False
          assert outline['flags']['slides_produced'] is False
          assert outline['flags']['shared'] is False
          assert outline['slides'] == []
          assert 'approved catalogue' not in blob
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from narrative import NarrativeForbidden, propose_outline, record_presenter_approval, share_deck
          pack = json.loads(Path('examples/sample_pack.json').read_text())
          outline = propose_outline(pack, '2026-11-13')
          refused = record_presenter_approval(outline, {
              'decision': 'share_deck',
              'actor_role': 'presenter',
              'actor_id': 'SYN-PRES-053',
              'pack_id': 'SYN-DECK-5301',
              'outline_seen': True,
              'citations_approved': ['KEY', 'Q2', 'Q3'],
              'gaps_seen': True,
              'accessibility_seen': True,
              'markings_seen': True,
          })
          assert refused['review']['refused'] is True
          assert refused['flags']['shared'] is False
          assert refused['human_approval'] is None
          try:
              share_deck()
          except NarrativeForbidden:
              pass
          else:
              raise SystemExit('share_deck should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-53-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/53-powerpoint-narrative-builder docs-site/docs/experiments/53-powerpoint-narrative-builder.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 53
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/53-powerpoint-narrative-builder")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/53-powerpoint-narrative-builder/README.md
          echo "Licence check passed"
