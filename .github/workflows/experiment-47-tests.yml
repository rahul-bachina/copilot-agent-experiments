name: Experiment 47 - Work order completion tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/47-work-order-completion/**'
      - 'experiments/46-field-visit-preparation/**'
      - 'experiments/05-awaabs-law-hazard-triage/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - '.github/workflows/experiment-47-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/47-work-order-completion/**'
      - 'experiments/46-field-visit-preparation/**'
      - 'experiments/05-awaabs-law-hazard-triage/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - 'docs-site/docs/experiments/47-work-order-completion.md'
      - '.github/workflows/experiment-47-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/47-work-order-completion

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/47-work-order-completion/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run completion smoke test
        run: |
          python src/complete.py --input examples/sample_completion.json --as-of 2026-11-11 > /tmp/completion.json
          python -c "
          import json
          record = json.load(open('/tmp/completion.json'))
          assert record['label'] == 'DRAFT WORK ORDER COMPLETION FOR TECHNICIAN APPROVAL'
          assert record['catalogue_id'] == 'C009'
          assert record['autonomy'] == 'A1'
          assert record['human_approval'] is None
          assert record['actions_taken'] == []
          assert record['executed'] is False
          assert record['model_called'] is False
          assert record['network_called'] is False
          assert record['narrative_echoed'] is False
          assert record['outcome'] == 'needs_review'
          assert record['flags']['job_closed'] is False
          assert record['flags']['charges_raised'] is False
          assert record['flags']['parts_ordered'] is False
          assert record['flags']['customer_contacted'] is False
          assert record['flags']['follow_up_job'] is True
          assert record['awaabs']['called'] is True
          assert record['awaabs']['any_operative_deadline'] is False
          assert record['human_route']['offered'] is True
          assert record['human_route']['agent_closes_the_job'] is False
          assert record['regulatory']['hswa_duty_met'] is False
          assert record['regulatory']['written_summary_sent'] is False
          assert record['stub_write']['executed'] is False
          assert record['stub_write']['production_system_written'] is False
          print('Completion smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/complete.py --input examples/sample_completion.json --as-of 2027-08-01 > /tmp/stale.json
          python -c "
          import json
          record = json.load(open('/tmp/stale.json'))
          blob = json.dumps(record)
          assert record['stale']['rules_current'] is False
          assert record['outcome'] == 'stale_sources'
          assert record['human_approval'] is None
          assert record['network_called'] is False
          assert all(row['taken'] is None for row in record['sources'])
          assert record['flags']['job_closed'] is False
          assert 'erased or rectified without delay' not in blob
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from complete import CompletionForbidden, close_job, draft_completion, record_review
          pack = json.loads(Path('examples/sample_completion.json').read_text())
          record = draft_completion(pack, '2026-11-11')
          refused = record_review(record, {
              'decision': 'close_job',
              'actor_role': 'Field technician',
              'actor_id': 'SYN-TECH-047',
              'work_order_id': 'SYN-WO-4701',
          })
          assert refused['review']['refused'] is True
          assert refused['review']['reason'] == 'prohibited_decision'
          assert refused['flags']['job_closed'] is False
          assert refused['human_approval'] is None
          try:
              close_job()
          except CompletionForbidden:
              pass
          else:
              raise SystemExit('close_job should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-47-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/47-work-order-completion docs-site/docs/experiments/47-work-order-completion.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 47
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/47-work-order-completion")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/47-work-order-completion/README.md
          echo "Licence check passed"
