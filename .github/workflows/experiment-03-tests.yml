name: Experiment 03 - Agent Inventory and ATRS Assurance Tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/03-agent-inventory-atrs-assurance/**'
      - '.github/workflows/experiment-03-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/03-agent-inventory-atrs-assurance/**'
      - '.github/workflows/experiment-03-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/03-agent-inventory-atrs-assurance

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/03-agent-inventory-atrs-assurance/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run assurance pack smoke test
        run: |
          python src/pack.py \
            --inventory fixtures/inventory/exp-01-foi-triage.json \
            --as-of 2026-10-24 > /tmp/pack.json
          python -c "
          import json
          pack = json.load(open('/tmp/pack.json'))
          assert pack['catalogue_id'] == 'G010'
          assert pack['document_status'] == 'draft'
          assert pack['approved'] is False
          assert pack['may_be_sent'] is False
          assert pack['may_be_submitted'] is False
          assert pack['actions_taken'] == []
          assert pack['evaluations_included'] == ['G006', 'G007']
          assert pack['duaa_screen']['lawful'] is None
          print('Pack smoke test passed')
          "

      - name: Run manifest generator smoke test
        run: |
          python src/generate_manifest.py \
            --inventory fixtures/inventory/exp-02-consumer-duty-complaint-intake.json \
            --as-of 2026-10-24 \
            --output /tmp/exp-02-draft-manifest.yaml > /tmp/manifest.json
          python src/generate_manifest.py \
            --inventory fixtures/inventory/exp-01-foi-triage.json \
            --as-of 2026-10-24 \
            --approve \
            --output /tmp/should-not-exist.yaml > /tmp/refused.json || test $? -eq 2
          test ! -f /tmp/should-not-exist.yaml
          python -c "
          import json
          draft = json.load(open('/tmp/manifest.json'))
          refused = json.load(open('/tmp/refused.json'))
          assert draft['approved'] is False
          assert draft['validation_passed'] is True
          assert draft['document_status'] == 'draft'
          assert refused['approved'] is False
          assert refused['validation_passed'] is False
          assert refused['actions_taken'] == []
          print('Manifest smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert report['model_called'] is False
          assert 'SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 20:
              print('ERROR: fewer than 20 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-03-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/03-agent-inventory-atrs-assurance; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 03
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/03-agent-inventory-atrs-assurance")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/03-agent-inventory-atrs-assurance/README.md
          echo "Licence check passed"
