name: Experiment 34 - EHCP draft assembler tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/34-ehcp-draft-assembler/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/34-ehcp-draft-assembler.md'
      - '.github/workflows/experiment-34-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/34-ehcp-draft-assembler/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/34-ehcp-draft-assembler.md'
      - '.github/workflows/experiment-34-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/34-ehcp-draft-assembler

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/34-ehcp-draft-assembler/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run sandbox smoke test
        run: |
          python src/assemble.py --bundle examples/sample_bundle.json --as-of 2026-11-04 > /tmp/draft.json
          python -c "
          import json
          draft = json.load(open('/tmp/draft.json'))
          blob = json.dumps(draft)
          assert draft['label'] == 'DRAFT FOR CASEWORKER — NOT A PLAN'
          assert draft['catalogue_id'] == 'UK10'
          assert draft['autonomy'] == 'A1'
          assert draft['placed_quotes'] == 7
          assert draft['exported'] is False
          assert draft['export_blocked'] is True
          assert draft['needs_decided'] is False
          assert draft['provision_decided'] is False
          assert draft['placement_decided'] is False
          assert draft['outcomes_decided'] is False
          assert draft['sent_to_parents'] is False
          assert draft['sent_to_school'] is False
          assert draft['written_to_la_system'] is False
          assert draft['final_plan_edited'] is False
          assert draft['provision_secured'] is False
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['a3_recommended'] is False
          assert draft['output_is_anonymised'] is False
          assert draft['actions_taken'] == []
          assert len(draft['conflicts']) == 1
          assert draft['conflicts'][0]['resolved'] is False
          assert draft['sections']['I']['lines'] == []
          assert draft['sections']['I']['left_blank_in_draft'] is True
          assert draft['timescale']['days_since_request'] == 93
          assert draft['timescale']['twenty_week_marker_passed'] is False
          assert draft['timescale']['breach_found'] is False
          assert 'Oakbridge' not in blob
          assert 'one-to-one' not in blob
          assert '999' not in blob
          print('Sandbox smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/assemble.py --bundle examples/sample_bundle.json --as-of 2027-05-04 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['do_not_rely'] is True
          assert draft['placed_quotes'] == 7
          assert draft['needs_decided'] is False
          assert draft['sent_to_parents'] is False
          assert draft['a3_recommended'] is False
          assert draft['network_called'] is False
          assert draft['timescale']['breach_found'] is False
          opened = [row for row in draft['sources'] if row.get('stale_applicable')]
          assert opened and all(row['stale'] is True for row in opened)
          for source_id in ('catalogue-boundary', 'ico-childrens-code'):
              row = next(item for item in draft['sources'] if item['id'] == source_id)
              assert row['stale'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          for flag in --decide-needs --decide-provision --decide-placement --decide-outcomes --edit-final-plan --send-to-parents --send-to-school --write-la-system --secure-provision; do
            set +e
            python src/assemble.py --bundle examples/sample_bundle.json --as-of 2026-11-04 "$flag" > /tmp/prohibited.json
            code=$?
            set -e
            test "$code" -eq 2
            test ! -s /tmp/prohibited.json
          done
          set +e
          python src/assemble.py --bundle examples/sample_bundle.json --as-of 2026-11-04 --export > /tmp/export-blocked.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/export-blocked.json
          echo "Prohibited-action smoke test passed"

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert report['not_a_plan'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          assert 'grand_total' not in summary
          assert summary['quotes_are_not_summed'] is True
          assert 14 not in summary.values()
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 13:
              print('ERROR: expected 13 cases')
              raise SystemExit(1)
          quotes = [case['placed_quotes'] for case in report['cases'] if case['id'] in {'northfen-child-a', 'northfen-child-a-again'}]
          assert quotes == [7, 7]
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-34-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/34-ehcp-draft-assembler docs-site/docs/experiments/34-ehcp-draft-assembler.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No currency symbol copied into the source
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          roots = [
              Path("experiments/34-ehcp-draft-assembler"),
              Path("docs-site/docs/experiments/34-ehcp-draft-assembler.md"),
          ]
          import re
          currency = re.compile(r"[£€]|\$\d")
          failed = False
          for root in roots:
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml"}:
                      continue
                  if "tests" in path.parts:
                      continue
                  text = path.read_text(errors="ignore")
                  if currency.search(text):
                      print(f"Currency symbol in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Currency check passed")
          PY

      - name: No obvious secrets in Experiment 34
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/34-ehcp-draft-assembler")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/34-ehcp-draft-assembler/README.md
          echo "Licence check passed"
