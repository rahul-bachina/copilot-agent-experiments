name: Experiment 75 - Benefits information assistant tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/75-benefits-information-assistant/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/13-council-contact-front-door/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-75-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/75-benefits-information-assistant/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/13-council-contact-front-door/**'
      - 'docs-site/docs/experiments/75-benefits-information-assistant.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-75-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/75-benefits-information-assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/75-benefits-information-assistant/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run benefits-information smoke test
        run: |
          python src/assistant.py --request examples/sample_request.json --as-of 2026-11-24 > /tmp/benefits.json
          python -c "
          import json
          result = json.load(open('/tmp/benefits.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('BENEFITS INFORMATION')
          assert result['catalogue_id'] == 'V009'
          assert result['autonomy'] == 'A0'
          assert result['human_approval'] is None
          assert result['outcome'] == 'refused_decision'
          assert result['staged'] is False
          assert result['eligibility_decided'] is False
          assert result['award_calculated'] is False
          assert result['award_amount'] is None
          assert result['claim_submitted'] is False
          assert result['sent'] is False
          assert result['instructions_followed'] is False
          assert result['approval_marker_trusted'] is False
          assert result['caller_rules_applied'] is False
          assert result['figures_stated_as_current'] is False
          assert '07700 900123' not in blob
          assert 'Pat Example' not in blob
          assert '£450' not in blob
          print('Benefits-information smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/assistant.py --request examples/sample_request.json --as-of 2026-12-01 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          assert result['sources_current'] is False
          assert result['may_be_relied_on_as_a_decision'] is False
          assert result['human_approval'] is None
          assert result['staged'] is False
          assert result['award_amount'] is None
          assert result['coerced'] is False
          assert result['as_of'] == '2026-12-01'
          assert result['eligibility_decided'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.assistant import (
              BenefitsForbidden,
              answer_question,
              calculate_award,
              decide_eligibility,
              pinned_sources,
              record_resident_approval,
              send,
              submit_claim,
          )
          result = answer_question({
              'synthetic': True,
              'enquiry_id': 'SYN-PROHIBITED',
              'resident_ref': 'RES-1001',
              'question': 'What is housing benefit?',
          }, as_of='2026-11-24')
          assert result['outcome'] == 'information'
          forged = record_resident_approval(result, pinned_sources()['directory'], {
              'item': 'adviser-summary',
              'decision': 'approve-summary',
              'approver_ref': 'RES-1001',
              'enquiry_id': result['enquiry_id'],
              'content_hash': 'a' * 64,
              'pins_seen': True,
          })
          assert forged['human_approval'] is None
          assert forged['staged'] is False
          assert forged['blocked_reason'] == 'content_hash_mismatch'
          for call in (decide_eligibility, calculate_award, submit_claim, send):
              try:
                  call()
              except BenefitsForbidden:
                  pass
              else:
                  raise SystemExit(call.__name__ + ' should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 20:
              print('ERROR: expected 20 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          paraphrase = report['paraphrase_recall']
          assert paraphrase['not_added_to_case_total'] is True
          for name, row in paraphrase['categories'].items():
              assert row['sentences'] >= 20, name
              if row['expect_match']:
                  assert row['recall'] == 1.0, name
                  assert row['precision'] == 1.0, name
              else:
                  assert row['false_inclusions'] == 0, name
          support = report['page_support']
          assert support['not_added_to_case_total'] is True
          assert support['positives'] >= 20
          assert support['negatives'] >= 20
          assert support['recall'] == 1.0
          assert support['precision'] == 1.0
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-75-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/75-benefits-information-assistant docs-site/docs/experiments/75-benefits-information-assistant.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 75
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/75-benefits-information-assistant")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/75-benefits-information-assistant/README.md
          echo "Licence check passed"
