name: Experiment 06 - NHS policy Q&A tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/06-nhs-policy-qa/**'
      - '.github/workflows/experiment-06-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/06-nhs-policy-qa/**'
      - '.github/workflows/experiment-06-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/06-nhs-policy-qa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/06-nhs-policy-qa/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run answer smoke test
        run: |
          python src/answer.py \
            --question "How much notice do I need to book annual leave?" \
            --as-of 2026-10-24 > /tmp/answer.json
          python -c "
          import json
          answer = json.load(open('/tmp/answer.json'))
          assert answer['outcome'] == 'answered'
          assert answer['may_be_relied_on'] is True
          assert answer['citations'][0]['policy_id'] == 'HR-LEAVE-003'
          assert answer['citations'][0]['version'] == '4.1'
          assert answer['citations'][0]['review_due'] == '2027-03-31'
          assert answer['actions_taken'] == []
          assert answer['model_called'] is False
          print('Answer smoke test passed')
          "

      - name: Run clinical refusal smoke test
        run: |
          python src/answer.py \
            --question "What antibiotic should I give a patient?" \
            --as-of 2026-10-24 > /tmp/clinical.json
          python -c "
          import json
          answer = json.load(open('/tmp/clinical.json'))
          assert answer['outcome'] == 'refused_clinical'
          assert answer['citations'] == []
          assert answer['clinical_advice_given'] is False
          assert answer['actions_taken'] == []
          print('Clinical refusal smoke test passed')
          "

      - name: Run owner review smoke test
        run: |
          python src/review.py --as-of 2026-10-24 > /tmp/review.json
          python -c "
          import json
          review = json.load(open('/tmp/review.json'))
          assert review['published'] is False
          assert review['accepted_by_policy_owner'] is False
          assert review['actions_taken'] == []
          assert review['change_notes'][0]['published'] is False
          assert review['change_notes'][0]['topic'] == 'finance.expenses.alcohol'
          stale = {row['policy_id'] for row in review['stale_policies']}
          assert stale == {'IT-PWD-002'}
          print('Owner review smoke test passed')
          "

      - name: Run evaluation (mock smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'mock'
          assert report['not_a_model_evaluation'] is True
          assert report['not_a_staff_study'] is True
          assert report['nhs_trial_figure_not_used'] is True
          assert 'MOCK SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 20:
              print('ERROR: fewer than 20 synthetic cases')
              raise SystemExit(1)
          timed = report['time_saving']
          assert timed['observed'] is False
          assert timed['n_rejected_self_report'] == 1
          assert timed['n_excluded_ungrounded'] == 1
          assert timed['median_seconds_saved_on_grounded_items'] == 160
          assert 'T-SELF' in timed['rejected_self_report_ids']
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-06-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/06-nhs-policy-qa; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 06
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/06-nhs-policy-qa")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/06-nhs-policy-qa/README.md
          echo "Licence check passed"
