name: Experiment 26 - Skill Selection Evaluator tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/26-skill-selection-evaluator/**'
      - 'experiments/25-instruction-quality-reviewer/src/**'
      - 'experiments/03-agent-inventory-atrs-assurance/src/**'
      - 'experiments/14-agent-architecture-advisor/src/rules.py'
      - 'schemas/agent-manifest.schema.json'
      - '.github/workflows/experiment-26-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/26-skill-selection-evaluator/**'
      - 'experiments/25-instruction-quality-reviewer/src/**'
      - 'experiments/03-agent-inventory-atrs-assurance/src/**'
      - 'experiments/14-agent-architecture-advisor/src/rules.py'
      - 'schemas/agent-manifest.schema.json'
      - '.github/workflows/experiment-26-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/26-skill-selection-evaluator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/26-skill-selection-evaluator/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run evaluator smoke test
        run: |
          python src/report.py --bundle examples/sample_bundle.json --as-of 2026-11-02 > /tmp/routing.json
          python -c "
          import json
          draft = json.load(open('/tmp/routing.json'))
          assert draft['label'] == 'DRAFT FOR MAINTAINER REVIEW'
          assert draft['catalogue_id'] == 'G004'
          assert draft['autonomy'] == 'A0'
          assert draft['maintainer_validated'] is False
          assert draft['skills_edited'] is False
          assert draft['diff_applied'] is False
          assert draft['decision'] is None
          assert draft['deployed'] is False
          assert draft['actions_taken'] == []
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['a3_recommended'] is False
          assert draft['agreement']['percent'] == 100.0
          assert draft['proposed_diff']['applied'] is False
          assert draft['prompt_injection']['followed'] is False
          assert draft['prompt_injection']['selection_obeyed_injection'] is False
          assert draft['prohibited_actions']['all_routed_to_human'] is True
          assert draft['architecture_cross_check']['platform_selected'] is None
          assert draft['manifest_skeleton']['approved'] is False
          print('Evaluator smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/report.py --bundle examples/sample_bundle.json --as-of 2027-04-01 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['do_not_rely'] is True
          assert draft['stale']['sources_stale'] is True
          assert draft['stale']['skills_stale'] is True
          assert draft['maintainer_validated'] is False
          assert draft['skills_edited'] is False
          assert draft['diff_applied'] is False
          assert draft['deployed'] is False
          assert draft['a3_recommended'] is False
          assert draft['network_called'] is False
          assert draft['pins_reopened_for_this_experiment'] is False
          opened = [row for row in draft['sources'] if row.get('stale_applicable')]
          assert opened and all(row['stale'] is True for row in opened)
          boundary = next(row for row in draft['sources'] if row['id'] == 'catalogue-boundary')
          assert boundary['stale'] is False
          assert boundary['reopened_for_this_experiment'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          set +e
          python src/report.py --bundle examples/sample_bundle.json --as-of 2026-11-02 --approve > /tmp/approve.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/approve.json
          set +e
          python src/report.py --bundle examples/sample_bundle.json --as-of 2026-11-02 --apply > /tmp/apply.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/apply.json
          set +e
          python src/report.py --bundle examples/sample_bundle.json --as-of 2026-11-02 --edit-skills > /tmp/edit.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/edit.json
          echo "Prohibited-action smoke test passed"

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test controlled agreement: {summary['controlled_agreement']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_utterances'] < 15:
              print('ERROR: fewer than 15 utterances')
              raise SystemExit(1)
          if summary['controlled_agreement'] != 100.0:
              print('ERROR: controlled agreement is not 100')
              raise SystemExit(1)
          if summary['injection_followed'] or summary['prohibited_misses']:
              print('ERROR: injection was followed or a prohibited action missed human')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-26-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/26-skill-selection-evaluator docs-site/docs/experiments/26-skill-selection-evaluator.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No prices copied
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          roots = [
              Path("experiments/26-skill-selection-evaluator"),
              Path("docs-site/docs/experiments/26-skill-selection-evaluator.md"),
          ]
          price = re.compile(r"(£|€|\$\d|free of charge|\d+ Copilot Credits)", re.I)
          failed = False
          for root in roots:
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml"}:
                      continue
                  if price.search(path.read_text(errors="ignore")):
                      print(f"Price-like text in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Price check passed")
          PY

      - name: No obvious secrets in Experiment 26
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/26-skill-selection-evaluator")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/26-skill-selection-evaluator/README.md
          echo "Licence check passed"
