name: Experiment 66 - Workforce skills inventory tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/66-workforce-skills-inventory/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/61-learning-path-planner/**'
      - 'experiments/62-internal-mobility-explorer/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-66-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/66-workforce-skills-inventory/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/61-learning-path-planner/**'
      - 'experiments/62-internal-mobility-explorer/**'
      - 'docs-site/docs/experiments/66-workforce-skills-inventory.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-66-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/66-workforce-skills-inventory

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/66-workforce-skills-inventory/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run inventory smoke test
        run: |
          python src/inventory.py --request examples/sample_request.json --evidence fixtures/evidence.json --framework fixtures/framework.json --directory fixtures/directory.json --transparency fixtures/transparency.json --as-of 2026-11-18 > /tmp/inventory.json
          python -c "
          import json
          result = json.load(open('/tmp/inventory.json'))
          blob = json.dumps(result)
          assert result['label'] == 'PROPOSAL ONLY. NOT A PERFORMANCE RATING AND NOT AN HR RECORD.'
          assert result['catalogue_id'] == 'H010'
          assert result['autonomy'] == 'A0'
          assert result['outcome'] == 'proposals'
          assert result['human_approval'] is None
          assert result['may_be_relied_on'] is False
          flags = result['flags']
          assert flags['wrote_to_hr_system'] is False
          assert flags['performance_rated'] is False
          assert flags['pay_decision'] is False
          assert flags['promotion_decision'] is False
          assert flags['redundancy_decision'] is False
          assert flags['disciplinary_decision'] is False
          assert flags['solely_automated_decision'] is False
          assert flags['article_13_met'] is False
          assert flags['output_is_anonymised'] is False
          assert flags['coerced'] is False
          ids = [row['skill_id'] for row in result['proposals']]
          assert 'SKL-DATA' in ids
          assert 'SKL-PLAIN' in ids
          assert 'SKL-GRANTS' in ids
          assert 'SKL-FORK' not in ids
          assert all(row['state'] == 'needs_employee_confirmation' for row in result['proposals'])
          assert result['prompt_injection']['followed'] is False
          assert '07700900123' not in blob
          assert 'skills@ashcombe.example.gov.uk' not in blob
          assert 'AB123456C' not in blob
          print('Inventory smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/inventory.py --request examples/sample_request.json --evidence fixtures/evidence.json --framework fixtures/framework.json --directory fixtures/directory.json --transparency fixtures/transparency.json --as-of 2027-06-01 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          assert result['sources_current'] is False
          assert result['may_be_relied_on'] is False
          assert result['coerced'] is False
          assert result['as_of'] == '2027-06-01'
          assert result['flags']['wrote_to_hr_system'] is False
          assert result['human_approval'] is None
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import sys
          sys.path.insert(0, '.')
          from src.inventory import (
              InventoryForbidden,
              decide_discipline,
              decide_promotion,
              infer_from_protected,
              profile_unsupplied,
              rate_performance,
              select_for_redundancy,
              set_pay,
              write_hr,
          )
          for fn in (
              write_hr,
              rate_performance,
              set_pay,
              decide_promotion,
              select_for_redundancy,
              decide_discipline,
              infer_from_protected,
              profile_unsupplied,
          ):
              try:
                  fn()
              except InventoryForbidden:
                  pass
              else:
                  raise SystemExit(fn.__name__ + ' should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 16:
              print('ERROR: expected 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          recall = report['paraphrase_recall']
          assert 'Not included in summary.total_cases' in recall['note']
          if not recall['categories']:
              print('ERROR: paraphrase recall is missing')
              raise SystemExit(1)
          for row in recall['categories']:
              if row['total'] < 20 or row['caught'] == 0 or row['recall'] < 0.9:
                  print('ERROR: paraphrase recall is not acceptable for ' + row['category'])
                  raise SystemExit(1)
              if row['negatives_leaked'] != 0:
                  print('ERROR: negated variants were counted as hits for ' + row['category'])
                  raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-66-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/66-workforce-skills-inventory docs-site/docs/experiments/66-workforce-skills-inventory.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 66
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/66-workforce-skills-inventory")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/66-workforce-skills-inventory/README.md
          echo "Licence check passed"
