name: Experiment 50 - SharePoint knowledge curator tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/50-sharepoint-knowledge-curator/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/19-privacy-impact-assessment/**'
      - 'experiments/21-it-service-desk/**'
      - 'experiments/40-customer-self-service/**'
      - 'experiments/44-knowledge-gap-detector/**'
      - 'experiments/49-records-classification/**'
      - '.github/workflows/experiment-50-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/50-sharepoint-knowledge-curator/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/19-privacy-impact-assessment/**'
      - 'experiments/21-it-service-desk/**'
      - 'experiments/40-customer-self-service/**'
      - 'experiments/44-knowledge-gap-detector/**'
      - 'experiments/49-records-classification/**'
      - 'docs-site/docs/experiments/50-sharepoint-knowledge-curator.md'
      - '.github/workflows/experiment-50-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/50-sharepoint-knowledge-curator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/50-sharepoint-knowledge-curator/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run curation smoke test
        run: |
          python src/curate.py --input examples/sample_site.json --as-of 2026-11-12 > /tmp/curation.json
          python -c "
          import json
          draft = json.load(open('/tmp/curation.json'))
          blob = json.dumps(draft)
          assert draft['label'] == 'DRAFT SHAREPOINT CURATION FOR SITE OWNER APPROVAL'
          assert draft['catalogue_id'] == 'M001'
          assert draft['autonomy'] == 'A1'
          assert draft['human_approval'] is None
          assert draft['actions_taken'] == []
          assert draft['executed'] is False
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['sharepoint_called'] is False
          assert draft['graph_called'] is False
          assert draft['text_recorded'] is False
          assert draft['outcome'] == 'human_queue'
          assert draft['visible_count'] == 11
          assert draft['withheld_count'] == 1
          assert draft['flags']['deleted'] is False
          assert draft['flags']['unpublished'] is False
          assert draft['flags']['moved'] is False
          assert draft['flags']['permissions_changed'] is False
          assert draft['flags']['metadata_applied_in_tenant'] is False
          assert draft['human_route']['offered'] is True
          assert draft['human_route']['agent_curates_sensitive'] is False
          assert draft['regulatory']['accuracy_met'] is False
          assert draft['regulatory']['storage_limitation_met'] is False
          assert draft['regulatory']['code_complied'] is False
          assert 'CANARY-HIDDEN-PAYROLL' not in blob
          assert 'JM 45 67 89 D' not in blob
          print('Curation smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/curate.py --input examples/sample_site.json --as-of 2027-08-01 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          blob = json.dumps(draft)
          assert draft['stale']['rules_current'] is False
          assert draft['outcome'] == 'stale_sources'
          assert draft['human_approval'] is None
          assert draft['network_called'] is False
          assert all(row['taken'] is None for row in draft['sources'])
          assert draft['flags']['deleted'] is False
          assert 'accurate and, where necessary, kept up to date' not in blob
          assert 'in accordance with Article 84B' not in blob
          assert 'properly authorised' not in blob
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from curate import CuratorForbidden, curate_site, delete_page, record_approval
          snapshot = json.loads(Path('examples/sample_site.json').read_text())
          draft = curate_site(snapshot, '2026-11-12')
          target = next(item for item in draft['proposals'] if item['type'] == 'missing_metadata')
          refused = record_approval(draft, {
              'decision': 'delete_page',
              'actor_role': 'Site owner',
              'actor_id': 'SYN-SO-050',
              'site_id': draft['site_id'],
              'proposal_ids': [target['proposal_id']],
              'queue_reviewed': True,
          })
          assert refused['approval_review']['reason'] == 'prohibited_decision'
          assert refused['flags']['deleted'] is False
          assert refused['human_approval'] is None
          try:
              delete_page()
          except CuratorForbidden:
              pass
          else:
              raise SystemExit('delete_page should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-50-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/50-sharepoint-knowledge-curator docs-site/docs/experiments/50-sharepoint-knowledge-curator.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 50
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/50-sharepoint-knowledge-curator")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/50-sharepoint-knowledge-curator/README.md
          echo "Licence check passed"
