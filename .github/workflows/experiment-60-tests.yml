name: Experiment 60 - Manager one-to-one prep tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/60-manager-one-to-one-prep/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - 'experiments/41-case-summary/**'
      - 'experiments/51-teams-channel-digest/**'
      - '.github/workflows/experiment-60-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/60-manager-one-to-one-prep/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - 'experiments/41-case-summary/**'
      - 'experiments/51-teams-channel-digest/**'
      - 'docs-site/docs/experiments/60-manager-one-to-one-prep.md'
      - '.github/workflows/experiment-60-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/60-manager-one-to-one-prep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/60-manager-one-to-one-prep/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run prep smoke test
        run: |
          python src/prepare.py --pack examples/sample_pack.json --as-of 2026-11-17 > /tmp/prep.json
          python -c "
          import json
          result = json.load(open('/tmp/prep.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('DRAFT ONE-TO-ONE PREP NOTE')
          assert result['catalogue_id'] == 'H003'
          assert result['autonomy'] == 'A0'
          assert result['human_approval'] is None
          assert result['outcome'] == 'prep_note'
          assert result['performance_rating'] is None
          assert result['comparison'] is None
          assert result['disciplinary_recommendation'] is None
          assert result['health_inference'] is None
          assert result['mailbox_read'] is False
          assert result['chat_read'] is False
          assert result['flags']['network_called'] is False
          assert result['injection']['followed'] is False
          assert 'CANARY-MAILBOX' not in blob
          assert 'CANARY-CHAT' not in blob
          assert 'client entertainment' not in blob
          assert '07123 456789' not in blob
          print('Prep smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.prepare import prepare
          pack = json.loads(Path('examples/sample_pack.json').read_text())
          for source in pack['sources']:
              if source['id'] == 'N-1':
                  source['recorded_on'] = '2025-01-01'
          result = prepare(pack, '2026-11-17')
          follow = [point for point in result['prep_note']['points'] if point['citation']['source_id'] == 'N-1']
          assert follow
          assert all(point['stale'] is True for point in follow)
          assert result['may_be_relied_on'] is False
          assert result['human_approval'] is None
          assert result['flags']['network_called'] is False
          assert all(row.get('taken') is None or True for row in result['sources'])
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.prepare import PrepForbidden, acknowledge, prepare, rate_performance, read_mailbox, send_note
          pack = json.loads(Path('examples/sample_pack.json').read_text())
          result = prepare(pack, '2026-11-17')
          refused = acknowledge(result, {
              'actor_id': 'EMP-014',
              'actor_role': 'line_manager',
              'seen': True,
              'approved': True,
              'meeting_id': result['meeting_id'],
              'selected_source_ids': result['selection']['selected_source_ids'],
              'approval_reference': result['selection']['approval_reference'],
          })
          assert refused['human_approval'] is None
          assert refused['performance_rating'] is None
          assert refused['acknowledgement']['reason'] == 'approver_not_line_manager_in_directory'
          for fn in (rate_performance, read_mailbox, send_note):
              try:
                  fn()
              except PrepForbidden:
                  pass
              else:
                  raise SystemExit(fn.__name__ + ' should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 14:
              print('ERROR: expected 14 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-60-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/60-manager-one-to-one-prep docs-site/docs/experiments/60-manager-one-to-one-prep.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 60
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/60-manager-one-to-one-prep")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/60-manager-one-to-one-prep/README.md
          echo "Licence check passed"
