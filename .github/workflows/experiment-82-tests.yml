name: Experiment 82 - Workflow exception assistant tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/82-workflow-exception-assistant/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-82-tests.yml'
  pull_request:
    paths:
      - 'experiments/82-workflow-exception-assistant/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'docs-site/docs/experiments/82-workflow-exception-assistant.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-82-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/82-workflow-exception-assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/82-workflow-exception-assistant/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run diagnosis smoke test
        run: |
          python src/workflow.py --request examples/sample_request.json --as-of 2026-11-26 > /tmp/workflow.json
          python -c "
          import json
          result = json.load(open('/tmp/workflow.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('DRAFT WORKFLOW EXCEPTION READING')
          assert result['catalogue_id'] == 'O009'
          assert result['autonomy'] == 'A1'
          assert result['human_approval'] is None
          assert result['owner_decision_recorded'] is False
          assert result['auto_retried'] is False
          assert result['retried'] is False
          assert result['cancelled'] is False
          assert result['records_edited'] is False
          assert result['flow_rerun'] is False
          assert result['executed'] is False
          assert result['error_text_used_for_class'] is False
          assert result['experiment_17_called'] is False
          assert result['groups'][0]['exception_class'] == 'transient_connector_throttling'
          assert result['retry_safe'] is True
          assert '07700900123' not in blob
          assert 'desk@reedmarsh.example' not in blob
          assert 'Pat Example' not in blob
          print('Diagnosis smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.workflow import diagnose
          request = json.loads(Path('examples/sample_request.json').read_text())
          request['question_date'] = '2026-12-20'
          for run in request['runs']:
              run['started_at'] = '2026-10-01T09:00:00Z'
              run['ended_at'] = '2026-10-01T09:01:00Z'
              for step in run['steps']:
                  step['started_at'] = '2026-10-01T09:00:00Z'
                  step['ended_at'] = '2026-10-01T09:01:00Z'
          result = diagnose(request, as_of='2026-12-20')
          assert result['stale'] is True
          assert result['retry_safe'] is False
          assert result['may_be_relied_on'] is False
          assert result['human_approval'] is None
          assert result['owner_decision_recorded'] is False
          assert result['auto_retried'] is False
          assert result['coerced'] is False
          assert result['as_of'] == '2026-12-20'
          assert 'dates_seen' in result['required_acknowledgements']
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.workflow import (
              WorkflowForbidden,
              cancel_run,
              diagnose,
              edit_record,
              pinned_directory,
              record_owner_decision,
              rerun_flow,
              retry_run,
          )
          request = json.loads(Path('examples/sample_request.json').read_text())
          result = diagnose(request, as_of='2026-11-26')
          forged = record_owner_decision(result, pinned_directory(), {
              'item': 'owner-decision',
              'decision': 'retry',
              'action_id': 'retry',
              'approver_ref': 'OWN-8201',
              'diagnosis_id': result['diagnosis_id'],
              'content_hash': 'a' * 64,
              'pins_seen': True,
              'risks_seen': True,
              'markings_seen': True,
              'suppression_seen': True,
          })
          assert forged['human_approval'] is None
          assert forged['owner_decision_recorded'] is False
          assert forged['blocked_reason'] in {'caller_rehash_rejected', 'content_tampered'}
          assert forged['retried'] is False
          for fn in (retry_run, cancel_run, edit_record, rerun_flow):
              try:
                  fn()
              except WorkflowForbidden:
                  pass
              else:
                  raise SystemExit(fn.__name__ + ' should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 20:
              print('ERROR: expected 20 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          paraphrase = report['paraphrase_recall']
          assert paraphrase['not_added_to_case_total'] is True
          for name, row in paraphrase['categories'].items():
              assert row['sentences'] >= 20, name
              if row['expect_match']:
                  assert row['recall'] == 1.0, name
                  assert row['precision'] == 1.0, name
              else:
                  assert row['false_inclusions'] == 0, name
          classification = report['classification_score']
          assert classification['not_added_to_case_total'] is True
          assert classification['recall'] == 1.0
          assert classification['precision'] == 1.0
          assert classification['positives'] >= 20
          assert classification['negatives'] >= 20
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-82-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ --exclude-dir=.venv "Azure AI Foundry" experiments/82-workflow-exception-assistant docs-site/docs/experiments/82-workflow-exception-assistant.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 82
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/82-workflow-exception-assistant")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              if ".venv" in path.parts:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/82-workflow-exception-assistant/README.md
          echo "Licence check passed"
