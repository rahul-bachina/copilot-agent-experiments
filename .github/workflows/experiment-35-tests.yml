name: Experiment 35 - Claims document triage tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/35-claims-document-triage/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/35-claims-document-triage.md'
      - '.github/workflows/experiment-35-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/35-claims-document-triage/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/35-claims-document-triage.md'
      - '.github/workflows/experiment-35-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/35-claims-document-triage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/35-claims-document-triage/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run sandbox smoke test
        run: |
          python src/triage.py --pack examples/sample_pack.json --as-of 2026-11-05 > /tmp/draft.json
          python -c "
          import json
          draft = json.load(open('/tmp/draft.json'))
          assert draft['label'] == 'DRAFT FOR THE CLAIMS HANDLER'
          assert draft['catalogue_id'] == 'B007'
          assert draft['autonomy'] == 'A1'
          assert draft['classification']['proposed_class'] == 'escape_of_water'
          assert draft['classification_approved_by_handler'] is False
          assert draft['claim_accepted'] is False
          assert draft['claim_declined'] is False
          assert draft['claim_settled'] is False
          assert draft['customer_told'] is False
          assert draft['claims_system_written'] is False
          assert draft['fraud_indicated'] is False
          assert draft['coverage_decided'] is False
          assert draft['customer_message'] is None
          assert draft['a3_recommended'] is False
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['output_is_anonymised'] is False
          assert draft['purpose_confirmed'] is False
          assert draft['gateway_called'] is True
          assert draft['intake_catalogue_id'] == 'O001'
          assert draft['scorecard']['below_threshold'] is False
          assert draft['scorecard']['llm_as_judge'] is False
          assert draft['scorecard']['foundry_evaluator_called'] is False
          assert draft['do_not_rely'] is False
          assert draft['actions_taken'] == []
          print('Sandbox smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/triage.py --pack examples/sample_pack.json --as-of 2027-05-05 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['do_not_rely'] is True
          assert draft['sources_stale'] is True
          assert draft['claim_declined'] is False
          assert draft['claim_accepted'] is False
          assert draft['customer_told'] is False
          assert draft['claims_system_written'] is False
          assert draft['a3_recommended'] is False
          assert draft['network_called'] is False
          assert draft['scorecard']['llm_as_judge'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          for flag in --accept-claim --decline-claim --settle-claim --tell-customer --write-claims-system --approve-thresholds; do
            set +e
            python src/triage.py --pack examples/sample_pack.json --as-of 2026-11-05 "$flag" > /tmp/prohibited.json
            code=$?
            set -e
            test "$code" -eq 2
            test ! -s /tmp/prohibited.json
          done
          echo "Prohibited-action smoke test passed"

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert report['not_an_llm_judge'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          assert 'grand_total' not in summary
          assert summary['scores_are_not_summed_across_criteria'] is True
          assert summary['case_count'] == 13
          assert summary['passed'] == 13
          assert summary['cases_escalated'] == 3
          assert 16 not in summary.values()
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-35-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/35-claims-document-triage docs-site/docs/experiments/35-claims-document-triage.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No currency symbol copied into the source
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          roots = [
              Path("experiments/35-claims-document-triage"),
              Path("docs-site/docs/experiments/35-claims-document-triage.md"),
          ]
          import re
          currency = re.compile(r"[£€]|\$\d")
          failed = False
          for root in roots:
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml"}:
                      continue
                  if "tests" in path.parts:
                      continue
                  text = path.read_text(errors="ignore")
                  if currency.search(text):
                      print(f"Currency symbol in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Currency check passed")
          PY

      - name: No obvious secrets in Experiment 35
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/35-claims-document-triage")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/35-claims-document-triage/README.md
          echo "Licence check passed"
