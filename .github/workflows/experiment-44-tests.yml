name: Experiment 44 - Knowledge gap detector tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/44-knowledge-gap-detector/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/21-it-service-desk/**'
      - 'experiments/40-customer-self-service/**'
      - '.github/workflows/experiment-44-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/44-knowledge-gap-detector/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/21-it-service-desk/**'
      - 'experiments/40-customer-self-service/**'
      - 'docs-site/docs/experiments/44-knowledge-gap-detector.md'
      - '.github/workflows/experiment-44-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/44-knowledge-gap-detector

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/44-knowledge-gap-detector/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run review smoke test
        run: |
          python src/gaps.py --input examples/sample_pack.json --as-of 2026-11-10 > /tmp/review.json
          python -c "
          import json
          review = json.load(open('/tmp/review.json'))
          assert review['label'] == 'DRAFT FOR KNOWLEDGE MANAGER REVIEW'
          assert review['catalogue_id'] == 'C005'
          assert review['autonomy'] == 'A0'
          assert review['human_approval'] is None
          assert review['actions_taken'] == []
          assert review['executed'] is False
          assert review['model_called'] is False
          assert review['network_called'] is False
          assert review['source_text_echoed'] is False
          assert review['published'] is False
          assert review['outcome'] == 'review_ready'
          topics = [gap['topic'] for gap in review['gaps']]
          assert topics == ['blue-badge', 'missed-bin']
          assert review['counts']['content_gaps'] == 2
          assert review['counts']['evidence_rows_on_gaps'] == 3
          assert review['counts']['content_gaps'] != review['counts']['evidence_rows_on_gaps']
          assert review['human_route']['offered'] is True
          assert review['human_route']['agent_publishes'] is False
          assert review['flags']['article_published'] is False
          assert review['flags']['article_edited'] is False
          assert review['flags']['message_sent'] is False
          assert review['pii_gateway']['output_is_anonymised'] is False
          assert review['pii_gateway']['agent_may_release'] is False
          assert review['regulatory']['consumer_duty']['outcome_met'] is False
          assert review['regulatory']['equality_act']['duty_met'] is False
          assert review['regulatory']['uk_gdpr']['data_minimisation_met'] is False
          assert review['prompt_injection']['hints_dropped'] == []
          print('Review smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/gaps.py --input examples/sample_pack.json --as-of 2027-05-10 > /tmp/stale.json
          python -c "
          import json
          review = json.load(open('/tmp/stale.json'))
          blob = json.dumps(review)
          assert review['stale']['rules_current'] is False
          assert review['outcome'] == 'stale_sources'
          assert review['human_approval'] is None
          assert review['network_called'] is False
          assert review['outlines'] == []
          assert review['published'] is False
          assert 'LEGACY-BODY-DO-NOT-QUOTE' not in blob
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from gaps import GapForbidden, detect_gaps, publish_article, record_confirmation
          pack = json.loads(Path('examples/sample_pack.json').read_text())
          review = detect_gaps(pack, '2026-11-10')
          refused = record_confirmation(review, {
              'decision': 'publish_article',
              'actor': 'knowledge_manager',
              'actor_id': 'SYN-KM-044',
          })
          assert refused['review']['refused'] is True
          assert refused['review']['reason'] == 'prohibited_decision'
          assert refused['published'] is False
          assert refused['human_approval'] is None
          try:
              publish_article()
          except GapForbidden:
              pass
          else:
              raise SystemExit('publish_article should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-44-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/44-knowledge-gap-detector docs-site/docs/experiments/44-knowledge-gap-detector.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 44
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/44-knowledge-gap-detector")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/44-knowledge-gap-detector/README.md
          echo "Licence check passed"
