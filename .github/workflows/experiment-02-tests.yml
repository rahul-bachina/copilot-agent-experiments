name: Experiment 02 - Complaint Intake Tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/02-consumer-duty-complaint-intake/**'
      - '.github/workflows/experiment-02-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/02-consumer-duty-complaint-intake/**'
      - '.github/workflows/experiment-02-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/02-consumer-duty-complaint-intake

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/02-consumer-duty-complaint-intake/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run DISP clock smoke test
        run: |
          python src/disp_clock.py --received 2026-01-02 --route general > /tmp/clock.json
          python -c "
          import json
          clock = json.load(open('/tmp/clock.json'))
          assert clock['operative_final_response_due_on'] == '2026-02-27'
          assert clock['route'] == 'general'
          print('Clock smoke test passed')
          "

      - name: Run intake smoke test
        run: |
          python src/intake.py --received 2026-10-01 --input examples/sample_complaint.txt > /tmp/intake.json
          python -c "
          import json
          intake = json.load(open('/tmp/intake.json'))
          assert intake['processing_mode'] == 'mock'
          assert intake['evaluation_label'].startswith('MOCK SMOKE TEST')
          assert intake['acknowledgement_draft']['may_be_sent_by_agent'] is False
          assert intake['vulnerability_characteristics']['customer_labelled_vulnerable'] is False
          assert intake['security']['actions_taken'] == []
          print('Intake smoke test passed')
          "

      - name: Run evaluation (mock smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'mock'
          assert report['not_a_model_evaluation'] is True
          assert 'MOCK SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 20:
              print('ERROR: fewer than 20 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-02-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/02-consumer-duty-complaint-intake; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 02
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/02-consumer-duty-complaint-intake")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/02-consumer-duty-complaint-intake/README.md
          echo "Licence check passed"
