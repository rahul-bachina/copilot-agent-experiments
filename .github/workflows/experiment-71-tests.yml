name: Experiment 71 - Data retention decision support tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/71-data-retention-decision-support/**'
      - 'experiments/01-foi-complaint-triage/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-71-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/71-data-retention-decision-support/**'
      - 'experiments/01-foi-complaint-triage/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'docs-site/docs/experiments/71-data-retention-decision-support.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-71-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/71-data-retention-decision-support

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/71-data-retention-decision-support/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run advice smoke test
        run: |
          python src/advice.py --request examples/sample_request.json --as-of 2026-11-20 > /tmp/advice.json
          python -c "
          import json
          result = json.load(open('/tmp/advice.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('RETENTION ADVICE FOR THE RECORDS OWNER')
          assert result['catalogue_id'] == 'L007'
          assert result['autonomy'] == 'A0'
          assert result['human_approval'] is None
          assert result['indicative_date'] == '2030-03-31'
          assert result['rule']['line_id'] == 'SCH-FIN-01'
          assert result['disposal_suggested'] is False
          assert result['deleted'] is False
          assert result['sent'] is False
          assert result['moved'] is False
          assert result['archived'] is False
          assert result['relabelled'] is False
          assert result['prompt_injection']['followed'] is False
          assert result['instructions_followed'] is False
          assert result['may_be_relied_on_as_a_disposal_decision'] is False
          assert result['marking']['applied'] == 'OFFICIAL'
          assert '07700' not in blob
          assert 'Priya' not in blob
          assert 'TOP SECRET' not in blob
          print('Advice smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/advice.py --request examples/sample_request.json --as-of 2027-06-01 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          assert result['sources_current'] is False
          assert result['schedule_current'] is False
          assert result['may_be_relied_on_as_a_disposal_decision'] is False
          assert result['human_approval'] is None
          assert result['deleted'] is False
          assert result['coerced'] is False
          assert result['as_of'] == '2027-06-01'
          assert result['indicative_date'] == '2030-03-31'
          assert 'schedule_seen' in result['required_acknowledgements']
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.advice import (
              RetentionForbidden,
              advise_retention,
              delete_records,
              dispose,
              pinned_sources,
              record_advice_seen,
              send,
          )
          pinned = pinned_sources()
          request = json.loads(Path('examples/sample_request.json').read_text())
          result = advise_retention(
              request, pinned['schedule'], pinned['inventory'], pinned['directory'], '2026-11-20',
          )
          forged = record_advice_seen(result, pinned['directory'], {
              'item': 'retention-advice-seen',
              'decision': 'seen',
              'approver_ref': 'RO-2001',
              'advice_hash': 'a' * 64,
              'pins_seen': True,
              'sources_seen': True,
              'route_seen': True,
          })
          assert forged['human_approval'] is None
          assert forged['blocked_reason'] == 'advice_hash_mismatch'
          assert forged['deleted'] is False
          tampered = dict(result)
          tampered['indicative_date'] = '1999-01-01'
          rejected = record_advice_seen(tampered, pinned['directory'], {
              'item': 'retention-advice-seen',
              'decision': 'seen',
              'approver_ref': 'RO-2001',
              'advice_hash': result['advice_hash'],
              'pins_seen': True,
              'sources_seen': True,
              'route_seen': True,
          })
          assert rejected['human_approval'] is None
          assert rejected['blocked_reason'] == 'advice_hash_mismatch'
          try:
              delete_records()
          except RetentionForbidden:
              pass
          else:
              raise SystemExit('delete_records should raise')
          try:
              dispose()
          except RetentionForbidden:
              pass
          else:
              raise SystemExit('dispose should raise')
          try:
              send()
          except RetentionForbidden:
              pass
          else:
              raise SystemExit('send should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 20:
              print('ERROR: expected 20 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          paraphrase = report['paraphrase_recall']
          assert paraphrase['not_added_to_case_total'] is True
          assert paraphrase['support_precision'] == 1.0
          assert paraphrase['support_recall'] == 1.0
          for name, row in paraphrase['categories'].items():
              assert row['sentences'] >= 20, name
              if row['expect_match']:
                  assert row['recall'] == 1.0, name
              else:
                  assert row['false_inclusions'] == 0, name
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-71-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/71-data-retention-decision-support docs-site/docs/experiments/71-data-retention-decision-support.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 71
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/71-data-retention-decision-support")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/71-data-retention-decision-support/README.md
          echo "Licence check passed"
