name: Experiment 13 - Council contact-centre front door tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/13-council-contact-front-door/**'
      - '.github/workflows/experiment-13-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/13-council-contact-front-door/**'
      - '.github/workflows/experiment-13-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/13-council-contact-front-door

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/13-council-contact-front-door/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run front-door smoke test
        run: |
          python src/front_door.py --input examples/sample_enquiry.json --as-of 2026-10-27 > /tmp/front_door.json
          python -c "
          import json
          draft = json.load(open('/tmp/front_door.json'))
          assert draft['label'] == 'DRAFT FOR ADVISER REVIEW'
          assert draft['human_approval'] is None
          assert draft['actions_taken'] == []
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['outcome'] == 'published_answer'
          assert draft['answer']['verbatim_article_id'] == 'waste-example-ward'
          assert draft['adviser_accepted_published_text'] is False
          assert draft['flags']['eligibility_decided'] is False
          assert draft['flags']['case_created'] is False
          assert draft['flags']['message_sent'] is False
          assert draft['flags']['payment_taken'] is False
          assert draft['flags']['released_to_resident'] is False
          assert 'automated AI chatbot' in draft['ai_disclosure']
          print('Front-door smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/front_door.py --input examples/sample_enquiry.json --as-of 2027-10-27 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['any_source_stale'] is True
          assert draft['rules_current'] is False
          assert draft['flags']['any_article_stale'] is True
          assert draft['outcome'] == 'stale_article'
          assert draft['human_approval'] is None
          assert draft['network_called'] is False
          assert draft['flags']['stale_article_quoted'] is False
          assert 'collected on Wednesday' not in json.dumps(draft)
          print('Stale-data smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-13-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/13-council-contact-front-door; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 13
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/13-council-contact-front-door")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/13-council-contact-front-door/README.md
          echo "Licence check passed"
