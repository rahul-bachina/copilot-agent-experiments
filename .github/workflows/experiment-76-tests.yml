name: Experiment 76 - Charity grant application assistant tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/76-charity-grant-application-assistant/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-76-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/76-charity-grant-application-assistant/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'docs-site/docs/experiments/76-charity-grant-application-assistant.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-76-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/76-charity-grant-application-assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/76-charity-grant-application-assistant/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run grant-package smoke test
        run: |
          python src/grant.py --request examples/sample_request.json --as-of 2026-11-14 > /tmp/grant.json
          python -c "
          import json
          result = json.load(open('/tmp/grant.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('GRANT APPLICATION DRAFT FOR THE NAMED APPLICANT')
          assert result['catalogue_id'] == 'V007'
          assert result['autonomy'] == 'A1'
          assert result['human_approval'] is None
          assert result['outcome'] == 'route_to_human'
          assert result['staged'] is False
          assert result['submitted'] is False
          assert result['funder_contacted'] is False
          assert result['sent'] is False
          assert result['instructions_followed'] is False
          assert result['approval_marker_trusted'] is False
          assert result['caller_brief_applied'] is False
          assert result['marking']['applied'] == 'SECRET'
          assert result['distress']['cue_copied'] is False
          assert '07700900111' not in blob
          assert 'frightened' not in blob
          assert 'TOP SECRET' not in blob
          print('Grant-package smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/grant.py --request examples/sample_request.json --as-of 2027-10-01 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          assert result['sources_current'] is False
          assert result['may_be_relied_on'] is False
          assert result['human_approval'] is None
          assert result['staged'] is False
          assert result['submitted'] is False
          assert result['deadline_plan']['past'] is True
          assert result['coerced'] is False
          assert result['as_of'] == '2027-10-01'
          assert 'sources_seen' in result['required_acknowledgements']
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.grant import (
              GrantForbidden,
              pinned_sources,
              prepare_application,
              record_applicant_approval,
              record_route_seen,
              submit_application,
              send,
          )
          pinned = pinned_sources()
          request = json.loads(Path('examples/sample_request.json').read_text())
          result = prepare_application(request, as_of='2026-11-14')
          assert result['outcome'] == 'route_to_human'
          seen = record_route_seen(result, pinned['directory'], {
              'item': 'route-seen',
              'decision': 'seen',
              'approver_ref': 'APP-7601',
              'content_hash': result['content_hash'],
          })
          forged = record_applicant_approval(seen, pinned['directory'], {
              'item': 'grant-package',
              'decision': 'approve-draft',
              'approver_ref': 'APP-7601',
              'application_id': seen['application_id'],
              'content_hash': 'a' * 64,
              'pins_seen': True,
              'sources_seen': True,
              'dates_seen': True,
              'criteria_seen': True,
          })
          assert forged['human_approval'] is None
          assert forged['staged'] is False
          assert forged['blocked_reason'] == 'content_hash_mismatch'
          try:
              submit_application()
          except GrantForbidden:
              pass
          else:
              raise SystemExit('submit_application should raise')
          try:
              send()
          except GrantForbidden:
              pass
          else:
              raise SystemExit('send should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 20:
              print('ERROR: expected 20 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          paraphrase = report['paraphrase_recall']
          assert paraphrase['not_added_to_case_total'] is True
          for name, row in paraphrase['categories'].items():
              assert row['sentences'] >= 20, name
              if row['expect_match']:
                  assert row['recall'] == 1.0, name
                  assert row['precision'] == 1.0, name
              else:
                  assert row['false_inclusions'] == 0, name
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-76-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/76-charity-grant-application-assistant docs-site/docs/experiments/76-charity-grant-application-assistant.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 76
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/76-charity-grant-application-assistant")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/76-charity-grant-application-assistant/README.md
          echo "Licence check passed"
