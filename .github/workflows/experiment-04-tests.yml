name: Experiment 04 - Cryptoasset readiness tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/04-fca-cryptoasset-readiness/**'
      - '.github/workflows/experiment-04-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/04-fca-cryptoasset-readiness/**'
      - '.github/workflows/experiment-04-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/04-fca-cryptoasset-readiness

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/04-fca-cryptoasset-readiness/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run gap register smoke test
        run: |
          python src/gap_register.py --pack examples/harbourline --as-of 2026-10-24 > /tmp/register.json
          python -c "
          import json
          register = json.load(open('/tmp/register.json'))
          assert register['label'] == 'DRAFT FOR HUMAN REVIEW'
          assert register['readiness_conclusion'] is None
          assert register['firm_ready'] is None
          assert register['actions_taken'] == []
          assert register['model_called'] is False
          assert register['network_called'] is False
          assert register['any_source_stale'] is False
          assert register['catalogue_last_verified'] == '2026-10-24'
          print('Gap register smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/gap_register.py --pack examples/harbourline --as-of 2027-04-01 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          register = json.load(open('/tmp/stale.json'))
          assert register['any_source_stale'] is True
          assert register['readiness_conclusion'] is None
          assert all(row['currency'] == 'stale' for row in register['sources_and_currency'])
          print('Stale-data smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 12:
              print('ERROR: fewer than 12 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-04-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/04-fca-cryptoasset-readiness; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 04
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/04-fca-cryptoasset-readiness")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/04-fca-cryptoasset-readiness/README.md
          echo "Licence check passed"
