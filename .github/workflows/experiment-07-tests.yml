name: Experiment 07 - Consultation theme tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/07-consultation-themes/**'
      - '.github/workflows/experiment-07-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/07-consultation-themes/**'
      - '.github/workflows/experiment-07-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/07-consultation-themes

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/07-consultation-themes/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run intake smoke test
        run: |
          python -m src.cli intake --input eval/synthetic_dataset.json --as-of 2026-10-24 > /tmp/intake.json
          python -c "
          import json
          status = json.load(open('/tmp/intake.json'))
          assert status['themes_coded'] is False
          assert status['submission_count'] == 24
          assert status['security']['actions_taken'] == []
          assert status['security']['may_be_published_by_agent'] is False
          assert 'R-18' in status['injection_response_ids']
          print('Intake smoke test passed')
          "

      - name: Run analysis smoke test
        run: |
          python -m src.cli analyse --input eval/synthetic_dataset.json --as-of 2026-10-24 > /tmp/analysis.json
          python -c "
          import json
          analysis = json.load(open('/tmp/analysis.json'))
          assert analysis['processing_mode'] == 'deterministic_fallback'
          assert analysis['analysis_status'] == 'blocked_framework_unapproved'
          assert analysis['framework']['framework_approved'] is False
          assert analysis['security']['actions_taken'] == []
          assert analysis['security']['may_be_published_by_agent'] is False
          assert analysis['external_engine']['citation']['vendored'] is False
          print('Analysis smoke test passed')
          "

      - name: Run evaluation (mock smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'mock'
          assert report['not_a_model_evaluation'] is True
          assert report['not_an_expert_coder_comparison'] is True
          assert 'MOCK SMOKE TEST' in report['evaluation_label']
          assert report['passed'] is True
          assert report['errors'] == []
          if report['synthetic_cases'] < 20:
              print('ERROR: fewer than 20 synthetic cases')
              raise SystemExit(1)
          assert 'T-braille' in report['minority_theme_ids']
          assert report['may_be_published_by_agent'] is False
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-07-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/07-consultation-themes; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 07
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/07-consultation-themes")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/07-consultation-themes/README.md
          echo "Licence check passed"
