name: Experiment 68 - Regulatory change briefing tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/68-regulatory-change-briefing/**'
      - 'experiments/04-fca-cryptoasset-readiness/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/20-complaints-root-cause-mi/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-68-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/68-regulatory-change-briefing/**'
      - 'experiments/04-fca-cryptoasset-readiness/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/20-complaints-root-cause-mi/**'
      - 'docs-site/docs/experiments/68-regulatory-change-briefing.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-68-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/68-regulatory-change-briefing

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/68-regulatory-change-briefing/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run briefing smoke test
        run: |
          python src/briefing.py --request examples/sample_request.json --register fixtures/policy_register.json --directory fixtures/directory.json --as-of 2026-11-14 > /tmp/briefing.json
          python -c "
          import json
          result = json.load(open('/tmp/briefing.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('REGULATORY CHANGE BRIEFING FOR A COMPLIANCE OWNER')
          assert result['catalogue_id'] == 'L002'
          assert result['autonomy'] == 'A0'
          assert result['human_approval'] is None
          assert result['outcome'] == 'briefing'
          assert result['applies'] is None
          assert result['policy_changed'] is False
          assert result['control_changed'] is False
          assert result['record_changed'] is False
          assert result['sent'] is False
          assert result['marked_applicable'] is False
          assert result['marked_acceptable'] is False
          assert result['instructions_followed'] is False
          assert result['prompt_injection']['followed'] is False
          assert result['dates']['consultation_close']['display'] == '2027-02-28'
          assert result['dates']['effective']['display'] == 'not stated'
          assert result['network_called'] is False
          assert result['live_site_fetched'] is False
          assert result['pins_confirmed'] is False
          assert result['may_be_relied_on'] is False
          assert result['caller_text_used'] is False
          assert 'POL-CREDIT' not in [row['policy_id'] for row in result['might_be_affected']]
          assert '07700' not in blob
          assert 'ada.north' not in blob.lower()
          assert 'TOP SECRET' not in blob
          print('Briefing smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/briefing.py --request examples/sample_request.json --register fixtures/policy_register.json --directory fixtures/directory.json --as-of 2027-06-01 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          assert result['sources_current'] is False
          assert result['may_be_relied_on'] is False
          assert result['flags']['stale'] is True
          assert result['human_approval'] is None
          assert result['applies'] is None
          assert result['sent'] is False
          assert result['coerced'] is False
          assert result['as_of'] == '2027-06-01'
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.briefing import BriefingForbidden, change_policy, decide_applicability, record_owner_seen, send
          directory = json.loads(Path('fixtures/directory.json').read_text())
          register = json.loads(Path('fixtures/policy_register.json').read_text())
          request = json.loads(Path('examples/sample_request.json').read_text())
          result = __import__('src.briefing', fromlist=['draft_briefing']).draft_briefing(request, register, directory, '2026-11-14')
          forged = record_owner_seen(result, directory, {
              'publication_hash': result['publication_hash'],
              'briefing_hash': 'a' * 64,
              'questions_hash': result['questions_hash'],
              'approver_ref': 'CO-1001',
              'decision': 'seen',
              'item': 'briefing',
              'pins_seen': True,
              'sources_seen': True,
          })
          assert forged['human_approval'] is None
          assert forged['applies'] is None
          assert forged['sent'] is False
          assert forged['blocked_reason'] == 'briefing_hash_mismatch'
          for fn in (decide_applicability, change_policy, send):
              try:
                  fn()
              except BriefingForbidden:
                  pass
              else:
                  raise SystemExit(fn.__name__ + ' should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 20:
              print('ERROR: expected 20 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          paraphrase = report['paraphrase_recall']
          assert paraphrase['not_added_to_case_total'] is True
          for name, row in paraphrase['categories'].items():
              assert row['sentences'] >= 20, name
              if row['expect_match']:
                  assert row['recall'] == 1.0, name
              else:
                  assert row['false_inclusions'] == 0, name
              if row['denial_recall'] is not None:
                  assert row['denial_recall'] == 1.0, name
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-68-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/68-regulatory-change-briefing docs-site/docs/experiments/68-regulatory-change-briefing.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 68
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/68-regulatory-change-briefing")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/68-regulatory-change-briefing/README.md
          echo "Licence check passed"
