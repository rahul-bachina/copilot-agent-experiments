name: Experiment 14 - Agent Architecture Advisor tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/14-agent-architecture-advisor/**'
      - 'experiments/03-agent-inventory-atrs-assurance/src/**'
      - 'schemas/agent-manifest.schema.json'
      - '.github/workflows/experiment-14-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/14-agent-architecture-advisor/**'
      - 'experiments/03-agent-inventory-atrs-assurance/src/**'
      - 'schemas/agent-manifest.schema.json'
      - '.github/workflows/experiment-14-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/14-agent-architecture-advisor

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/14-agent-architecture-advisor/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run advisor smoke test
        run: |
          python src/advise.py --case examples/sample_use_case.json --as-of 2026-10-27 > /tmp/advise.json
          python -c "
          import json
          draft = json.load(open('/tmp/advise.json'))
          assert draft['label'] == 'DRAFT FOR ARCHITECT REVIEW'
          assert draft['platform_selected'] is None
          assert draft['decision'] is None
          assert draft['deployed'] is False
          assert draft['actions_taken'] == []
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['a3_recommended'] is False
          assert draft['recommended_autonomy'] == 'A0'
          assert draft['architect_confirmed'] is False
          assert draft['manifest_approved'] is False
          assert draft['manifest_skeleton']['validation_passed'] is True
          assert draft['manifest_skeleton']['approved'] is False
          assert all(option['selected'] is False for option in draft['options'])
          print('Advisor smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/advise.py --case examples/sample_use_case.json --as-of 2027-04-01 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['sources_stale'] is True
          assert draft['do_not_rely'] is True
          assert draft['platform_selected'] is None
          assert draft['deployed'] is False
          assert draft['a3_recommended'] is False
          assert draft['network_called'] is False
          opened = [row for row in draft['sources'] if row['body_opened']]
          assert opened and all(row['stale'] is True for row in opened)
          boundary = next(row for row in draft['sources'] if row['id'] == 'catalogue-boundary')
          assert boundary['stale'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 15:
              print('ERROR: fewer than 15 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-14-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/14-agent-architecture-advisor docs-site/docs/experiments/14-agent-architecture-advisor.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No prices copied
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          roots = [
              Path("experiments/14-agent-architecture-advisor"),
              Path("docs-site/docs/experiments/14-agent-architecture-advisor.md"),
          ]
          price = re.compile(r"(£|€|\$\d|free of charge|\d+ Copilot Credits)", re.I)
          failed = False
          for root in roots:
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml"}:
                      continue
                  if path.name == "test_advisor.py":
                      continue
                  if price.search(path.read_text(errors="ignore")):
                      print(f"Price-like text in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Price check passed")
          PY

      - name: No obvious secrets in Experiment 14
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/14-agent-architecture-advisor")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/14-agent-architecture-advisor/README.md
          echo "Licence check passed"
