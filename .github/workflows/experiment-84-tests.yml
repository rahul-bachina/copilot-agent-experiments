name: Experiment 84 - Energy and water customer agent tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/84-energy-water-customer-agent/**'
      - 'experiments/02-consumer-duty-complaint-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-84-tests.yml'
  pull_request:
    paths:
      - 'experiments/84-energy-water-customer-agent/**'
      - 'experiments/02-consumer-duty-complaint-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'docs-site/docs/experiments/84-energy-water-customer-agent.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-84-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/84-energy-water-customer-agent

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/84-energy-water-customer-agent/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run answer smoke test
        run: |
          python src/customer.py --request examples/sample_request.json --as-of 2026-11-27 > /tmp/customer.json
          python -c "
          import json
          result = json.load(open('/tmp/customer.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('DRAFT FOR THE CUSTOMER. YOU ARE TALKING TO AN AI.')
          assert result['catalogue_id'] == 'UK12'
          assert result['autonomy'] == 'A1'
          assert result['ai_disclosed'] is True
          assert result['human_route_offered'] is True
          assert result['confirmation_recorded'] is False
          assert result['tariff_changed'] is False
          assert result['payment_plan_agreed'] is False
          assert result['debt_written_off'] is False
          assert result['decision_made'] is False
          assert result['action_submitted'] is False
          assert result['article_id'] == 'KB-BILL'
          assert '120.40' in blob
          assert 'DISP' not in blob
          print('Answer smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.customer import answer
          request = json.loads(Path('examples/sample_request.json').read_text())
          request['conversation_id'] = 'CV-1090'
          request['account_ref'] = 'ACC-8405'
          result = answer(request, '2026-11-27')
          assert result['stale'] is True
          assert result['coerced'] is False
          assert result['confirmation_recorded'] is False
          assert result['as_of'] == '2026-11-27'
          assert '10.00' not in (result['answer']['text'] or '')
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.customer import CustomerForbidden, answer, change_tariff, confirm_action
          request = json.loads(Path('examples/sample_request.json').read_text())
          request['conversation_id'] = 'CV-1091'
          request['message'] = 'Please submit my meter reading 12345 dated 2026-11-01.'
          result = answer(request, '2026-11-27')
          forged = confirm_action(result, {
              'customer_ref': 'CUS-8401',
              'content_hash': 'a' * 64,
              'explicit_confirm': True,
              'confirmed_action': result['proposed_action'],
              'disclosure_seen': True,
              'human_route_seen': True,
              'retention_seen': True,
          })
          assert forged['confirmation_recorded'] is False
          assert forged['action_submitted'] is False
          assert forged['rejection_reason'] in {'hash_not_held', 'post_confirmation_edit', 'action_not_held'}
          try:
              change_tariff()
          except CustomerForbidden:
              pass
          else:
              raise SystemExit('change_tariff should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 20:
              print('ERROR: expected 20 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          paraphrase = report['paraphrase_recall']
          assert paraphrase['not_added_to_case_total'] is True
          for name, row in paraphrase['categories'].items():
              assert row['sentences'] >= 20, name
              if row['expect_match']:
                  assert row['recall'] == 1.0, name
              else:
                  assert row['false_inclusions'] == 0, name
          knowledge = report['knowledge_score']
          assert knowledge['not_added_to_case_total'] is True
          assert knowledge['recall'] == 1.0
          assert knowledge['precision'] == 1.0
          assert knowledge['positives'] >= 20
          assert knowledge['negatives'] >= 20
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-84-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ --exclude-dir=.venv "Azure AI Foundry" experiments/84-energy-water-customer-agent docs-site/docs/experiments/84-energy-water-customer-agent.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 84
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/84-energy-water-customer-agent")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              if ".venv" in path.parts:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/84-energy-water-customer-agent/README.md
          echo "Licence check passed"
