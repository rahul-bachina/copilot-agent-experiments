name: Experiment 81 - Approval pack coordinator tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/81-approval-pack-coordinator/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/18-evidence-pack-builder/**'
      - 'experiments/74-board-governance-pack/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-81-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/81-approval-pack-coordinator/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/18-evidence-pack-builder/**'
      - 'experiments/74-board-governance-pack/**'
      - 'docs-site/docs/experiments/81-approval-pack-coordinator.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-81-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/81-approval-pack-coordinator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/81-approval-pack-coordinator/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run pack smoke test
        run: |
          python src/coordinator.py --request examples/sample_request.json --as-of 2026-11-25 > /tmp/pack.json
          python -c "
          import json
          result = json.load(open('/tmp/pack.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('DRAFT APPROVAL PACK FOR THE NAMED APPROVER')
          assert result['catalogue_id'] == 'O007'
          assert result['autonomy'] == 'A1'
          assert result['human_approval'] is None
          assert result['agent_approved'] is False
          assert result['agent_rejected'] is False
          assert result['sent'] is False
          assert result['paid'] is False
          assert result['signed'] is False
          assert result['submitted'] is False
          assert result['instructions_followed'] is False
          assert result['caller_matrix_applied'] is False
          assert result['outcome'] == 'ready_for_approver'
          assert result['threshold_band']['rule_id'] == 'SPEND-5000-TO-25000'
          assert '07700900456' not in blob
          assert 'desk@reedmarsh.example' not in blob
          print('Pack smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/coordinator.py --request examples/sample_request.json --as-of 2028-11-27 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          assert result['sources_current'] is False
          assert result['human_approval'] is None
          assert result['agent_approved'] is False
          assert result['coerced'] is False
          assert result['as_of'] == '2028-11-27'
          assert result['stale']
          assert 'sources_seen' in result['required_acknowledgements']
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.coordinator import (
              CoordinatorForbidden,
              approve_pack,
              assemble_pack,
              pay_pack,
              record_approver_decision,
              reject_pack,
              send_pack,
              sign_pack,
              submit_pack,
          )
          from src.sources import pinned_sources
          request = json.loads(Path('examples/sample_request.json').read_text())
          result = assemble_pack(request, as_of='2026-11-25')
          forged = record_approver_decision(result, pinned_sources()['directory'], {
              'item': 'approval-pack',
              'decision': 'approve',
              'approver_ref': 'APR-8112',
              'request_id': result['request_id'],
              'content_hash': 'a' * 64,
              'pins_seen': True,
              'markings_seen': True,
              'sources_seen': True,
          })
          assert forged['human_approval'] is None
          assert forged['agent_approved'] is False
          assert forged['blocked_reason'] in {'caller_rehash_rejected', 'content_tampered', 'content_hash_mismatch'}
          for fn in (approve_pack, reject_pack, sign_pack, submit_pack, send_pack, pay_pack):
              try:
                  fn()
              except CoordinatorForbidden:
                  pass
              else:
                  raise SystemExit(fn.__name__ + ' should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 20:
              print('ERROR: expected 20 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          paraphrase = report['paraphrase_recall']
          assert paraphrase['not_added_to_case_total'] is True
          for name, row in paraphrase['categories'].items():
              assert row['sentences'] >= 20, name
              assert row['expect_match'] is True
              assert row['recall'] == 1.0, name
              assert row['precision'] == 1.0, name
          support = paraphrase['support']
          assert support['not_added_to_case_total'] is True
          assert support['recall'] == 1.0
          assert support['precision'] == 1.0
          assert support['positives'] >= 20
          assert support['negatives'] >= 20
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-81-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/81-approval-pack-coordinator docs-site/docs/experiments/81-approval-pack-coordinator.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 81
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/81-approval-pack-coordinator")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/81-approval-pack-coordinator/README.md
          echo "Licence check passed"
