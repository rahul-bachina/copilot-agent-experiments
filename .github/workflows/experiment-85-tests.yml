name: Experiment 85 - Visit notes to case record tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/85-visit-notes-case-record/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-85-tests.yml'
  pull_request:
    paths:
      - 'experiments/85-visit-notes-case-record/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'docs-site/docs/experiments/85-visit-notes-case-record.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-85-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/85-visit-notes-case-record

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/85-visit-notes-case-record/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run draft smoke test
        run: |
          python src/notes.py --request examples/sample_request.json --as-of 2026-11-20 > /tmp/note.json
          python -c "
          import json
          result = json.load(open('/tmp/note.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('DRAFT VISIT NOTE')
          assert result['catalogue_id'] == 'UK13'
          assert result['autonomy'] == 'A1'
          assert result['human_approval'] is None
          assert result['case_record_written'] is False
          assert result['note_shared'] is False
          assert result['assessment_made'] is False
          assert result['recording_consent']['status'] == 'given'
          assert result['facts_invented'] is False
          assert '07700900123' not in blob
          assert 'pat.example@northmarsh.example' not in blob
          assert 'Pat Example' not in blob
          print('Draft smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.notes import draft_note
          request = json.loads(Path('examples/sample_request.json').read_text())
          request['visit_id'] = 'VIS-STALE'
          request['question_date'] = '2026-11-20'
          request['visit_date'] = '2026-01-01'
          result = draft_note(request, as_of='2026-11-20')
          assert result['stale'] is True
          assert result['may_be_relied_on'] is False
          assert result['human_approval'] is None
          assert result['case_record_written'] is False
          assert result['coerced'] is False
          assert result['as_of'] == '2026-11-20'
          assert 'dates_seen' in result['required_acknowledgements']
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.notes import (
              NotesForbidden,
              assess_eligibility,
              assess_need,
              assess_risk,
              draft_note,
              pinned_directory,
              record_practitioner_approval,
              share_note,
              write_case_record,
          )
          request = json.loads(Path('examples/sample_request.json').read_text())
          result = draft_note(request, as_of='2026-11-20')
          forged = record_practitioner_approval(result, pinned_directory(), {
              'item': 'case-note',
              'decision': 'approve',
              'approver_ref': 'PRAC-8501',
              'visit_id': result['visit_id'],
              'content_hash': 'a' * 64,
              'pins_seen': True,
              'markings_seen': True,
              'retention_seen': True,
          })
          assert forged['human_approval'] is None
          assert forged['blocked_reason'] in {'caller_rehash_rejected', 'content_tampered', 'content_hash_mismatch'}
          assert forged['case_record_written'] is False
          for fn in (write_case_record, share_note, assess_eligibility, assess_risk, assess_need):
              try:
                  fn()
              except NotesForbidden:
                  pass
              else:
                  raise SystemExit(fn.__name__ + ' should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 20:
              print('ERROR: expected 20 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          paraphrase = report['paraphrase_recall']
          assert paraphrase['not_added_to_case_total'] is True
          for name, row in paraphrase['categories'].items():
              assert row['sentences'] >= 20, name
              if row['expect_match']:
                  assert row['recall'] == 1.0, name
                  assert row['affirmed_recall'] == 1.0, name
              else:
                  assert row['false_inclusions'] == 0, name
          grounding = report['grounding_score']
          assert grounding['not_added_to_case_total'] is True
          assert grounding['recall'] == 1.0
          assert grounding['precision'] == 1.0
          assert grounding['positives'] >= 20
          assert grounding['negatives'] >= 20
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-85-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ --exclude-dir=.venv "Azure AI Foundry" experiments/85-visit-notes-case-record docs-site/docs/experiments/85-visit-notes-case-record.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 85
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/85-visit-notes-case-record")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              if ".venv" in path.parts:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/85-visit-notes-case-record/README.md
          echo "Licence check passed"
