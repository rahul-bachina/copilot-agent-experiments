name: Experiment 48 - Customer sentiment evidence tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/48-customer-sentiment-evidence/**'
      - 'experiments/02-consumer-duty-complaint-intake/**'
      - 'experiments/07-consultation-themes/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/20-complaints-root-cause-mi/**'
      - '.github/workflows/experiment-48-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/48-customer-sentiment-evidence/**'
      - 'experiments/02-consumer-duty-complaint-intake/**'
      - 'experiments/07-consultation-themes/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/20-complaints-root-cause-mi/**'
      - 'docs-site/docs/experiments/48-customer-sentiment-evidence.md'
      - '.github/workflows/experiment-48-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/48-customer-sentiment-evidence

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/48-customer-sentiment-evidence/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run evidence smoke test
        run: |
          python src/evidence.py --input examples/sample_batch.json --as-of 2026-11-11 > /tmp/pack.json
          python -c "
          import json
          pack = json.load(open('/tmp/pack.json'))
          assert pack['label'].startswith('DRAFT CUSTOMER SENTIMENT EVIDENCE')
          assert pack['catalogue_id'] == 'C010'
          assert pack['autonomy'] == 'A0'
          assert pack['human_approval'] is None
          assert pack['ready'] is False
          assert pack['actions_taken'] == []
          assert pack['executed'] is False
          assert pack['model_called'] is False
          assert pack['network_called'] is False
          assert pack['text_echoed'] is False
          assert pack['outcome'] == 'draft_pending_analyst'
          overall = pack['distribution']['overall']
          assert overall['n'] == pack['counts']['unique_voices'] == 7
          assert sum(overall['counts'].values()) == overall['n']
          assert pack['distribution']['channel_n_equals_overall'] is True
          assert pack['distribution']['period_n_equals_overall'] is True
          assert pack['counts']['in_frame_records'] == 8
          assert pack['flags']['published'] is False
          assert pack['flags']['contacted_customer'] is False
          assert pack['flags']['individual_conclusion'] is False
          assert pack['flags']['duty_met'] is False
          assert pack['outcome_testing']['is_the_prin_2a_8_report'] is False
          assert pack['human_route']['offered'] is True
          assert pack['human_route']['agent_publishes'] is False
          blob = json.dumps(pack)
          assert 'QQ123456A' not in blob
          assert 'Amira' not in blob
          print('Evidence smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/evidence.py --input examples/sample_batch.json --as-of 2027-05-11 > /tmp/stale.json
          python -c "
          import json
          pack = json.load(open('/tmp/stale.json'))
          blob = json.dumps(pack)
          assert pack['stale']['rules_current'] is False
          assert pack['outcome'] == 'stale_sources'
          assert pack['human_approval'] is None
          assert pack['ready'] is False
          assert pack['network_called'] is False
          assert all(row['taken'] is None for row in pack['sources'])
          assert pack['distribution']['overall']['n'] == 7
          assert pack['flags']['published'] is False
          assert 'equip retail customers' not in blob
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from evidence import SentimentForbidden, contact_customer, prepare_pack, record_review
          batch = json.loads(Path('examples/sample_batch.json').read_text())
          pack = prepare_pack(batch, '2026-11-11')
          refused = record_review(pack, {
              'decision': 'contact_customer',
              'actor_role': 'Analyst',
              'actor_id': 'SYN-AN-048',
              'batch_id': pack['batch_id'],
              'draft_checksum': pack['draft_checksum'],
          })
          assert refused['review']['refused'] is True
          assert refused['review']['reason'] == 'prohibited_decision'
          assert refused['flags']['contacted_customer'] is False
          assert refused['human_approval'] is None
          try:
              contact_customer()
          except SentimentForbidden:
              pass
          else:
              raise SystemExit('contact_customer should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-48-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/48-customer-sentiment-evidence docs-site/docs/experiments/48-customer-sentiment-evidence.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 48
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/48-customer-sentiment-evidence")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/48-customer-sentiment-evidence/README.md
          echo "Licence check passed"
