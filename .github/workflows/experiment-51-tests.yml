name: Experiment 51 - Teams channel digest tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/51-teams-channel-digest/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'experiments/41-case-summary/**'
      - '.github/workflows/experiment-51-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/51-teams-channel-digest/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'experiments/41-case-summary/**'
      - 'docs-site/docs/experiments/51-teams-channel-digest.md'
      - '.github/workflows/experiment-51-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/51-teams-channel-digest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/51-teams-channel-digest/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run digest smoke test
        run: |
          python src/digest.py --input examples/sample_export.json --as-of 2026-11-12 --confirm examples/sample_confirmation.json > /tmp/digest.json
          python -c "
          import json
          draft = json.load(open('/tmp/digest.json'))
          assert draft['label'] == 'DRAFT TEAMS CHANNEL DIGEST. NOT POSTED. NOT A MONITORING DECISION.'
          assert draft['catalogue_id'] == 'M002'
          assert draft['autonomy'] == 'A0'
          assert draft['human_approval'] is None
          assert draft['actions_taken'] == []
          assert draft['digest_produced'] is True
          assert draft['scope_confirmed'] is True
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['graph_called'] is False
          assert draft['foundry_called'] is False
          assert draft['flags']['posted'] is False
          assert draft['flags']['replied'] is False
          assert draft['flags']['reacted'] is False
          assert draft['flags']['mentioned'] is False
          assert draft['flags']['forwarded'] is False
          assert draft['digest']['decisions'][0]['message_ids'] == ['SYN-MSG-0511']
          assert draft['digest']['actions'][0]['owner'] == 'Priya Shah'
          assert draft['regulatory']['purpose_limitation_met'] is False
          assert draft['regulatory']['data_minimisation_met'] is False
          assert draft['regulatory']['monitoring_decided'] is False
          assert draft['regulatory']['held_information_decided'] is False
          assert draft['human_route']['offered'] is True
          assert draft['human_route']['agent_posts'] is False
          counts = draft['digest']['counts']
          assert counts['section_counts_are_not_added_to_message_count'] is True
          assert 'total' not in counts
          print('Digest smoke test passed')
          "

      - name: Run scope-only smoke test
        run: |
          python src/digest.py --input examples/sample_export.json --as-of 2026-11-12 > /tmp/scope.json
          python -c "
          import json
          draft = json.load(open('/tmp/scope.json'))
          blob = json.dumps(draft)
          assert draft['digest_produced'] is False
          assert draft['digest'] is None
          assert draft['human_approval'] is None
          assert 'Saturday library hours' not in blob
          assert draft['channels'][1]['status'] == 'no_messages_in_period'
          print('Scope-only smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from digest import run
          export = json.loads(Path('examples/sample_export.json').read_text())
          export['retrieved_on'] = '2026-10-01'
          refused = run(export, '2026-11-12', json.loads(Path('examples/sample_confirmation.json').read_text()))
          assert refused['digest_produced'] is False
          assert refused['scope_confirmation']['reason'] == 'stale_export_not_acknowledged'
          assert refused['stale_export']['stale'] is True
          assert refused['network_called'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from digest import DigestForbidden, post_message, run
          export = json.loads(Path('examples/sample_export.json').read_text())
          review = json.loads(Path('examples/sample_confirmation.json').read_text())
          review['decision'] = 'post'
          refused = run(export, '2026-11-12', review)
          assert refused['digest_produced'] is False
          assert refused['scope_confirmation']['reason'] == 'prohibited_decision'
          assert refused['flags']['posted'] is False
          assert refused['human_approval'] is None
          try:
              post_message()
          except DigestForbidden:
              pass
          else:
              raise SystemExit('post_message should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-51-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/51-teams-channel-digest docs-site/docs/experiments/51-teams-channel-digest.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 51
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/51-teams-channel-digest")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/51-teams-channel-digest/README.md
          echo "Licence check passed"
