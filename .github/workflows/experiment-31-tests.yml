name: Experiment 31 - Agent cost and capacity tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/31-agent-cost-capacity/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/31-agent-cost-capacity.md'
      - '.github/workflows/experiment-31-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/31-agent-cost-capacity/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/31-agent-cost-capacity.md'
      - '.github/workflows/experiment-31-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/31-agent-cost-capacity

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/31-agent-cost-capacity/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run sandbox smoke test
        run: |
          python src/report.py --bundle examples/sample_bundle.json --rate-card examples/sample_rate_card.json --as-of 2026-11-03 > /tmp/report.json
          python -c "
          import json
          from decimal import Decimal
          draft = json.load(open('/tmp/report.json'))
          assert draft['label'] == 'DRAFT FOR FINOPS REVIEW'
          assert draft['catalogue_id'] == 'G009'
          assert draft['autonomy'] == 'A0'
          assert draft['rates_validated'] is False
          assert draft['forecast_validated'] is False
          assert draft['quota_changed'] is False
          assert draft['budget_changed'] is False
          assert draft['subscription_changed'] is False
          assert draft['actions_taken'] == []
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['a3_recommended'] is False
          assert draft['builtin_rates_used'] is False
          assert draft['microsoft_prices_used'] is False
          assert draft['added_rollup'] is False
          assert draft['priced_tokens_on_credit_agents'] == '0.0000'
          assert draft['do_not_rely'] is False
          assert draft['totals']['cost'] == '4.3500'
          assert draft['totals']['partial_cost'] == '4.3500'
          agent_sum = sum(Decimal(row['cost']) for row in draft['agents'])
          assert agent_sum == Decimal(draft['totals']['cost'])
          foundry = next(row for row in draft['capacity'] if row['quota_id'] == 'foundry-input')
          assert foundry['used'] == '500000'
          assert '9.9999' not in json.dumps(draft)
          print('Sandbox smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/report.py --bundle examples/sample_bundle.json --rate-card examples/sample_rate_card.json --as-of 2027-05-01 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['do_not_rely'] is True
          assert draft['rates_validated'] is False
          assert draft['forecast_validated'] is False
          assert draft['quota_changed'] is False
          assert draft['a3_recommended'] is False
          assert draft['network_called'] is False
          assert draft['totals']['cost'] == '4.3500'
          assert draft['added_rollup'] is False
          opened = [row for row in draft['sources'] if row.get('stale_applicable')]
          assert opened and all(row['stale'] is True for row in opened)
          boundary = next(row for row in draft['sources'] if row['id'] == 'catalogue-boundary')
          assert boundary['stale'] is False
          assert boundary['reopened_for_this_experiment'] is False
          assert draft['rate_card']['stale'] is True
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          for flag in --validate-rates --validate-forecast --change-quota --change-budget --change-subscription; do
            set +e
            python src/report.py --bundle examples/sample_bundle.json --rate-card examples/sample_rate_card.json --as-of 2026-11-03 "$flag" > /tmp/prohibited.json
            code=$?
            set -e
            test "$code" -eq 2
            test ! -s /tmp/prohibited.json
          done
          echo "Prohibited-action smoke test passed"

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert report['not_a_microsoft_invoice'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          assert 'grand_total' not in report['summary']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 12:
              print('ERROR: fewer than 12 cases')
              raise SystemExit(1)
          costs = [case['totals_cost'] for case in report['cases'] if case['id'] in {'northfen-october', 'duplicate-agent-dropped'}]
          assert costs == ['4.3500', '4.3500']
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-31-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/31-agent-cost-capacity docs-site/docs/experiments/31-agent-cost-capacity.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No Microsoft price copied into the source
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          roots = [
              Path("experiments/31-agent-cost-capacity"),
              Path("docs-site/docs/experiments/31-agent-cost-capacity.md"),
          ]
          currency = re.compile(r"[£€]|\$\d")
          # A number next to a Microsoft price phrase. A denial that a figure is a list price is allowed.
          claim = re.compile(
              r"Microsoft[^.\n]{0,80}(list price|charges|per credit)[^.\n]{0,40}\d",
              re.I,
          )
          failed = False
          for root in roots:
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml"}:
                      continue
                  if path.name == "synthetic_dataset.json" or "tests" in path.parts:
                      continue
                  text = path.read_text(errors="ignore")
                  if currency.search(text) or claim.search(text):
                      print(f"Price-like Microsoft claim in {path}")
                      failed = True
          builtin = Path("experiments/31-agent-cost-capacity/src")
          for path in builtin.glob("*.py"):
              text = path.read_text(errors="ignore")
              if "RATE_TABLE" in text or re.search(r"BUILTIN_RATES\s*=\s*(?!None\b)\S", text):
                  print(f"Built-in rate marker in {path}")
                  failed = True
          if failed:
              sys.exit(1)
          print("Price check passed")
          PY

      - name: No obvious secrets in Experiment 31
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/31-agent-cost-capacity")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/31-agent-cost-capacity/README.md
          echo "Licence check passed"
