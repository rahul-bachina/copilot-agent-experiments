name: Experiment 70 - Conflict-of-interest intake tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/70-conflict-of-interest-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/32-employee-case-intake/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-70-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/70-conflict-of-interest-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/32-employee-case-intake/**'
      - 'docs-site/docs/experiments/70-conflict-of-interest-intake.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-70-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/70-conflict-of-interest-intake

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/70-conflict-of-interest-intake/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run declaration smoke test
        run: |
          python src/declaration.py --request examples/sample_request.json --as-of 2026-11-14 > /tmp/declaration.json
          python -c "
          import json
          result = json.load(open('/tmp/declaration.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('DECLARATION DRAFT FOR THE ETHICS TEAM')
          assert result['catalogue_id'] == 'L005'
          assert result['autonomy'] == 'A1'
          assert result['human_approval'] is None
          assert result['outcome'] == 'draft'
          assert result['staged'] is False
          assert result['conflict_exists'] is None
          assert result['sent'] is False
          assert result['person_cleared'] is False
          assert result['supplier_excluded'] is False
          assert result['prompt_injection']['followed'] is False
          assert result['instructions_followed'] is False
          assert result['marking']['applied'] == 'OFFICIAL'
          assert result['potential_links'][0]['procurement_id'] == 'PROC-2026-014'
          assert '07700' not in blob
          assert 'Priya' not in blob
          assert 'TOP SECRET' not in blob
          print('Declaration smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/declaration.py --request examples/sample_request.json --as-of 2027-06-01 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          assert result['sources_current'] is False
          assert result['may_be_relied_on'] is False
          assert result['register_review']['register']['stale'] is True
          assert result['human_approval'] is None
          assert result['staged'] is False
          assert result['coerced'] is False
          assert result['as_of'] == '2027-06-01'
          assert 'register_seen' in result['required_acknowledgements']
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.declaration import (
              DeclarationForbidden,
              confirm_declaration,
              decide_conflict,
              draft_declaration,
              pinned_sources,
              send,
          )
          pinned = pinned_sources()
          request = json.loads(Path('examples/sample_request.json').read_text())
          result = draft_declaration(
              request, pinned['suppliers'], pinned['register'], pinned['directory'], pinned['criteria'], '2026-11-14',
          )
          forged = confirm_declaration(result, pinned['directory'], {
              'item': 'declaration-confirm',
              'decision': 'confirm',
              'approver_ref': 'STF-1001',
              'declaration_id': result['declaration_id'],
              'declaration_hash': 'a' * 64,
              'pins_seen': True,
          })
          assert forged['human_approval'] is None
          assert forged['staged'] is False
          assert forged['blocked_reason'] == 'declaration_hash_mismatch'
          try:
              decide_conflict()
          except DeclarationForbidden:
              pass
          else:
              raise SystemExit('decide_conflict should raise')
          try:
              send()
          except DeclarationForbidden:
              pass
          else:
              raise SystemExit('send should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 20:
              print('ERROR: expected 20 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          paraphrase = report['paraphrase_recall']
          assert paraphrase['not_added_to_case_total'] is True
          for name, row in paraphrase['categories'].items():
              assert row['sentences'] >= 20, name
              if row['expect_match']:
                  assert row['recall'] == 1.0, name
              else:
                  assert row['false_inclusions'] == 0, name
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-70-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/70-conflict-of-interest-intake docs-site/docs/experiments/70-conflict-of-interest-intake.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 70
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/70-conflict-of-interest-intake")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/70-conflict-of-interest-intake/README.md
          echo "Licence check passed"
