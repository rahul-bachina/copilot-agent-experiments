name: Experiment 61 - Learning path planner tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/61-learning-path-planner/**'
      - 'experiments/36-cross-source-validation/**'
      - 'experiments/44-knowledge-gap-detector/**'
      - 'experiments/58-employee-handbook/**'
      - '.github/workflows/experiment-61-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/61-learning-path-planner/**'
      - 'experiments/36-cross-source-validation/**'
      - 'experiments/44-knowledge-gap-detector/**'
      - 'experiments/58-employee-handbook/**'
      - 'docs-site/docs/experiments/61-learning-path-planner.md'
      - '.github/workflows/experiment-61-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/61-learning-path-planner

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/61-learning-path-planner/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run plan smoke test
        run: |
          python src/plan.py --request examples/sample_request.json --catalogue fixtures/catalogue.json --framework fixtures/framework.json --directory fixtures/directory.json --as-of 2026-11-17 > /tmp/plan.json
          python -c "
          import json
          result = json.load(open('/tmp/plan.json'))
          blob = json.dumps(result)
          assert result['label'] == 'DRAFT LEARNING PLAN. NOT AN ENROLMENT.'
          assert result['catalogue_id'] == 'H004'
          assert result['autonomy'] == 'A1'
          assert result['human_approval'] is None
          assert result['outcome'] == 'proposed'
          assert result['enrolment_request_raised'] is False
          assert result['enrolled'] is False
          assert result['spent_gbp'] is None
          assert result['role_id'] == 'ROLE-ANALYST'
          assert result['clearance'] == 'OFFICIAL'
          assert result['flags']['section_63d_application_made'] is False
          assert result['flags']['levy_account_used'] is False
          assert result['flags']['instructions_followed'] is False
          assert result['experiment_58']['entitlement_decision'] is None
          assert [step['course_id'] for step in result['steps']] == ['CRS-101', 'CRS-102']
          assert 'learn@ashcombe.example.gov.uk' not in blob
          assert 'advanced statistics' not in blob.lower()
          print('Plan smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/plan.py --request examples/sample_request.json --catalogue fixtures/catalogue.json --framework fixtures/framework.json --directory fixtures/directory.json --as-of 2027-06-01 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          assert result['sources_current'] is False
          assert result['may_be_relied_on'] is False
          assert result['human_approval'] is None
          assert result['enrolment_request_raised'] is False
          assert result['spent_gbp'] is None
          assert result['coerced'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.plan import LearningPathForbidden, draft_plan, enrol, record_approval, spend
          catalogue = json.loads(Path('fixtures/catalogue.json').read_text())
          framework = json.loads(Path('fixtures/framework.json').read_text())
          directory = json.loads(Path('fixtures/directory.json').read_text())
          request = json.loads(Path('examples/sample_request.json').read_text())
          result = draft_plan(request, catalogue, framework, directory, '2026-11-17')
          forged = record_approval(result, {
              'plan_id': 'LP-forged000000',
              'approver_ref': 'EMP-2001',
              'decision': 'approve',
              'item': 'learning-plan',
          })
          assert forged['human_approval'] is None
          assert forged['enrolment_request_raised'] is False
          assert forged['blocked_reason'] == 'plan_id_mismatch'
          try:
              enrol()
          except LearningPathForbidden:
              pass
          else:
              raise SystemExit('enrol should raise')
          try:
              spend()
          except LearningPathForbidden:
              pass
          else:
              raise SystemExit('spend should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 18:
              print('ERROR: expected 18 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-61-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/61-learning-path-planner docs-site/docs/experiments/61-learning-path-planner.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 61
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/61-learning-path-planner")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/61-learning-path-planner/README.md
          echo "Licence check passed"
