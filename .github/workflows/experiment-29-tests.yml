name: Experiment 29 - Groundedness Evaluation Agent tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/29-groundedness-evaluation/**'
      - 'experiments/03-agent-inventory-atrs-assurance/src/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/29-groundedness-evaluation.md'
      - '.github/workflows/experiment-29-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/29-groundedness-evaluation/**'
      - 'experiments/03-agent-inventory-atrs-assurance/src/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/29-groundedness-evaluation.md'
      - '.github/workflows/experiment-29-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/29-groundedness-evaluation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/29-groundedness-evaluation/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run sample smoke test
        run: |
          python src/report.py --bundle examples/sample_bundle.json --as-of 2026-11-03 > /tmp/report.json
          python -c "
          import json
          draft = json.load(open('/tmp/report.json'))
          assert draft['label'] == 'DRAFT FOR EVALUATION OWNER'
          assert draft['catalogue_id'] == 'G007'
          assert draft['autonomy'] == 'A0'
          assert draft['threshold_approved_by_evaluation_owner'] is False
          assert draft['release_decision'] is None
          assert draft['pass_fail_released'] is False
          assert draft['groundedness_clearance'] is False
          assert draft['actions_taken'] == []
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['foundry_evaluator_called'] is False
          assert draft['a3_recommended'] is False
          assert draft['draft_bar_is_not_a_release'] is True
          assert draft['summary']['claim_count'] == 3
          assert draft['summary']['verdict_total'] == 3
          assert draft['summary']['verdicts']['supported'] == 3
          assert draft['summary']['stale_claim_count'] == 0
          assert sum(draft['summary']['verdicts'].values()) == draft['summary']['claim_count']
          assert draft['do_not_rely'] is False
          print('Sample smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/report.py --bundle examples/sample_bundle.json --as-of 2027-02-15 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['do_not_rely'] is True
          assert draft['pins_stale'] is True
          assert draft['passages_stale'] is False
          assert draft['threshold_approved_by_evaluation_owner'] is False
          assert draft['release_decision'] is None
          assert draft['pass_fail_released'] is False
          assert draft['a3_recommended'] is False
          assert draft['network_called'] is False
          assert draft['summary']['verdicts']['supported'] == 3
          assert draft['summary']['stale_claim_count'] == 0
          assert draft['summary']['verdict_total'] == 3
          opened = [row for row in draft['sources'] if row.get('stale_applicable')]
          assert opened and all(row['stale'] is True for row in opened)
          boundary = next(row for row in draft['sources'] if row['id'] == 'catalogue-boundary')
          assert boundary['stale'] is False
          assert boundary['reopened_for_this_experiment'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          set +e
          python src/report.py --bundle examples/sample_bundle.json --as-of 2026-11-03 --approve-thresholds > /tmp/approve.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/approve.json
          set +e
          python src/report.py --bundle examples/sample_bundle.json --as-of 2026-11-03 --release > /tmp/release.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/release.json
          set +e
          python src/report.py --bundle examples/sample_bundle.json --as-of 2026-11-03 --pass > /tmp/pass.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/pass.json
          set +e
          python src/report.py --bundle examples/sample_bundle.json --as-of 2026-11-03 --fail > /tmp/fail.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/fail.json
          echo "Prohibited-action smoke test passed"

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert report['not_a_foundry_score'] is True
          assert report['foundry_evaluator_called'] is False
          assert report['claims_added_to_total_cases'] is False
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          assert summary['passed'] + summary['failed'] == summary['total_cases']
          assert 'errors' not in summary
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['failed']:
              print(f\"ERROR: {summary['failed']} failed\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 cases')
              raise SystemExit(1)
          claim_sum = sum(row['claim_count'] or 0 for row in report['cases'])
          if claim_sum == summary['total_cases']:
              print('ERROR: claim counts and case counts were collapsed')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-29-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/29-groundedness-evaluation docs-site/docs/experiments/29-groundedness-evaluation.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No prices copied
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          roots = [
              Path("experiments/29-groundedness-evaluation"),
              Path("docs-site/docs/experiments/29-groundedness-evaluation.md"),
          ]
          price = re.compile(r"(£|€|\$\d|free of charge|\d+ Copilot Credits)", re.I)
          failed = False
          for root in roots:
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml"}:
                      continue
                  if price.search(path.read_text(errors="ignore")):
                      print(f"Price-like text in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Price check passed")
          PY

      - name: No obvious secrets in Experiment 29
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/29-groundedness-evaluation")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/29-groundedness-evaluation/README.md
          echo "Licence check passed"
