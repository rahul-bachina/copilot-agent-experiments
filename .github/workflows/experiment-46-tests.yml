name: Experiment 46 - Field visit preparation tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/46-field-visit-preparation/**'
      - 'experiments/05-awaabs-law-hazard-triage/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - '.github/workflows/experiment-46-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/46-field-visit-preparation/**'
      - 'experiments/05-awaabs-law-hazard-triage/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - 'docs-site/docs/experiments/46-field-visit-preparation.md'
      - '.github/workflows/experiment-46-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/46-field-visit-preparation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/46-field-visit-preparation/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run brief smoke test
        run: |
          python src/prepare.py --input examples/sample_work_order.json --as-of 2026-11-10 > /tmp/brief.json
          python -c "
          import json
          brief = json.load(open('/tmp/brief.json'))
          assert brief['label'] == 'DRAFT FIELD BRIEF FOR TECHNICIAN CONFIRMATION'
          assert brief['catalogue_id'] == 'C008'
          assert brief['autonomy'] == 'A0'
          assert brief['human_approval'] is None
          assert brief['actions_taken'] == []
          assert brief['executed'] is False
          assert brief['model_called'] is False
          assert brief['network_called'] is False
          assert brief['narrative_echoed'] is False
          assert brief['outcome'] == 'ready_for_confirmation'
          assert 'damp_mould' in brief['safety_highlights']
          assert brief['awaabs']['called'] is True
          assert brief['awaabs']['any_operative_deadline'] is False
          assert brief['human_route']['offered'] is True
          assert brief['human_route']['agent_dispatches'] is False
          assert brief['flags']['scheduled'] is False
          assert brief['flags']['dispatched'] is False
          assert brief['flags']['closed'] is False
          assert brief['flags']['entry_authorised'] is False
          assert brief['regulatory']['hswa_duty_met'] is False
          assert brief['regulatory']['risk_assessment_is_this_brief'] is False
          print('Brief smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/prepare.py --input examples/sample_work_order.json --as-of 2027-08-01 > /tmp/stale.json
          python -c "
          import json
          brief = json.load(open('/tmp/stale.json'))
          blob = json.dumps(brief)
          assert brief['stale']['rules_current'] is False
          assert brief['outcome'] == 'stale_sources'
          assert brief['human_approval'] is None
          assert brief['network_called'] is False
          assert all(row['taken'] is None for row in brief['sources'])
          assert 'damp_mould' in brief['safety_highlights']
          assert brief['flags']['dispatched'] is False
          assert 'so far as is reasonably practicable' not in blob
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from prepare import VisitForbidden, dispatch_technician, prepare_brief, record_review
          pack = json.loads(Path('examples/sample_work_order.json').read_text())
          brief = prepare_brief(pack, '2026-11-10')
          refused = record_review(brief, {
              'decision': 'dispatch_technician',
              'actor_role': 'Field technician',
              'actor_id': 'SYN-TECH-046',
              'asset_id': 'SYN-ASSET-0142',
              'safety_context_read': True,
          })
          assert refused['review']['refused'] is True
          assert refused['review']['reason'] == 'prohibited_decision'
          assert refused['flags']['dispatched'] is False
          assert refused['human_approval'] is None
          try:
              dispatch_technician()
          except VisitForbidden:
              pass
          else:
              raise SystemExit('dispatch_technician should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-46-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/46-field-visit-preparation docs-site/docs/experiments/46-field-visit-preparation.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 46
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/46-field-visit-preparation")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/46-field-visit-preparation/README.md
          echo "Licence check passed"
