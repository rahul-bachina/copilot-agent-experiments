name: Experiment 56 - Intranet content freshness tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/56-intranet-content-freshness/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/19-privacy-impact-assessment/**'
      - 'experiments/49-records-classification/**'
      - 'experiments/50-sharepoint-knowledge-curator/**'
      - 'experiments/55-onedrive-document-finder/**'
      - '.github/workflows/experiment-56-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/56-intranet-content-freshness/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/19-privacy-impact-assessment/**'
      - 'experiments/49-records-classification/**'
      - 'experiments/50-sharepoint-knowledge-curator/**'
      - 'experiments/55-onedrive-document-finder/**'
      - 'docs-site/docs/experiments/56-intranet-content-freshness.md'
      - '.github/workflows/experiment-56-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/56-intranet-content-freshness

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/56-intranet-content-freshness/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run freshness smoke test
        run: |
          python src/freshness.py --input examples/sample_inventory.json --selection examples/sample_selection.json --as-of 2026-11-16 > /tmp/freshness.json
          python -c "
          import json
          result = json.load(open('/tmp/freshness.json'))
          blob = json.dumps(result)
          assert result['label'] == 'INTRANET FRESHNESS REPORT FOR THE CONTENT OWNER'
          assert result['catalogue_id'] == 'M008'
          assert result['autonomy'] == 'A1'
          assert result['human_approval'] is None
          assert result['outcome'] == 'report'
          assert result['executed'] is False
          assert result['model_called'] is False
          assert result['network_called'] is False
          assert result['flags']['pages_edited'] is False
          assert result['flags']['published'] is False
          assert result['flags']['unpublished'] is False
          assert result['flags']['deleted'] is False
          assert result['flags']['ownership_reassigned'] is False
          assert result['flags']['messages_sent'] is False
          assert result['flags']['approval_request_sent'] is False
          assert result['flags']['planner_called'] is False
          assert result['flags']['power_automate_called'] is False
          assert result['flags']['graph_called'] is False
          assert result['flags']['sharepoint_called'] is False
          assert result['regulatory']['accuracy_met'] is False
          assert result['regulatory']['accessibility_scope_decided'] is False
          assert result['copying']['output_is_anonymised'] is False
          assert result['copying']['page_bodies_copied'] is False
          assert 'CANARY-SECRET-PAGE' not in blob
          assert 'CANARY-COMMENT-SECRET' not in blob
          assert 'CANARY-HIDDEN-PAGE' not in blob
          assert 'CANARY-SECRET-FILE' not in blob
          assert 'ada.north@merrowfield.example.gov.uk' not in blob
          assert 'QQ 12 34 56 C' not in blob
          print('Freshness smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/freshness.py --input examples/sample_inventory.json --selection examples/sample_selection.json --as-of 2027-08-01 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          blob = json.dumps(result)
          assert result['stale']['rules_current'] is False
          assert result['human_approval'] is None
          assert result['network_called'] is False
          assert all(row['taken'] is None for row in result['sources'])
          assert result['flags']['pages_edited'] is False
          assert 'perceivable, operable, understandable and robust' not in blob
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from freshness import FreshnessForbidden, message_staff, record_approval, review_inventory
          inventory = json.loads(Path('examples/sample_inventory.json').read_text())
          selection = json.loads(Path('examples/sample_selection.json').read_text())
          result = review_inventory(inventory, '2026-11-16', selection)
          refused = record_approval(result, {
              'decision': 'message_staff',
              'actor_role': 'Content owner',
              'actor_id': result['content_owner_id'],
              'inventory_id': result['inventory_id'],
              'queue_reviewed': True,
          })
          assert refused['approval']['reason'] == 'prohibited_decision'
          assert refused['flags']['messages_sent'] is False
          assert refused['human_approval'] is None
          try:
              message_staff()
          except FreshnessForbidden:
              pass
          else:
              raise SystemExit('message_staff should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-56-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/56-intranet-content-freshness docs-site/docs/experiments/56-intranet-content-freshness.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 56
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/56-intranet-content-freshness")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/56-intranet-content-freshness/README.md
          echo "Licence check passed"
