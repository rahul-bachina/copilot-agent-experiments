name: Experiment 80 - Translation quality review assistant tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/80-translation-quality-review/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/79-document-comparison/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-80-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/80-translation-quality-review/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/79-document-comparison/**'
      - 'docs-site/docs/experiments/80-translation-quality-review.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-80-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/80-translation-quality-review

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/80-translation-quality-review/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run review smoke test
        run: |
          python src/review.py --request examples/sample_request.json --as-of 2026-11-26 > /tmp/review.json
          python -c "
          import json
          result = json.load(open('/tmp/review.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('DRAFT TRANSLATION REVIEW FOR THE NAMED BILINGUAL REVIEWER')
          assert result['catalogue_id'] == 'O006'
          assert result['autonomy'] == 'A0'
          assert result['human_approval'] is None
          assert result['translation_owned'] is False
          assert result['published'] is False
          assert result['sent'] is False
          assert result['overwritten'] is False
          assert result['instructions_followed'] is False
          assert result['experiment_38_compare_called'] is False
          assert result['no_issues'] is False
          assert result['checks_performed']
          assert 'no issues' not in result['statement'].casefold()
          assert result['marking']['applied'] == 'SECRET'
          assert result['legal_hold'] is True
          assert '07700900123' not in blob
          assert 'desk@reedmarsh.example' not in blob
          print('Review smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/review.py --request examples/sample_request.json --as-of 2026-11-26 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          assert result['sources_current'] is False
          assert result['may_be_relied_on'] is False
          assert result['human_approval'] is None
          assert result['translation_owned'] is False
          assert result['coerced'] is False
          assert result['as_of'] == '2026-11-26'
          assert any(row.get('stale') for row in result['dates'])
          assert 'dates_seen' in result['required_acknowledgements']
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.review import (
              ReviewForbidden,
              approve_translation,
              overwrite_document,
              pinned_directory,
              prepare_review,
              publish_translation,
              send_translation,
              record_translation_owned,
          )
          request = json.loads(Path('examples/sample_request.json').read_text())
          result = prepare_review(request, as_of='2026-11-26')
          forged = record_translation_owned(result, pinned_directory(), {
              'item': 'translation-owned',
              'decision': 'own',
              'approver_ref': 'REV-8001',
              'review_id': result['review_id'],
              'content_hash': 'a' * 64,
              'source_document_hash': 'b' * 64,
              'target_document_hash': 'c' * 64,
              'translation_owned_by_reviewer': True,
              'pins_seen': True,
              'segments_seen': True,
          })
          assert forged['human_approval'] is None
          assert forged['translation_owned'] is False
          assert forged['blocked_reason'] in {'caller_rehash_rejected', 'content_tampered', 'document_hash_mismatch', 'route_not_seen'}
          for fn in (publish_translation, send_translation, overwrite_document, approve_translation):
              try:
                  fn()
              except ReviewForbidden:
                  pass
              else:
                  raise SystemExit(fn.__name__ + ' should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 20:
              print('ERROR: expected 20 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          seeded = report['seeded_errors']
          assert seeded['not_added_to_case_total'] is True
          for name, row in seeded['categories'].items():
              assert row['positives'] >= 20, name
              assert row['negatives'] >= 20, name
              assert row['recall'] == 1.0, name
              assert row['precision'] == 1.0, name
          paraphrase = report['paraphrase_recall']
          assert paraphrase['not_added_to_case_total'] is True
          for name, row in paraphrase['risk'].items():
              assert row['sentences'] >= 20, name
              assert row['recall'] == 1.0, name
              assert row['false_inclusions'] == 0, name
          for name, row in paraphrase['sensitive'].items():
              assert row['sentences'] >= 20, name
              assert row['recall'] == 1.0, name
              assert row['denied_recall'] == 1.0, name
          alignment = report['alignment_score']
          assert alignment['not_added_to_case_total'] is True
          assert alignment['recall'] == 1.0
          assert alignment['precision'] == 1.0
          assert alignment['positives'] >= 20
          assert alignment['negatives'] >= 20
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-80-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/80-translation-quality-review docs-site/docs/experiments/80-translation-quality-review.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 80
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/80-translation-quality-review")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/80-translation-quality-review/README.md
          echo "Licence check passed"
