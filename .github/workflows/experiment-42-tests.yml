name: Experiment 42 - Case routing assistant tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/42-case-routing-assistant/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/05-awaabs-law-hazard-triage/**'
      - '.github/workflows/experiment-42-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/42-case-routing-assistant/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/05-awaabs-law-hazard-triage/**'
      - 'docs-site/docs/experiments/42-case-routing-assistant.md'
      - '.github/workflows/experiment-42-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/42-case-routing-assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/42-case-routing-assistant/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run routing smoke test
        run: |
          python src/routing.py --input examples/sample_case.json --as-of 2026-11-09 > /tmp/route.json
          python -c "
          import json
          draft = json.load(open('/tmp/route.json'))
          assert draft['label'] == 'DRAFT FOR QUEUE REVIEW'
          assert draft['catalogue_id'] == 'C003'
          assert draft['autonomy'] == 'A1'
          assert draft['human_approval'] is None
          assert draft['actions_taken'] == []
          assert draft['executed'] is False
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['case_text_echoed'] is False
          assert draft['outcome'] == 'proposed_route'
          assert draft['proposed_queue'] == 'q-waste'
          assert draft['confidence']['band'] == 'high'
          assert draft['confidence']['overrides_human_route'] is False
          assert draft['flags']['rerouted'] is False
          assert draft['flags']['closed'] is False
          assert draft['flags']['escalated'] is False
          assert draft['flags']['rules_changed'] is False
          assert draft['human_route']['offered'] is True
          assert draft['pii_gateway']['output_is_anonymised'] is False
          print('Routing smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/routing.py --input examples/sample_case.json --as-of 2027-05-01 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['outcome'] == 'stale_rule'
          assert draft['proposed_queue'] is None
          assert 'rule-waste' in draft['rules']['stale_ids']
          assert draft['human_approval'] is None
          assert draft['network_called'] is False
          assert draft['flags']['rerouted'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from routing import RoutingForbidden, propose_route, record_review, reroute_case
          case = json.loads(Path('examples/sample_case.json').read_text())
          case['text'] = 'I want to kill myself.'
          draft = propose_route(case, '2026-11-09')
          assert draft['outcome'] == 'human_vulnerability'
          refused = record_review(draft, {
              'decision': 'close',
              'actor': 'adviser',
              'actor_id': 'SYN-ADVISER-001',
          })
          assert refused['review']['refused'] is True
          assert refused['review']['reason'] == 'prohibited_decision'
          assert refused['flags']['closed'] is False
          assert refused['human_approval'] is None
          try:
              reroute_case()
          except RoutingForbidden:
              pass
          else:
              raise SystemExit('reroute_case should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-42-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/42-case-routing-assistant docs-site/docs/experiments/42-case-routing-assistant.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 42
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/42-case-routing-assistant")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/42-case-routing-assistant/README.md
          echo "Licence check passed"
