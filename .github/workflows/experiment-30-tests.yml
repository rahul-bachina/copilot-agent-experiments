name: Experiment 30 - Agent Regression Test Generator tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/30-agent-regression-test-generator/**'
      - 'experiments/03-agent-inventory-atrs-assurance/src/**'
      - 'experiments/25-instruction-quality-reviewer/src/manifest_yaml.py'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/30-agent-regression-test-generator.md'
      - '.github/workflows/experiment-30-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/30-agent-regression-test-generator/**'
      - 'experiments/03-agent-inventory-atrs-assurance/src/**'
      - 'experiments/25-instruction-quality-reviewer/src/manifest_yaml.py'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/30-agent-regression-test-generator.md'
      - '.github/workflows/experiment-30-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/30-agent-regression-test-generator

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/30-agent-regression-test-generator/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run draft smoke test
        run: |
          python src/generate.py --bundle examples/sample_bundle.json --as-of 2026-11-03 > /tmp/report.json
          python -c "
          import json
          draft = json.load(open('/tmp/report.json'))
          assert draft['label'] == 'DRAFT FOR MAINTAINER REVIEW'
          assert draft['catalogue_id'] == 'G008'
          assert draft['autonomy'] == 'A1'
          assert draft['maintainer_approved'] is False
          assert draft['merged'] is False
          assert draft['pushed'] is False
          assert draft['protected_branch_targeted'] is False
          assert draft['agent_under_test_edited'] is False
          assert draft['pr_opened'] is False
          assert draft['tests_applied'] is False
          assert draft['foundry_evaluation_called'] is False
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['a3_recommended'] is False
          assert draft['actions_taken'] == []
          summary = draft['summary']
          assert summary['drafted'] + summary['skipped_duplicate'] == summary['considered']
          assert summary['drafted'] == 16
          assert summary['skipped_duplicate'] == 1
          assert summary['considered'] == 17
          assert summary['observations_not_drafted'] == 1
          assert draft['foundry_option']['query_count'] == summary['drafted']
          assert draft['foundry_option']['called'] is False
          assert draft['do_not_rely'] is False
          print('Draft smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/generate.py --bundle examples/sample_bundle.json --as-of 2027-05-03 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['do_not_rely'] is True
          assert draft['maintainer_approved'] is False
          assert draft['merged'] is False
          assert draft['pushed'] is False
          assert draft['a3_recommended'] is False
          assert draft['network_called'] is False
          assert draft['summary']['drafted'] == 16
          opened = [row for row in draft['sources'] if row.get('stale_applicable')]
          assert opened and all(row['stale'] is True for row in opened)
          boundary = next(row for row in draft['sources'] if row['id'] == 'catalogue-boundary')
          assert boundary['stale'] is False
          assert boundary['reopened_for_this_experiment'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          set +e
          python src/generate.py --bundle examples/sample_bundle.json --as-of 2026-11-03 --merge > /tmp/merge.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/merge.json
          set +e
          python src/generate.py --bundle examples/sample_bundle.json --as-of 2026-11-03 --push > /tmp/push.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/push.json
          set +e
          python src/generate.py --bundle examples/sample_bundle.json --as-of 2026-11-03 --approve > /tmp/approve.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/approve.json
          set +e
          python src/generate.py --bundle examples/sample_bundle.json --as-of 2026-11-03 --open-pr > /tmp/pr.json
          code=$?
          set -e
          test "$code" -eq 2
          test ! -s /tmp/pr.json
          echo "Prohibited-action smoke test passed"

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert report['not_a_foundry_evaluation'] is True
          assert report['foundry_evaluation_called'] is False
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          assert summary['passed'] + summary['failed'] + summary['errored'] == summary['total_cases']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errored'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errored']} errored\")
              raise SystemExit(1)
          if summary['total_cases'] < 12:
              print('ERROR: fewer than 12 cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-30-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/30-agent-regression-test-generator docs-site/docs/experiments/30-agent-regression-test-generator.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No prices copied
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          roots = [
              Path("experiments/30-agent-regression-test-generator"),
              Path("docs-site/docs/experiments/30-agent-regression-test-generator.md"),
          ]
          price = re.compile(r"(£|€|\$\d|free of charge|\d+ Copilot Credits)", re.I)
          failed = False
          for root in roots:
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml"}:
                      continue
                  if price.search(path.read_text(errors="ignore")):
                      print(f"Price-like text in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Price check passed")
          PY

      - name: No obvious secrets in Experiment 30
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/30-agent-regression-test-generator")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/30-agent-regression-test-generator/README.md
          echo "Licence check passed"
