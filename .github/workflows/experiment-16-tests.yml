name: Experiment 16 - KYC evidence intake tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/16-kyc-evidence-intake/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - '.github/workflows/experiment-16-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/16-kyc-evidence-intake/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - '.github/workflows/experiment-16-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/16-kyc-evidence-intake

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/16-kyc-evidence-intake/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run review smoke test
        run: |
          python src/review.py --input examples/sample_customer_file.json --as-of 2026-10-27 > /tmp/review.json
          python -c "
          import json
          draft = json.load(open('/tmp/review.json'))
          assert draft['label'] == 'DRAFT FOR KYC REVIEW'
          assert draft['catalogue_id'] == 'B004'
          assert draft['documents_confirmed'] is False
          assert draft['purpose_confirmed'] is False
          assert draft['final_risk_rating'] is None
          assert draft['customer_decision'] is None
          assert draft['actions_taken'] == []
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['fatf_list_downloaded'] is False
          assert draft['jmlsg_part_i_opened'] is False
          assert draft['sources_pinned_on'] == '2026-10-27'
          assert draft['sources_stale'] is False
          assert draft['prompt_injection']['detected'] is True
          assert draft['prompt_injection']['followed'] is False
          assert draft['checklist']['sufficient'] is False
          assert draft['checklist']['edd_applied'] is False
          assert draft['checklist']['risk_rating'] is None
          note = draft['customer_facing']['text'].lower()
          assert draft['customer_facing']['may_be_sent_by_agent'] is False
          assert draft['customer_facing']['hints_at_suspicion'] is False
          for word in ('suspect', 'sar', 'pep', 'money laundering', 'nca'):
              assert word not in note
          assert draft['flags']['customer_approved'] is False
          assert draft['flags']['customer_onboarded'] is False
          assert draft['flags']['sar_filed'] is False
          assert draft['flags']['external_sent'] is False
          assert draft['document_intake']['files_confirmed'] is False
          assert draft['document_intake']['gateway']['output_is_anonymised'] is False
          print('Review smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/review.py --input examples/sample_customer_file.json --as-of 2027-04-01 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['sources_stale'] is True
          assert draft['any_document_stale'] is True
          assert draft['rules_current'] is False
          assert draft['documents_confirmed'] is False
          assert draft['purpose_confirmed'] is False
          assert draft['final_risk_rating'] is None
          assert draft['network_called'] is False
          assert draft['customer_facing']['hints_at_suspicion'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 24:
              print('ERROR: fewer than 24 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-16-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/16-kyc-evidence-intake; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 16
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/16-kyc-evidence-intake")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/16-kyc-evidence-intake/README.md
          echo "Licence check passed"
