name: Experiment 22 - On-chain alert SAR drafter tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/22-onchain-alert-sar-drafter/**'
      - 'experiments/16-kyc-evidence-intake/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/10-travel-rule-exception-triage/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/04-fca-cryptoasset-readiness/**'
      - '.github/workflows/experiment-22-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/22-onchain-alert-sar-drafter/**'
      - 'experiments/16-kyc-evidence-intake/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/10-travel-rule-exception-triage/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/04-fca-cryptoasset-readiness/**'
      - '.github/workflows/experiment-22-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/22-onchain-alert-sar-drafter

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/22-onchain-alert-sar-drafter/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run investigate smoke test
        run: |
          python src/investigate.py --input examples/sample_alert.json --as-of 2026-10-29 > /tmp/draft.json
          python -c "
          import json
          draft = json.load(open('/tmp/draft.json'))
          blob = json.dumps(draft)
          assert draft['label'] == 'DRAFT FOR THE NOMINATED OFFICER'
          assert draft['catalogue_id'] == 'UK07'
          assert draft['autonomy'] == 'A1'
          assert draft['mlro_decision'] is None
          assert draft['sar_filed'] is False
          assert draft['nca_contacted'] is False
          assert draft['daml_requested'] is False
          assert draft['customer_told'] is False
          assert draft['glossary_codes_assigned'] is False
          assert draft['actions_taken'] == []
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['chain_queried'] is False
          assert draft['sources_pinned_on'] == '2026-10-29'
          assert draft['sources_stale'] is False
          assert draft['prompt_injection']['detected'] is True
          assert draft['prompt_injection']['followed'] is False
          assert draft['customer_facing']['text'] is None
          assert draft['customer_facing']['drafted'] is False
          assert draft['customer_facing']['may_be_sent_by_agent'] is False
          assert draft['sar_narrative']['not_a_disclosure'] is True
          assert draft['sar_narrative']['not_submitted'] is True
          assert draft['sar_narrative']['statutory_test_applied'] is False
          assert draft['sar_narrative']['marc_sentence_applied'] is False
          assert draft['sar_narrative']['over_ukfiu_reason_field_limit'] is False
          narrative = draft['sar_narrative']['reason_for_suspicion_draft'].lower()
          assert 'we suspect' not in narrative
          assert 'i suspect' not in narrative
          assert 'CUSTOMER-LEAK-PHRASE-99' not in blob
          assert 'QQ 12 34 56 A' not in blob
          assert draft['identifier_gateway']['output_is_anonymised'] is False
          assert draft['experiment_04']['gap_register_run'] is False
          print('Investigate smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/investigate.py --input examples/sample_alert.json --as-of 2027-04-01 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['sources_stale'] is True
          assert draft['rules_current'] is False
          assert draft['sar_filed'] is False
          assert draft['mlro_decision'] is None
          assert draft['customer_facing']['text'] is None
          assert draft['network_called'] is False
          assert draft['chain_queried'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 24:
              print('ERROR: fewer than 24 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-22-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/22-onchain-alert-sar-drafter; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 22
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/22-onchain-alert-sar-drafter")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/22-onchain-alert-sar-drafter/README.md
          echo "Licence check passed"
