name: Experiment 55 - OneDrive document finder tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/55-onedrive-document-finder/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/19-privacy-impact-assessment/**'
      - 'experiments/49-records-classification/**'
      - 'experiments/50-sharepoint-knowledge-curator/**'
      - '.github/workflows/experiment-55-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/55-onedrive-document-finder/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/19-privacy-impact-assessment/**'
      - 'experiments/49-records-classification/**'
      - 'experiments/50-sharepoint-knowledge-curator/**'
      - 'docs-site/docs/experiments/55-onedrive-document-finder.md'
      - '.github/workflows/experiment-55-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/55-onedrive-document-finder

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/55-onedrive-document-finder/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run find smoke test
        run: |
          python src/find.py --index examples/sample_index.json --request examples/sample_request.json --selection examples/sample_selection.json --as-of 2026-11-13 > /tmp/find.json
          python -c "
          import json
          result = json.load(open('/tmp/find.json'))
          blob = json.dumps(result)
          assert result['label'] == 'READ-ONLY ONEDRIVE FINDING FOR THE REQUESTING USER'
          assert result['catalogue_id'] == 'M007'
          assert result['autonomy'] == 'A0'
          assert result['human_approval'] is None
          assert result['outcome'] == 'matches'
          assert result['executed'] is False
          assert result['model_called'] is False
          assert result['network_called'] is False
          assert result['flags']['moved'] is False
          assert result['flags']['deleted'] is False
          assert result['flags']['shared'] is False
          assert result['flags']['permissions_changed'] is False
          assert result['flags']['graph_called'] is False
          assert result['flags']['access_widened'] is False
          assert result['regulatory']['data_minimisation_met'] is False
          assert result['regulatory']['foi_duty_decided'] is False
          assert result['withheld']['outside_selection'] >= 1
          assert result['withheld']['not_permitted'] >= 1
          assert result['withheld']['above_clearance'] >= 1
          assert 'CANARY-SECRET-BRIEF' not in blob
          assert 'CANARY-OUTSIDE-FINANCE' not in blob
          assert 'CANARY-HIDDEN-PAYROLL' not in blob
          assert 'QQ 12 34 56 C' not in blob
          print('Find smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/find.py --index examples/sample_index.json --request examples/sample_request.json --selection examples/sample_selection.json --as-of 2027-08-01 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          blob = json.dumps(result)
          assert result['stale']['rules_current'] is False
          assert result['human_approval'] is None
          assert result['network_called'] is False
          assert all(row['taken'] is None for row in result['sources'])
          assert result['flags']['deleted'] is False
          assert 'adequate, relevant and limited to what is necessary' not in blob
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from find import FinderForbidden, acknowledge_results, delete_file, find_documents
          index = json.loads(Path('examples/sample_index.json').read_text())
          request = json.loads(Path('examples/sample_request.json').read_text())
          selection = json.loads(Path('examples/sample_selection.json').read_text())
          result = find_documents(index, request, selection, '2026-11-13')
          refused = acknowledge_results(result, {
              'decision': 'delete_file',
              'actor_role': 'Requesting user',
              'index_id': result['index_id'],
              'queue_reviewed': True,
          })
          assert refused['acknowledgement']['reason'] == 'prohibited_decision'
          assert refused['flags']['deleted'] is False
          assert refused['human_approval'] is None
          try:
              delete_file()
          except FinderForbidden:
              pass
          else:
              raise SystemExit('delete_file should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-55-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/55-onedrive-document-finder docs-site/docs/experiments/55-onedrive-document-finder.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 55
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/55-onedrive-document-finder")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/55-onedrive-document-finder/README.md
          echo "Licence check passed"
