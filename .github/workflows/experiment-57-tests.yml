name: Experiment 57 - Collaboration space onboarding tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/57-collaboration-space-onboarding/**'
      - 'experiments/03-agent-inventory-atrs-assurance/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/19-privacy-impact-assessment/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'experiments/41-case-summary/**'
      - 'experiments/49-records-classification/**'
      - 'experiments/50-sharepoint-knowledge-curator/**'
      - 'experiments/51-teams-channel-digest/**'
      - 'experiments/55-onedrive-document-finder/**'
      - '.github/workflows/experiment-57-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/57-collaboration-space-onboarding/**'
      - 'experiments/03-agent-inventory-atrs-assurance/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/19-privacy-impact-assessment/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'experiments/41-case-summary/**'
      - 'experiments/49-records-classification/**'
      - 'experiments/50-sharepoint-knowledge-curator/**'
      - 'experiments/51-teams-channel-digest/**'
      - 'experiments/55-onedrive-document-finder/**'
      - 'docs-site/docs/experiments/57-collaboration-space-onboarding.md'
      - '.github/workflows/experiment-57-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/57-collaboration-space-onboarding

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/57-collaboration-space-onboarding/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run onboarding smoke test
        run: |
          python src/onboard.py --space examples/sample_space.json --request examples/sample_request.json --as-of 2026-11-16 > /tmp/onboard.json
          python -c "
          import json
          result = json.load(open('/tmp/onboard.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('DRAFT COLLABORATION SPACE ONBOARDING')
          assert result['catalogue_id'] == 'M010'
          assert result['autonomy'] == 'A1'
          assert result['human_approval'] is None
          assert result['applied'] is False
          assert result['outcome'] == 'proposal_ready'
          assert result['executed'] is False
          assert result['model_called'] is False
          assert result['network_called'] is False
          assert result['live_graph_called'] is False
          assert result['external_share_applied'] is False
          assert result['data_minimisation_met'] is False
          assert result['integrity_and_confidentiality_met'] is False
          assert result['regulatory']['article_6_opened'] is False
          assert result['regulatory']['ncsc_least_privilege_words_on_the_page_opened'] is False
          assert result['regulatory']['live_graph_called'] is False
          assert 'canary-external-link' not in blob
          print('Onboarding smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import sys
          sys.path.insert(0, 'src')
          from graph_sim import OnboardingForbidden, call_live_graph, share_file_external, share_link_external
          from onboard import draft_manifest
          for call in (share_file_external, share_link_external, call_live_graph):
              try:
                  call()
              except OnboardingForbidden:
                  pass
              else:
                  raise SystemExit(call.__name__ + ' should raise')
          try:
              draft_manifest({}, '2026-11-16', approve=True)
          except OnboardingForbidden:
              pass
          else:
              raise SystemExit('draft_manifest approve=True should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-57-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/57-collaboration-space-onboarding docs-site/docs/experiments/57-collaboration-space-onboarding.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 57
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/57-collaboration-space-onboarding")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/57-collaboration-space-onboarding/README.md
          echo "Licence check passed"
