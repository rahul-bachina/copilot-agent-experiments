name: Experiment 05 - Awaab's Law hazard triage tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/05-awaabs-law-hazard-triage/**'
      - '.github/workflows/experiment-05-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/05-awaabs-law-hazard-triage/**'
      - '.github/workflows/experiment-05-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/05-awaabs-law-hazard-triage

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/05-awaabs-law-hazard-triage/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run statutory clock smoke test
        run: |
          python src/statutory_clock.py \
            --aware-at 2026-01-08T09:00:00+00:00 \
            --category significant \
            --hazard-family damp_mould_fungal_growth \
            --social-home-in-england \
            --approve-category \
            --approve-clock > /tmp/clock.json
          python -c "
          import json
          clock = json.load(open('/tmp/clock.json'))
          by_id = {item['id']: item for item in clock['deadlines']}
          assert clock['operative'] is True
          assert clock['in_force'] is True
          assert clock['phase_id'] == 'phase_1'
          assert by_id['standard_investigation']['on'] == '2026-01-22'
          assert by_id['standard_investigation']['operative'] is True
          phases = {phase['id']: phase for phase in clock['phases_not_in_force']}
          assert phases['phase_2']['in_force'] is False
          assert phases['phase_3']['in_force'] is False
          assert clock['reasonable_endeavours']['defence_made_out'] is False
          print('Clock smoke test passed')
          "

      - name: Run triage smoke test
        run: |
          python src/triage.py \
            --aware-at 2026-10-24T09:30:00+00:00 \
            --input examples/sample_report.txt > /tmp/triage.json
          python -c "
          import json
          triage = json.load(open('/tmp/triage.json'))
          assert triage['processing_mode'] == 'mock'
          assert triage['evaluation_label'].startswith('MOCK SMOKE TEST')
          assert triage['tenant_summary']['may_be_sent_by_agent'] is False
          assert triage['vulnerability_flags']['tenant_labelled_vulnerable'] is False
          assert triage['reasonable_endeavours']['defence_made_out'] is False
          assert triage['housing_ombudsman']['referral_made_by_agent'] is False
          assert triage['statutory_clock']['operative'] is False
          assert triage['security']['actions_taken'] == []
          print('Triage smoke test passed')
          "

      - name: Run evaluation (mock smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'mock'
          assert report['not_a_model_evaluation'] is True
          assert 'MOCK SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 20:
              print('ERROR: fewer than 20 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-05-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/05-awaabs-law-hazard-triage; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 05
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/05-awaabs-law-hazard-triage")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/05-awaabs-law-hazard-triage/README.md
          echo "Licence check passed"
