name: Experiment 49 - Records classification tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/49-records-classification/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/19-privacy-impact-assessment/**'
      - '.github/workflows/experiment-49-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/49-records-classification/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/19-privacy-impact-assessment/**'
      - 'docs-site/docs/experiments/49-records-classification.md'
      - '.github/workflows/experiment-49-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/49-records-classification

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/49-records-classification/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run classification smoke test
        run: |
          python src/classify.py --input examples/sample_document.json --as-of 2026-11-11 > /tmp/classification.json
          python -c "
          import json
          draft = json.load(open('/tmp/classification.json'))
          assert draft['label'] == 'DRAFT RECORDS CLASSIFICATION FOR RECORDS MANAGER CONFIRMATION'
          assert draft['catalogue_id'] == 'M009'
          assert draft['autonomy'] == 'A1'
          assert draft['human_approval'] is None
          assert draft['actions_taken'] == []
          assert draft['executed'] is False
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['text_recorded'] is False
          assert draft['outcome'] == 'ready_for_confirmation'
          assert draft['proposals']['file_plan']['category_id'] == 'GOV-CMT'
          assert draft['proposals']['retention']['statutory_period'] is False
          assert draft['flags']['deleted'] is False
          assert draft['flags']['disposed'] is False
          assert draft['flags']['moved'] is False
          assert draft['flags']['downgraded'] is False
          assert draft['flags']['labels_applied_in_tenant'] is False
          assert draft['purview']['called'] is False
          assert draft['reuse']['screening']['dpia_required'] is None
          assert draft['human_route']['offered'] is True
          assert draft['human_route']['agent_disposes'] is False
          assert draft['regulatory']['code_complied'] is False
          assert draft['regulatory']['storage_limitation_met'] is False
          assert 'CANARY-OAK-COMMITTEE-49' not in json.dumps(draft)
          print('Classification smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/classify.py --input examples/sample_document.json --as-of 2027-08-01 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          blob = json.dumps(draft)
          assert draft['stale']['rules_current'] is False
          assert draft['outcome'] == 'stale_sources'
          assert draft['human_approval'] is None
          assert draft['network_called'] is False
          assert all(row['taken'] is None for row in draft['sources'])
          assert draft['proposals']['file_plan']['category_id'] == 'GOV-CMT'
          assert draft['flags']['disposed'] is False
          assert 'not later than 20 years' not in blob
          assert 'in accordance with Article 84B' not in blob
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from classify import RecordsForbidden, classify_record, delete_record, record_confirmation
          document = json.loads(Path('examples/sample_document.json').read_text())
          draft = classify_record(document, '2026-11-11')
          refused = record_confirmation(draft, {
              'decision': 'dispose',
              'actor_role': 'Records manager',
              'actor_id': 'SYN-RM-049',
              'document_id': 'SYN-REC-0491',
              'every_field_confirmed': True,
              'file_plan_category': 'GOV-CMT',
              'retention_entry': 'GOV-CMT-R',
              'disposal_action': 'transfer_for_review_of_permanent_value',
              'gsc_marking': 'OFFICIAL',
              'personal_data_indicated': False,
          })
          assert refused['review']['refused'] is True
          assert refused['review']['reason'] == 'prohibited_decision'
          assert refused['flags']['disposed'] is False
          assert refused['human_approval'] is None
          try:
              delete_record()
          except RecordsForbidden:
              pass
          else:
              raise SystemExit('delete_record should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-49-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/49-records-classification docs-site/docs/experiments/49-records-classification.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 49
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/49-records-classification")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/49-records-classification/README.md
          echo "Licence check passed"
