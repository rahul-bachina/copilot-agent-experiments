name: Experiment 39 - Credit memo drafting tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/39-credit-memo-drafting/**'
      - 'experiments/36-cross-source-validation/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/39-credit-memo-drafting.md'
      - '.github/workflows/experiment-39-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/39-credit-memo-drafting/**'
      - 'experiments/36-cross-source-validation/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/39-credit-memo-drafting.md'
      - '.github/workflows/experiment-39-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/39-credit-memo-drafting

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/39-credit-memo-drafting/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run sandbox smoke test
        run: |
          python src/draft.py --pack examples/sample_pack.json --as-of 2026-11-06 > /tmp/memo.json
          python -c "
          import json
          draft = json.load(open('/tmp/memo.json'))
          assert draft['label'].startswith('DRAFT FOR THE CREDIT OFFICER')
          assert draft['catalogue_id'] == 'B009'
          assert draft['autonomy'] == 'A1'
          assert draft['summary']['stated_fact_count'] == 9
          assert draft['summary']['verdict_total'] == 9
          assert draft['summary']['gap_count'] == 1
          assert draft['summary']['contradiction_count'] == 2
          assert draft['summary']['failure_count'] == 0
          assert draft['summary']['not_used_count'] == 1
          assert 'grand_total' not in draft['summary']
          assert draft['checker_passed'] is True
          assert draft['do_not_rely'] is True
          assert draft['credit_decision'] is None
          assert draft['recommendation'] is None
          assert draft['limit_set'] is None
          assert draft['sar_filed'] is False
          assert draft['customer_contacted'] is False
          assert draft['bureau_contacted'] is False
          assert draft['core_banking_posted'] is False
          assert draft['crm_posted'] is False
          assert draft['draft_approved_for_use'] is False
          assert draft['summary_accepted_as_decision'] is False
          assert draft['solely_automated_decision'] is False
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['foundry_called'] is False
          assert draft['fabric_called'] is False
          assert draft['lakehouse_written'] is False
          assert draft['a3_recommended'] is False
          assert draft['actions_taken'] == []
          assert draft['intake']['called'] is True
          assert draft['intake']['experiment_id'] == 'exp-12-document-intake'
          assert draft['experiment_16_imported'] is False
          assert draft['experiment_37_imported'] is False
          assert draft['cross_source']['called'] is True
          assert draft['cross_source']['counts']['fact_count'] == 2
          assert draft['cross_source']['counts']['fact_count'] != draft['summary']['stated_fact_count']
          assert draft['cross_source']['agent_chose_source'] is False
          assert draft['cross_source']['register_queried'] is False
          assert draft['sections']['covenants']['status'] == 'not_stated'
          assert draft['gaps'][0]['value'] == 'not stated'
          assert draft['gaps'][0]['inferred'] is False
          blob = json.dumps(draft['facts'])
          assert '4200000' in blob
          assert '999999' not in blob
          print('Sandbox smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/draft.py --pack examples/sample_pack.json --as-of 2027-02-10 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['do_not_rely'] is True
          assert 'source_pin_stale' in draft['do_not_rely_reasons']
          assert draft['credit_decision'] is None
          assert draft['limit_set'] is None
          assert draft['sar_filed'] is False
          assert draft['customer_contacted'] is False
          assert draft['a3_recommended'] is False
          assert draft['network_called'] is False
          opened = [row for row in draft['sources'] if row['id'] == 'uk-gdpr-article-22a']
          assert opened and opened[0]['stale'] is True
          boundary = next(item for item in draft['sources'] if item['id'] == 'catalogue-boundary')
          assert boundary['stale'] is False
          missing = next(item for item in draft['sources'] if item['id'] == 'prin-2a-2-not-retrieved')
          assert missing['opened'] is False
          assert missing['quote'] is None
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          for flag in --approve --decline --set-limit --contact-customer --contact-bureau --post-core --post-crm --file-sar; do
            set +e
            python src/draft.py --pack examples/sample_pack.json --as-of 2026-11-06 "$flag" > /tmp/prohibited.json
            code=$?
            set -e
            test "$code" -eq 2
            test ! -s /tmp/prohibited.json
          done
          echo "Prohibited-action smoke test passed"

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert report['not_an_llm_judge'] is True
          assert report['not_a_credit_decision'] is True
          assert report['experiment_16_imported'] is False
          assert report['experiment_37_imported'] is False
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          assert 'grand_total' not in summary
          assert summary['facts_are_not_summed'] is True
          assert summary['cross_source_counts_are_not_added_to_stated_facts'] is True
          assert 18 not in summary.values()
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 12:
              print('ERROR: expected 12 cases')
              raise SystemExit(1)
          quotes = [case['stated_fact_count'] for case in report['cases'] if case['id'] in {'mereholt', 'mereholt-again'}]
          assert quotes == [9, 9]
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-39-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/39-credit-memo-drafting docs-site/docs/experiments/39-credit-memo-drafting.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No currency symbol copied into the source
        run: |
          python - <<'PY'
          import sys
          from pathlib import Path
          roots = [
              Path("experiments/39-credit-memo-drafting"),
              Path("docs-site/docs/experiments/39-credit-memo-drafting.md"),
          ]
          import re
          currency = re.compile(r"[£€]|\$\d")
          failed = False
          for root in roots:
              if not root.exists():
                  continue
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml"}:
                      continue
                  if "tests" in path.parts:
                      continue
                  text = path.read_text(errors="ignore")
                  if currency.search(text):
                      print(f"Currency symbol in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Currency check passed")
          PY

      - name: No obvious secrets in Experiment 39
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/39-credit-memo-drafting")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/39-credit-memo-drafting/README.md
          echo "Licence check passed"
