name: Experiment 36 - Cross-source validation tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/36-cross-source-validation/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/33-case-bundle-summariser/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/36-cross-source-validation.md'
      - '.github/workflows/experiment-36-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/36-cross-source-validation/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/33-case-bundle-summariser/**'
      - 'schemas/agent-manifest.schema.json'
      - 'docs-site/docs/experiments/36-cross-source-validation.md'
      - '.github/workflows/experiment-36-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/36-cross-source-validation

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/36-cross-source-validation/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run sample smoke test
        run: |
          python src/compare.py --pack examples/sample_pack.json --as-of 2026-11-05 > /tmp/comparison.json
          python -c "
          import json
          draft = json.load(open('/tmp/comparison.json'))
          counts = draft['counts']
          assert draft['label'] == 'DRAFT FOR THE REVIEWER. NOT A CORRECTION.'
          assert draft['catalogue_id'] == 'B005'
          assert draft['experiment_id'] == 'exp-36-cross-source-validation'
          assert draft['autonomy'] == 'A0'
          assert counts['fact_count'] == 7
          assert counts['match_count'] == 1
          assert counts['immaterial_count'] == 4
          assert counts['material_count'] == 2
          assert counts['occurrence_count'] == 26
          assert counts['match_count'] + counts['immaterial_count'] + counts['material_count'] == counts['fact_count']
          assert counts['occurrence_count'] != counts['fact_count']
          assert draft['awaiting_reviewer'] is True
          assert draft['all_material_resolved'] is False
          assert draft['do_not_rely'] is False
          assert draft['agent_chose_source'] is False
          assert draft['records_edited'] is False
          assert draft['parties_contacted'] is False
          assert draft['register_queried'] is False
          assert draft['correct_value_written'] is False
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['foundry_called'] is False
          assert draft['a3_recommended'] is False
          assert draft['output_is_anonymised'] is False
          assert draft['actions_taken'] == []
          assert draft['prompt_injection']['followed'] is False
          assert all(fact['correct_value'] is None for fact in draft['facts'])
          print('Sample smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/compare.py --pack examples/sample_pack.json --as-of 2027-05-05 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          counts = draft['counts']
          assert draft['do_not_rely'] is True
          assert counts['fact_count'] == 7
          assert counts['match_count'] == 1
          assert counts['immaterial_count'] == 4
          assert counts['material_count'] == 2
          assert draft['all_material_resolved'] is False
          assert draft['agent_chose_source'] is False
          assert draft['records_edited'] is False
          assert draft['register_queried'] is False
          assert draft['foundry_called'] is False
          assert draft['a3_recommended'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          for flag in choose-source edit-record contact lookup-register recommend-a3; do
            set +e
            python src/compare.py --pack examples/sample_pack.json --as-of 2026-11-05 --$flag > /tmp/prohibited.json
            code=$?
            set -e
            test "$code" -eq 2
            test ! -s /tmp/prohibited.json
          done
          echo "Prohibited-action smoke test passed"

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert report['foundry_called'] is False
          assert report['facts_are_not_added_to_total_cases'] is True
          assert report['occurrences_are_not_added_to_total_cases'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          assert 'Not a correction of any record' in report['evaluation_label']
          summary = report['summary']
          assert summary['passed'] + summary['failed'] == summary['total_cases']
          assert 'errors' not in summary
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['failed']:
              print(f\"ERROR: {summary['failed']} failed\")
              raise SystemExit(1)
          if summary['total_cases'] < 37:
              print('ERROR: fewer than 37 cases')
              raise SystemExit(1)
          fact_sum = sum(row['fact_count'] or 0 for row in report['cases'])
          occurrence_sum = sum(row['occurrence_count'] or 0 for row in report['cases'])
          if fact_sum == summary['total_cases'] or occurrence_sum == summary['total_cases']:
              print('ERROR: fact or occurrence counts and case counts were collapsed')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-36-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/36-cross-source-validation docs-site/docs/experiments/36-cross-source-validation.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No prices copied
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          roots = [
              Path("experiments/36-cross-source-validation"),
              Path("docs-site/docs/experiments/36-cross-source-validation.md"),
          ]
          price = re.compile(r"(£|€|\$\d|free of charge|\d+ Copilot Credits)", re.I)
          failed = False
          for root in roots:
              if not root.exists():
                  continue
              paths = [root] if root.is_file() else root.rglob("*")
              for path in paths:
                  if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml"}:
                      continue
                  if price.search(path.read_text(errors="ignore")):
                      print(f"Price-like text in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Price check passed")
          PY

      - name: No obvious secrets in Experiment 36
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/36-cross-source-validation")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/36-cross-source-validation/README.md
          echo "Licence check passed"
