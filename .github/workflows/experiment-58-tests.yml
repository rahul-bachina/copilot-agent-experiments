name: Experiment 58 - Employee handbook tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/58-employee-handbook/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/11-era-2025-hr-assistant/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - 'experiments/32-employee-case-intake/**'
      - 'experiments/44-knowledge-gap-detector/**'
      - 'experiments/50-sharepoint-knowledge-curator/**'
      - '.github/workflows/experiment-58-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/58-employee-handbook/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/11-era-2025-hr-assistant/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - 'experiments/32-employee-case-intake/**'
      - 'experiments/44-knowledge-gap-detector/**'
      - 'experiments/50-sharepoint-knowledge-curator/**'
      - 'docs-site/docs/experiments/58-employee-handbook.md'
      - '.github/workflows/experiment-58-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/58-employee-handbook

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/58-employee-handbook/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run answer smoke test
        run: |
          python src/answer.py --handbook fixtures/handbook.json --scope examples/sample_scope.json --question examples/sample_question.json --as-of 2026-11-16 > /tmp/answer.json
          python -c "
          import json
          result = json.load(open('/tmp/answer.json'))
          blob = json.dumps(result)
          assert result['label'] == 'READ-ONLY HANDBOOK ANSWER'
          assert result['catalogue_id'] == 'H001'
          assert result['autonomy'] == 'A0'
          assert result['human_approval'] is None
          assert result['outcome'] == 'answered'
          assert result['entitlement_decision'] is None
          assert result['handbook_is_synthetic'] is True
          assert result['legal_advice'] is False
          assert result['medical_advice'] is False
          assert result['tax_advice'] is False
          assert result['flags']['sent'] is False
          assert result['flags']['written'] is False
          assert result['flags']['entitlement_decided'] is False
          assert result['flags']['sharepoint_called'] is False
          assert result['flags']['graph_called'] is False
          assert result['flags']['network_called'] is False
          assert result['flags']['sources_approved_by_agent'] is False
          sections = [row['section_id'] for row in result['citations']]
          assert 'LV-2' in sections
          assert 'LV-1' not in sections
          assert 'LV-X' not in sections
          assert 'CANARY-DRAFT' not in blob
          assert 'entitled to 100' not in blob
          assert 'you are entitled' not in result['answer'].lower()
          print('Answer smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/answer.py --handbook fixtures/handbook.json --scope examples/sample_scope.json --question examples/sample_question.json --as-of 2027-06-01 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          assert result['stale']['rules_current'] is False
          assert result['may_be_relied_on'] is False
          assert result['human_approval'] is None
          assert result['entitlement_decision'] is None
          assert result['flags']['network_called'] is False
          assert result['flags']['sent'] is False
          assert all(row.get('taken') is None for row in result['sources'])
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.answer import HandbookForbidden, acknowledge, answer_handbook, decide_entitlement, send_answer
          handbook = json.loads(Path('fixtures/handbook.json').read_text())
          scope = json.loads(Path('examples/sample_scope.json').read_text())
          question = json.loads(Path('examples/sample_question.json').read_text())
          result = answer_handbook(question, handbook, scope, '2026-11-16')
          refused = acknowledge(result, {
              'actor_role': 'employee',
              'seen': True,
              'approved': True,
              'approval_reference': 'RB-HR-SCOPE-2026-04',
          })
          assert refused['human_approval'] is None
          assert refused['entitlement_decision'] is None
          assert refused['acknowledgement']['reason'] == 'not_the_hr_step'
          try:
              decide_entitlement()
          except HandbookForbidden:
              pass
          else:
              raise SystemExit('decide_entitlement should raise')
          try:
              send_answer()
          except HandbookForbidden:
              pass
          else:
              raise SystemExit('send_answer should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 18:
              print('ERROR: expected 18 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-58-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/58-employee-handbook docs-site/docs/experiments/58-employee-handbook.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 58
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/58-employee-handbook")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/58-employee-handbook/README.md
          echo "Licence check passed"
