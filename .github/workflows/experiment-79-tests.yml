name: Experiment 79 - Document comparison assistant tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/79-document-comparison/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'experiments/33-case-bundle-summariser/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-79-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/79-document-comparison/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/29-groundedness-evaluation/**'
      - 'experiments/33-case-bundle-summariser/**'
      - 'docs-site/docs/experiments/79-document-comparison.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-79-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/79-document-comparison

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/79-document-comparison/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run comparison smoke test
        run: |
          python src/compare.py --request examples/sample_request.json --as-of 2026-11-25 > /tmp/compare.json
          python -c "
          import json
          result = json.load(open('/tmp/compare.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('DRAFT COMPARISON FOR THE NAMED READER')
          assert result['catalogue_id'] == 'O004'
          assert result['autonomy'] == 'A0'
          assert result['human_approval'] is None
          assert result['versions_confirmed'] is False
          assert result['document_approved'] is False
          assert result['document_edited'] is False
          assert result['published'] is False
          assert result['sent'] is False
          assert result['legal_advice'] is False
          assert result['instructions_followed'] is False
          assert result['experiment_38_compare_called'] is False
          assert result['material']['statement'] != 'no material change'
          assert result['material']['checks_performed']
          assert '07700900123' not in blob
          assert 'desk@reedmarsh.example' not in blob
          print('Comparison smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/compare.py --request examples/sample_request.json --as-of 2026-11-25 > /tmp/stale.json
          python -c "
          import json
          result = json.load(open('/tmp/stale.json'))
          assert result['sources_current'] is False
          assert result['may_be_relied_on'] is False
          assert result['human_approval'] is None
          assert result['versions_confirmed'] is False
          assert result['coerced'] is False
          assert result['as_of'] == '2026-11-25'
          assert any(row.get('stale') for row in result['dates'])
          assert 'dates_seen' in result['required_acknowledgements']
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.compare import (
              CompareForbidden,
              approve_document,
              edit_document,
              give_legal_advice,
              pinned_directory,
              prepare_comparison,
              publish_document,
              send_document,
              confirm_versions,
          )
          request = json.loads(Path('examples/sample_request.json').read_text())
          result = prepare_comparison(request, as_of='2026-11-25')
          forged = confirm_versions(result, pinned_directory(), {
              'item': 'version-pair',
              'decision': 'confirm-versions',
              'approver_ref': 'RDR-7901',
              'comparison_id': result['comparison_id'],
              'content_hash': 'a' * 64,
              'baseline_version_id': result['provisional_orientation'],
              'other_version_id': 'v2026-04',
              'baseline_document_hash': 'b' * 64,
              'other_document_hash': 'c' * 64,
              'versions_seen': True,
              'pins_seen': True,
          })
          assert forged['human_approval'] is None
          assert forged['versions_confirmed'] is False
          assert forged['blocked_reason'] in {'caller_rehash_rejected', 'content_tampered', 'document_hash_mismatch'}
          for fn in (edit_document, approve_document, publish_document, send_document, give_legal_advice):
              try:
                  fn()
              except CompareForbidden:
                  pass
              else:
                  raise SystemExit(fn.__name__ + ' should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 20:
              print('ERROR: expected 20 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          paraphrase = report['paraphrase_recall']
          assert paraphrase['not_added_to_case_total'] is True
          for name, row in paraphrase['categories'].items():
              assert row['sentences'] >= 20, name
              if row['expect_match']:
                  assert row['recall'] == 1.0, name
                  assert row['precision'] == 1.0, name
              else:
                  assert row['false_inclusions'] == 0, name
          alignment = report['alignment_score']
          assert alignment['not_added_to_case_total'] is True
          assert alignment['recall'] == 1.0
          assert alignment['precision'] == 1.0
          assert alignment['positives'] >= 20
          assert alignment['negatives'] >= 20
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-79-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/79-document-comparison docs-site/docs/experiments/79-document-comparison.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 79
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/79-document-comparison")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/79-document-comparison/README.md
          echo "Licence check passed"
