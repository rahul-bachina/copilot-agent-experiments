name: Experiment 43 - Response drafting tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/43-response-drafting/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/09-casework-correspondence-draft/**'
      - '.github/workflows/experiment-43-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/43-response-drafting/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/09-casework-correspondence-draft/**'
      - 'docs-site/docs/experiments/43-response-drafting.md'
      - '.github/workflows/experiment-43-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/43-response-drafting

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/43-response-drafting/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run draft smoke test
        run: |
          python src/response.py --input examples/sample_case.json --as-of 2026-11-09 > /tmp/draft.json
          python -c "
          import json
          draft = json.load(open('/tmp/draft.json'))
          assert draft['label'] == 'DRAFT FOR REPRESENTATIVE REVIEW'
          assert draft['catalogue_id'] == 'C004'
          assert draft['autonomy'] == 'A1'
          assert draft['human_approval'] is None
          assert draft['actions_taken'] == []
          assert draft['executed'] is False
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['case_text_echoed'] is False
          assert draft['outcome'] == 'draft_with_citations'
          assert draft['sources_cited'][0]['id'] == 'KB-HOURS-01'
          assert draft['human_route']['offered'] is True
          assert draft['human_route']['agent_sends'] is False
          assert draft['flags']['message_sent'] is False
          assert draft['flags']['case_written'] is False
          assert draft['flags']['redress_offered'] is False
          assert draft['flags']['complaint_closed'] is False
          assert draft['pii_gateway']['output_is_anonymised'] is False
          assert draft['pii_gateway']['agent_may_release'] is False
          assert draft['regulatory']['consumer_duty']['outcome_met'] is False
          assert draft['regulatory']['equality_act']['duty_met'] is False
          assert draft['regulatory']['article_12']['article_12_met'] is False
          assert 'large print' in draft['draft']['text']
          print('Draft smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/response.py --input examples/sample_case.json --as-of 2027-05-09 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          blob = json.dumps(draft)
          assert draft['stale']['rules_current'] is False
          assert draft['outcome'] == 'stale_sources'
          assert draft['human_approval'] is None
          assert draft['network_called'] is False
          assert draft['sources_cited'] == []
          assert draft['flags']['message_sent'] is False
          assert '09:00 to 17:00' not in blob
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, 'src')
          from response import DraftForbidden, draft_response, record_review, send_message
          case = json.loads(Path('examples/sample_case.json').read_text())
          draft = draft_response(case, '2026-11-09')
          refused = record_review(draft, {
              'decision': 'send_message',
              'actor': 'representative',
              'actor_id': 'SYN-REP-043',
          })
          assert refused['review']['refused'] is True
          assert refused['review']['reason'] == 'prohibited_decision'
          assert refused['flags']['message_sent'] is False
          assert refused['human_approval'] is None
          try:
              send_message()
          except DraftForbidden:
              pass
          else:
              raise SystemExit('send_message should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-43-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/43-response-drafting docs-site/docs/experiments/43-response-drafting.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 43
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/43-response-drafting")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/43-response-drafting/README.md
          echo "Licence check passed"
