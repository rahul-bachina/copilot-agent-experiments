name: Experiment 09 - Correspondence draft tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/09-casework-correspondence-draft/**'
      - '.github/workflows/experiment-09-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/09-casework-correspondence-draft/**'
      - '.github/workflows/experiment-09-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/09-casework-correspondence-draft

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/09-casework-correspondence-draft/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run correspondence draft smoke test
        run: |
          python src/draft.py --received 2026-01-02 --as-of 2026-10-26 \
            --input examples/sample_letter.txt --confirm-target --confirm-channel \
            > /tmp/draft.json
          python -c "
          import json
          draft = json.load(open('/tmp/draft.json'))
          assert draft['processing_mode'] == 'mock'
          assert draft['evaluation_label'].startswith('MOCK SMOKE TEST')
          assert draft['sla']['operative_due_on'] == '2026-01-30'
          assert draft['sla']['operative'] is True
          assert draft['draft']['may_be_sent_by_agent'] is False
          assert draft['recipient']['approved'] is False
          assert draft['recipient']['may_be_chosen_by_agent'] is False
          assert draft['vulnerability']['person_labelled_vulnerable'] is False
          assert draft['security']['actions_taken'] == []
          assert draft['atrs_draft']['not_submitted'] is True
          cited = [line['id'] for line in draft['lines_cited']]
          assert cited == ['LTT-PARKS-01']
          print('Draft smoke test passed')
          "

      - name: Run evaluation (mock smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'mock'
          assert report['not_a_model_evaluation'] is True
          assert 'MOCK SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] < 20:
              print('ERROR: fewer than 20 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-09-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/09-casework-correspondence-draft docs-site/docs/experiments/09-casework-correspondence-draft.md; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 09
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/09-casework-correspondence-draft")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/09-casework-correspondence-draft/README.md
          echo "Licence check passed"
