name: Experiment 32 - Employee case intake tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/32-employee-case-intake/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'schemas/agent-manifest.schema.json'
      - '.github/workflows/experiment-32-tests.yml'
  pull_request:
    branches: [main]
    paths:
      - 'experiments/32-employee-case-intake/**'
      - 'experiments/15-vulnerability-urgency-scanner/**'
      - 'experiments/12-document-intake/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'schemas/agent-manifest.schema.json'
      - '.github/workflows/experiment-32-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/32-employee-case-intake

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/32-employee-case-intake/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run intake smoke test
        run: |
          python src/draft.py --input examples/sample_case.json --as-of 2026-11-04 > /tmp/draft.json
          python -c "
          import json
          draft = json.load(open('/tmp/draft.json'))
          assert draft['label'] == 'DRAFT FOR HR CONFIRMATION'
          assert draft['catalogue_id'] == 'H009'
          assert draft['experiment_id'] == 'exp-32-employee-case-intake'
          assert draft['autonomy'] == 'A1'
          assert draft['classification']['proposed_category'] == 'grievance'
          assert draft['classification']['decided'] is False
          assert draft['routing']['proposed_route'] == 'hr_grievance_officer'
          assert draft['routing']['confirmed'] is False
          assert draft['hr_confirmation']['classification_confirmed'] is False
          assert draft['hr_confirmation']['routing_confirmed'] is False
          assert draft['outcome'] is None
          assert draft['merits_advice'] is None
          assert draft['actions_taken'] == []
          assert draft['model_called'] is False
          assert draft['network_called'] is False
          assert draft['narrative_stored'] is False
          assert draft['hr_system_written'] is False
          assert draft['contacted_employee'] is False
          assert draft['contacted_manager'] is False
          assert draft['sources_pinned_on'] == '2026-11-04'
          assert draft['sources_stale'] is False
          assert draft['special_category']['article_9_condition_asserted'] is False
          assert draft['automated_decision']['solely_automated_decision'] is False
          assert draft['pii_gateway']['output_is_anonymised'] is False
          assert all(row['days_encoded'] is None for row in draft['time_references'])
          print('Intake smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python src/draft.py --input examples/sample_case.json --as-of 2027-04-01 --stale-after-days 90 > /tmp/stale.json
          python -c "
          import json
          draft = json.load(open('/tmp/stale.json'))
          assert draft['sources_stale'] is True
          assert draft['rules_current'] is False
          assert draft['hr_confirmation']['classification_confirmed'] is False
          assert draft['classification']['decided'] is False
          assert draft['network_called'] is False
          assert draft['hr_system_written'] is False
          print('Stale-data smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test agreement: {summary['agreement_rate']}%\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          check_count = sum(len(item.get('checks', [])) for item in report['cases'])
          if summary['total_cases'] != len(report['cases']):
              print('ERROR: total_cases does not match the case list')
              raise SystemExit(1)
          if summary['total_cases'] == check_count:
              print('ERROR: total_cases double-counts checks')
              raise SystemExit(1)
          if summary['total_cases'] < 16:
              print('ERROR: fewer than 16 synthetic cases')
              raise SystemExit(1)
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-32-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ "Azure AI Foundry" experiments/32-employee-case-intake; then
            echo "Use 'Microsoft Foundry', not 'Azure AI Foundry'."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 32
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/32-employee-case-intake")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/32-employee-case-intake/README.md
          echo "Licence check passed"
