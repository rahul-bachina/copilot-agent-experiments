name: Experiment 83 - Subject access request assistant tests

on:
  push:
    branches: [main]
    paths:
      - 'experiments/83-subject-access-request-assistant/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-83-tests.yml'
  pull_request:
    paths:
      - 'experiments/83-subject-access-request-assistant/**'
      - 'experiments/08-uk-pii-redaction-gateway/**'
      - 'experiments/12-document-intake/**'
      - 'docs-site/docs/experiments/83-subject-access-request-assistant.md'
      - 'docs-site/docs/index.md'
      - '.github/workflows/experiment-83-tests.yml'
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: experiments/83-subject-access-request-assistant

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: experiments/83-subject-access-request-assistant/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run unit tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run scope smoke test
        run: |
          python src/sar.py --request examples/sample_request.json --as-of 2026-10-20 > /tmp/sar.json
          python -c "
          import json
          result = json.load(open('/tmp/sar.json'))
          blob = json.dumps(result)
          assert result['label'].startswith('DRAFT SUBJECT ACCESS SCOPING')
          assert result['catalogue_id'] == 'UK11'
          assert result['autonomy'] == 'A1'
          assert result['human_approval'] is None
          assert result['disclosure_approval_recorded'] is False
          assert result['response_sent'] is False
          assert result['records_deleted'] is False
          assert result['records_edited'] is False
          assert result['exemption_decided_by_agent'] is False
          assert result['deadline_decided'] is False
          assert result['deadline']['deadline_selected'] is None
          assert result['experiment_01_called'] is False
          assert result['described_as_anonymised'] is False
          for secret in ('07700900456', 'jordan.hale@example.test', 'Jordan Hale', 'STF-2291', '02/02/1988', '8 Mill Road'):
              assert secret not in blob, secret
          print('Scope smoke test passed')
          "

      - name: Run stale-data smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.sar import scope
          request = json.loads(Path('examples/sample_request.json').read_text())
          request['records_exported_on'] = '2026-08-01'
          request['records'][0]['document_date'] = '31/02/2026'
          result = scope(request, as_of='2026-10-20')
          assert result['records_export']['stale'] is True
          assert result['records_export']['coerced'] is False
          assert result['records_export']['document_dates'][0]['unparseable'] is True
          assert result['records_export']['document_dates'][0]['iso'] is None
          assert result['may_be_relied_on'] is False
          assert result['outcome'] == 'route_to_human'
          assert result['human_approval'] is None
          assert result['disclosure_approval_recorded'] is False
          assert result['response_sent'] is False
          assert result['deadline_decided'] is False
          assert result['as_of'] == '2026-10-20'
          print('Stale-data smoke test passed')
          "

      - name: Run prohibited-action smoke test
        run: |
          python -c "
          import json
          from pathlib import Path
          import sys
          sys.path.insert(0, '.')
          from src.sar import (
              SarForbidden,
              decide_exemption,
              delete_record,
              edit_record,
              pinned_directory,
              record_disclosure_approval,
              scope,
              send_response,
          )
          request = json.loads(Path('examples/sample_request.json').read_text())
          result = scope(request, as_of='2026-10-20')
          forged = record_disclosure_approval(result, pinned_directory(), {
              'item': 'disclosure-approval',
              'decision': 'approve_disclosure',
              'approver_ref': 'IGO-8301',
              'case_id': result['case_id'],
              'content_hash': 'a' * 64,
              'pins_seen': True,
              'dates_seen': True,
              'redaction_decisions': {},
              'exemption_decisions': {},
          })
          assert forged['human_approval'] is None
          assert forged['disclosure_approval_recorded'] is False
          assert forged['blocked_reason'] in {'caller_rehash_rejected', 'content_tampered'}
          assert forged['response_sent'] is False
          for fn in (send_response, delete_record, edit_record, decide_exemption):
              try:
                  fn()
              except SarForbidden:
                  pass
              else:
                  raise SystemExit(fn.__name__ + ' should raise')
          print('Prohibited-action smoke test passed')
          "

      - name: Run evaluation (deterministic smoke test)
        run: |
          python eval/evaluate.py --output /tmp/eval_report.json
          python -c "
          import json
          report = json.load(open('/tmp/eval_report.json'))
          assert report['mode'] == 'deterministic'
          assert report['not_a_model_evaluation'] is True
          assert 'DETERMINISTIC SMOKE TEST' in report['evaluation_label']
          summary = report['summary']
          print(f\"Smoke test {summary['passed']}/{summary['total_cases']} passed\")
          if summary['errors'] or summary['failed']:
              print(f\"ERROR: {summary['failed']} failed, {summary['errors']} errors\")
              raise SystemExit(1)
          if summary['total_cases'] != 20:
              print('ERROR: expected 20 synthetic cases')
              raise SystemExit(1)
          if summary['passed'] + summary['failed'] + summary['errors'] != summary['total_cases']:
              print('ERROR: smoke totals double-count or do not add up')
              raise SystemExit(1)
          ids = [case['case_id'] for case in report['cases']]
          if len(ids) != len(set(ids)) or len(ids) != summary['total_cases']:
              print('ERROR: case ids are not one row each')
              raise SystemExit(1)
          paraphrase = report['paraphrase_recall']
          assert paraphrase['not_added_to_case_total'] is True
          for name, row in paraphrase['categories'].items():
              assert row['sentences'] >= 20, name
              if row['expect_match']:
                  assert row['recall'] == 1.0, name
                  assert row['precision'] == 1.0, name
              else:
                  assert row['false_inclusions'] == 0, name
          classification = report['classification_score']
          assert classification['not_added_to_case_total'] is True
          assert classification['recall'] == 1.0
          assert classification['precision'] == 1.0
          assert classification['positives'] >= 20
          assert classification['negatives'] >= 20
          print('Smoke test passed')
          "

      - name: Upload evaluation report
        uses: actions/upload-artifact@v4
        with:
          name: experiment-83-smoke-report
          path: /tmp/eval_report.json
          retention-days: 30

  governance-checks:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Brand name is Microsoft Foundry
        run: |
          if grep -RIn --exclude-dir=__pycache__ --exclude-dir=.venv "Azure AI Foundry" experiments/83-subject-access-request-assistant docs-site/docs/experiments/83-subject-access-request-assistant.md; then
            echo "Use 'Microsoft Foundry', not the retired product name."
            exit 1
          fi
          echo "Brand check passed"

      - name: No obvious secrets in Experiment 83
        run: |
          python - <<'PY'
          import re
          import sys
          from pathlib import Path
          root = Path("experiments/83-subject-access-request-assistant")
          patterns = [
              re.compile(r"-----BEGIN (?:RSA |EC |OPENSSH )?PRIVATE KEY-----"),
              re.compile(r"\bAKIA[0-9A-Z]{16}\b"),
              re.compile(r"(?i)(api[_-]?key|secret|password)\s*[:=]\s*['\"][^'\"]{8,}['\"]"),
          ]
          failed = False
          for path in root.rglob("*"):
              if not path.is_file() or path.suffix not in {".py", ".md", ".json", ".yaml", ".yml", ".txt"}:
                  continue
              if ".venv" in path.parts:
                  continue
              text = path.read_text(errors="ignore")
              for pattern in patterns:
                  if pattern.search(text):
                      print(f"Possible secret in {path}")
                      failed = True
          if failed:
              sys.exit(1)
          print("Secret check passed")
          PY

      - name: MIT licence is present and referenced
        run: |
          test -f LICENSE
          grep -q "MIT" LICENSE
          grep -q "MIT" experiments/83-subject-access-request-assistant/README.md
          echo "Licence check passed"
