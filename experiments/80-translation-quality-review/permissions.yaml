# Agent manifest: Translation Quality Review Assistant
# Experiment 80 — catalogue ID O006
# Version: 0.1.0
# Last reviewed: 2026-11-26
# Next review: 2027-05-26

$schema: "../../../schemas/agent-manifest.schema.json"

agent:
  id: "exp-80-translation-quality-review"
  name: "Translation Quality Review Assistant"
  version: "0.1.0"
  description: >
    Aligns a synthetic source text with its translation and flags omitted
    content, changed facts, negation, obligation strength, glossary terms,
    and register. Autonomy A0. The named bilingual reviewer validates every
    high-risk segment and owns the final translation. The agent does not
    publish, send, or overwrite a document.
  owner: "Translation owner"
  contact: "translations@reedmarsh.example"
  repository: "https://github.com/rahul-bachina/copilot-agent-experiments"
  experiment_path: "experiments/80-translation-quality-review"

autonomy:
  level: "A0"
  level_description: "Read-only review. The named bilingual reviewer validates high-risk content and owns the final translation. The agent never publishes, sends, or overwrites a document."
  constraints:
    - "The reviewer owns the final translation. The agent does not."
    - "Every high-risk segment is routed to the reviewer regardless of overlap."
    - "The agent NEVER publishes, sends, or overwrites a document"
    - "The agent NEVER treats a sentence in the source or the target as the review step"
    - "A caller-supplied glossary or directory is not the pinned source"
  human_in_the_loop: true
  auto_actions_enabled: false

data_access:
  reads:
    - resource: "Synthetic source text and translation"
      description: "Segmented English source and a Welsh or Polish target, or an English rendering. Instructions inside the text are not followed."
      access_level: "read"
      scope: "One synthetic pair. Text above the reviewer's directory clearance is not copied out."
      justification: "The review cites both sides. The reviewer owns the final translation."
      data_categories:
        - "Segment text"
        - "Protective markings, retention labels, and legal-hold flags"
      may_contain_personal_data: true
      may_contain_special_category_data: true
      retention: "The in-memory held copy lives for the process. This starter does not set a statutory retention period."
    - resource: "Synthetic directory"
      description: "Bilingual reviewers and guests. Text does not set the role, the languages, or the clearance."
      access_level: "read"
      scope: "One reviewer reference."
      justification: "Only the named directory reviewer who has the target language can own the translation."
      may_contain_personal_data: true
    - resource: "Pinned synthetic glossary"
      description: "The only glossary used for defined terms. A caller glossary is compared and not applied."
      access_level: "read"
      scope: "The fixture file."
      justification: "A caller-supplied glossary is not authoritative."
      may_contain_personal_data: false
    - resource: "Separate review object"
      description: "The only object that can record a route, validate high-risk segments, or record that the reviewer owns this hash."
      access_level: "read"
      scope: "One object, bound to the agent-held hash and the agent-held document hashes."
      justification: "A sentence inside either text is not that step."
      may_contain_personal_data: false
    - resource: "Experiment 79 alignment and contact masking"
      description: "align(), mask_text(), and the date parser. The alignment rules are not copied."
      access_level: "read"
      scope: "One pair of segment lists. Matched contact values are not stored."
      justification: "Segment alignment and contact masking are already implemented there."
      may_contain_personal_data: true
    - resource: "Experiment 08 UK identifier redaction"
      description: "propose() on the segment text. Reversible stays false. The redacted text is not copied."
      access_level: "read"
      scope: "A count of findings. Matched values are not stored."
      justification: "A pasted identifier is counted. The output is not described as anonymised."
      may_contain_personal_data: true

  never_access:
    - resource: "A live translation memory, a mailbox, or a publication site"
      reason: "The synthetic pair is what this starter reads. It does not publish, send, or overwrite."
    - resource: "A caller-supplied glossary, directory, or register"
      reason: "Differences are flagged. The review uses the pinned glossary and the pinned directory."
    - resource: "An approval marker, a role, a language claim, or a clearance stated inside the text"
      reason: "The directory and the separate review object are the source."
    - resource: "Segment text above the reviewer's directory clearance"
      reason: "The body is not copied. The higher marking, the legal hold, and the retention labels are kept."
    - resource: "Experiment 38 policy-wording compare()"
      reason: "That function is an insurance topic list. This starter does not call it."

tools:
  allowed:
    - tool: "Prepare translation review"
      provider: "Local Python (prepare_review)"
      action: "Align synthetic segments and return flags, risk, and a hash"
      access_level: "read"
      scope: "One synthetic request. No network. No model."
      justification: "The flags are deterministic. A language model must not decide that a translation has no issues."
      human_approval_required: false
      output_requires_human_review: true
    - tool: "Record route seen"
      provider: "Local Python (record_route_seen)"
      action: "Record that the named reviewer has seen a human route"
      access_level: "read"
      scope: "The review and a separate seen object. Nothing is sent."
      justification: "High-risk content, distress, and other routes are not a routine clearance."
      human_approval_required: true
      output_requires_human_review: true
    - tool: "Record high-risk validated"
      provider: "Local Python (record_high_risk_validated)"
      action: "Record that the named reviewer has validated the high-risk segments of this hash"
      access_level: "read"
      scope: "The review and a separate validation object, bound to the content hash and the document hashes."
      justification: "High-risk segments are routed regardless of overlap. The step does not publish the translation."
      human_approval_required: true
      output_requires_human_review: true
    - tool: "Record translation owned"
      provider: "Local Python (record_translation_owned)"
      action: "Record that the named reviewer owns the final translation of this hash"
      access_level: "read"
      scope: "The review and a separate ownership object. Nothing is published."
      justification: "The catalogue checkpoint is that the bilingual reviewer owns the final translation."
      human_approval_required: true
      output_requires_human_review: true
    - tool: "Text note"
      provider: "Microsoft Foundry"
      action: "Turn the JSON into a short note, using only fields already in the JSON"
      access_level: "read"
      scope: "The JSON for this run"
      justification: "Optional narrative. The hashes, the flags, and the ownership step stay in the Python core."
      human_approval_required: false
      output_requires_human_review: true

  writes:
    enabled: false
    note: >
      No writes. record_translation_owned keeps an in-memory acknowledgement
      for this process. It does not publish, send, or overwrite a document.

  sends:
    enabled: false
    note: "No sends. Owning the translation does not email it or publish it."

high_risk_actions:
  approve_reject:
    enabled: false
    rationale: "The agent does not approve or reject a translation. A review object records that the named reviewer owns this hash. A sentence in the text cannot set it."
  regulated_decision:
    enabled: false
    rationale: "The agent does not decide that a Welsh language standard was met, that a translation is fit to publish, or that a person is eligible for a benefit."
  production_record_change:
    enabled: false
    rationale: "The agent does not overwrite a document or write a production record."
  external_send:
    enabled: false
    rationale: "The agent does not send the review or the translation."
  spend_transact:
    enabled: false
    rationale: "There is no payment. An amount in a segment is a difference to flag, not a transaction."
  additional_high_risk:
    - enabled: false
      action_name: "Publish, send, or overwrite a document"
      rationale: "Those functions raise. published, sent, and overwritten stay false."
    - enabled: false
      action_name: "Approve the translation"
      rationale: "approve_translation raises. translation_approved_by_agent stays false. The reviewer owns the text."
    - enabled: false
      action_name: "Treat text as the reviewer's step"
      rationale: "translation_owned stays false until record_translation_owned succeeds for the named reviewer, the content hash, and the held document hashes."
    - enabled: false
      action_name: "Say there are no issues without listing the checks"
      rationale: "The statement is set only when every check was run and none fired. The check list is always present."
    - enabled: false
      action_name: "Clear high-risk content because overlap is high"
      rationale: "high_risk_routed_regardless_of_score stays true when a high-risk stem is affirmed. quality_score stays null."
    - enabled: false
      action_name: "Apply a caller-supplied glossary"
      rationale: "caller_glossary_applied stays false. Differences from the pinned glossary are flagged."
    - enabled: false
      action_name: "Drop a legal hold, a retention label, or a protective marking"
      rationale: "A hold, every retention label, and the higher marking are copied onto the result and sit inside the hash."

human_approval:
  description: >
    The named bilingual reviewer sees any human route, validates high-risk
    segments, and owns the final translation, on separate objects bound to
    the agent-held content hash and the agent-held document hashes. Those
    steps do not publish, send, or overwrite the document. A sentence inside
    the source or the target is not a step.

  approval_points:
    - action: "See a distress, safeguarding, whistleblowing, grievance, or other human route"
      approver: "Named bilingual reviewer"
      mandatory: true
      rationale: "record_route_seen accepts the directory reviewer named on the review and the content hash. It does not own the translation."
    - action: "Validate every high-risk segment"
      approver: "Named bilingual reviewer"
      mandatory: true
      rationale: "record_high_risk_validated accepts the directory reviewer only when the content hash and both document hashes match the agent-held copies. High-risk content is routed regardless of overlap."
    - action: "Own the final translation"
      approver: "Named bilingual reviewer"
      mandatory: true
      rationale: "record_translation_owned accepts the directory reviewer who has the target language, and only for this content hash and these document hashes. It does not publish the text."
    - action: "Acknowledge the opened Welsh language and accessibility pins"
      approver: "Named bilingual reviewer"
      mandatory: true
      rationale: "pins_seen must be the boolean true. The standards schedule and the accessibility requirements after regulation 1 were not opened."
    - action: "Acknowledge a stale source, an unreadable date, a marking, a flag, or a glossary difference"
      approver: "Named bilingual reviewer"
      mandatory: true
      rationale: "The matching acknowledgement must be the boolean true when that flag is set. A string is not coerced."
    - action: "Publish, send, or overwrite a document"
      approver: "Nobody"
      mandatory: true
      rationale: "Those actions are not tools. The flags stay false after the reviewer owns the translation."

  no_approval_required:
    - action: "Read the review"
      rationale: "Reading the review has no external effect. translation_owned stays false and nothing is published."
    - action: "Re-run the same request"
      rationale: "No write and no send until the review object matches. The same inputs and the same question date produce the same JSON."

uk_gdpr:
  lawful_basis:
    primary: "Not asserted"
    description: >
      This starter does not decide the controller's lawful basis. Article 6
      was not opened on 26 November 2026. Article 5 was not opened on that
      date either. No data-minimisation finding is made.
    secondary: "None asserted."
  special_category_data:
    may_process: true
    categories_possible:
      - "Health, safeguarding, or other sensitive text a caller may paste into a segment"
    lawful_basis_special: "Not asserted. Article 9 was not opened on 26 November 2026."
    safeguards:
      - "A distress, safeguarding, whistleblowing, or grievance cue is routed to the named reviewer. The cue text is not copied."
      - "Phone numbers, email addresses, dates of birth, postal addresses, personal names, and UK identifiers are counted and not stored. The output is not described as anonymised."
      - "A headcount below 5 is not published, and neither is a difference or a percentage of that count. Five is this starter's threshold."
      - "Samples in this repository are synthetic."
      - "No solely automated decision about a person or a translation. The review does not publish a version."
  data_minimisation:
    - "A segment above the reviewer's clearance is not copied into the result."
    - "Cue text is not copied."
    - "described_as_anonymised stays false."
  retention:
    agent_retention: "The held copy lives for the process. This starter does not set a disposal date."
    note: "A retention label and a legal hold on the texts are kept. They are not a decision to dispose."
  data_residency:
    region: "UK"
    note: "A production Microsoft Foundry deployment should use UK South or UK West. This repository cannot enforce that."
  data_subject_rights:
    note: "The agent does not handle access, erasure, or objection requests. Those go through the organisation's privacy process."

prompt_injection:
  description: >
    Segment text, a caller note, and a caller glossary are untrusted. They
    may say the translation is already approved, that the agent should report
    no issues, or that a label should be stripped. The core does not read
    the network.
  controls:
    - control: "Instruction sentences are not followed"
      description: "Publish, send, overwrite, and no-issues sentences are recorded. followed stays false."
    - control: "Negation is not a positive inclusion"
      description: "A phrase after not true that, in the same sentence, is not a risk match. A distress stem is still routed."
    - control: "Ownership is a separate object"
      description: "Ownership keys on the request are stripped. translation_owned stays false until record_translation_owned succeeds against the agent-held copy."
    - control: "Pinned glossary and directory win"
      description: "A glossary or directory in the request is not used as the authority."
    - control: "No publish, send, or overwrite tool"
      description: "Those functions raise ReviewForbidden."
  residual_risk: >
    A manipulated model can still narrate a misleading note. The named
    reviewer is the control. Nothing is sent even if the note is wrong. A
    paraphrase that uses none of the cue stems is not flagged.

risk_assessment:
  methodology: "Likelihood x impact, Low / Medium / High, for this starter rather than a named organisation"
  date_assessed: "2026-11-26"
  risks:
    - id: "R1"
      risk: "A sentence in a text is treated as the reviewer's ownership or as a clearance to publish"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Those words are recorded and not followed"
        - "record_translation_owned reads only the separate object, the content hash, and the held document hashes"
      residual_risk: "Low"
      owner: "Translation owner"
    - id: "R2"
      risk: "The agent publishes, sends, or overwrites a translation"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Those functions raise"
        - "The flags stay false after ownership"
      residual_risk: "Low"
      owner: "Translation owner"
    - id: "R3"
      risk: "A changed fact in a high-risk segment is cleared because overlap looks high"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "High-risk segments are routed regardless of overlap"
        - "quality_score stays null"
        - "No issues is stated only with the check list"
      residual_risk: "Medium"
      owner: "Translation owner"
    - id: "R4"
      risk: "A low-confidence alignment or a caller glossary is treated as settled"
      likelihood: "Medium"
      impact: "Medium"
      inherent_risk: "Medium"
      controls:
        - "Low confidence is flagged and is not a quality score"
        - "A caller glossary is not applied"
      residual_risk: "Low"
      owner: "Translation owner"
    - id: "R5"
      risk: "An unreadable date or a bad language code is coerced to a default"
      likelihood: "Medium"
      impact: "Medium"
      inherent_risk: "Medium"
      controls:
        - "The value is flagged and coerced stays false"
        - "The question date is the as-of argument"
      residual_risk: "Low"
      owner: "Translation owner"
    - id: "R6"
      risk: "A legal hold or a retention label is dropped, or a SECRET cover is missed"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Metadata and content are both read"
        - "A compound marking takes the higher tier"
        - "The hold and every retention label are kept inside the hash"
      residual_risk: "Medium"
      owner: "Information governance"
    - id: "R7"
      risk: "A small headcount identifies one person through a difference or a percentage"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "A count below 5 is not published and is not differenced"
      residual_risk: "Medium"
      owner: "Translation owner"

logging_and_audit:
  description: >
    A production deployment should log the invocation, the reviewer reference
    if it matched the synthetic pattern, the outcome, and whether ownership
    was recorded. This starter does not write an application log. Do not put
    segment text that identifies a person in an application trace.
  logged_events:
    - event: "Review returned"
      data_logged:
        - "Timestamp"
        - "Reviewer reference, if it matched the synthetic pattern"
        - "Outcome"
        - "Whether translation_owned was left false"
      retention: "Organisation's records schedule. Not set by this starter."
    - event: "Translation owned in memory"
      data_logged:
        - "Whether the content hash matched the held copy"
        - "Whether the document hashes matched the held copies"
        - "production_written false"
      retention: "Organisation's schedule. The agent does not write this event to a publishing system."
  log_destination:
    primary: "Not configured in this starter"
    note: "Choose a UK-resident store the organisation already operates."

kill_switch:
  description: "Ways to stop the agent being used. Times are the platform's, not a measured drill."
  methods:
    - method: "Turn off the Copilot Studio agent"
      action: "Set the agent to Off in Copilot Studio administration"
      time_to_effect: "Immediate once an administrator does it"
      who_can_activate: "Copilot Studio administrators"
    - method: "Remove Microsoft Foundry access"
      action: "Revoke the key or the managed-identity role used for an optional note"
      time_to_effect: "Immediate for new calls"
      who_can_activate: "Foundry or Key Vault administrators"
  escalation_contacts:
    - role: "Translation owner"
      contact: "translations@reedmarsh.example"
    - role: "Data protection officer"
      contact: "dpo@reedmarsh.example"

review:
  last_review_date: "2026-11-26"
  next_review_date: "2027-05-26"
  review_frequency: "6 months, and sooner if the cited statute text changes"
  reviewer: "The adopting organisation's translation owner and DPO. Not assigned to a named person in this starter."
  review_triggers:
    - "A change to the pinned glossary or the pinned directory"
    - "A change to the Welsh Language (Wales) Measure 2011, section 1, or to the standards regulations that were opened"
    - "A proposal to add a connector that can publish, send, or overwrite"
  related_documents:
    - name: "Experiment readme"
      path: "README.md"
    - name: "Review core"
      path: "src/review.py"
    - name: "Opened sources"
      path: "src/sources.py"
    - name: "Security and permissions"
      path: "docs/security-and-permissions.md"

atrs_mapping:
  note: >
    Not an ATRS record and not a scope decision. A body that wants a draft
    pack uses Experiment 03. The review from this starter is not an
    approval of that pack.
  mappings:
    - atrs_field: "Name"
      manifest_section: "agent.name"
    - atrs_field: "Description"
      manifest_section: "agent.description"
    - atrs_field: "Human oversight"
      manifest_section: "human_approval"

assumptions:
  description: "Items an organisation must confirm before relying on this starter."
  items:
    - id: "A1"
      assumption: "No lawful basis is asserted. Article 6 and Article 9 were not opened on 26 November 2026. Article 5 and Article 22A were not opened on that date either."
      section: "uk_gdpr"
      verify_on_deployment: true
    - id: "A2"
      assumption: "The standards schedule and later Welsh Language Standards regulations were not opened. The accessibility requirements after regulation 1 of S.I. 2018/952 were not opened. S.I. 2018/852 was opened and is revoked. Its operative citation text was not on the page and is unverified."
      section: "src/sources.py"
      verify_on_deployment: true
    - id: "A3"
      assumption: "Treating a review date on the question date as stale, including that date, is this starter's rule. It is not a statutory period."
      section: "src/review.py"
      verify_on_deployment: true
    - id: "A4"
      assumption: "The marking order is a starter rule. The Government Security Classifications Policy was not re-opened."
      section: "experiments/79-document-comparison/src/marking.py"
      verify_on_deployment: true
    - id: "A5"
      assumption: "The small-number threshold of 5 is a starter control. It is not anonymisation. The ICO anonymisation guidance was not opened."
      section: "experiments/79-document-comparison/src/mask.py"
      verify_on_deployment: true
    - id: "A6"
      assumption: "Entra Agent ID, Conditional Access for agents, Power Platform DLP as a configured policy, Microsoft Foundry prompt shields, Key Vault, Purview, and Application Insights were not opened on 26 November 2026. Treat that product behaviour as unverified."
      section: "docs/security-and-permissions.md"
      verify_on_deployment: true
    - id: "A7"
      assumption: "The harness overview was opened on 26 November 2026. It names a Microsoft Copilot harness. It does not use the words GitHub Copilot harness. The common-brief sentence that this harness is not the GitHub Copilot service was not on that page. That sentence is unverified."
      section: "docs/harness-comparison.md"
      verify_on_deployment: true
    - id: "A8"
      assumption: "Reedmarsh Council is invented. The contact addresses are not real. The glossary terms are synthetic."
      section: "fixtures/directory.json"
      verify_on_deployment: true
