# Agent manifest: Cross-source validation
# Experiment 36 — catalogue ID B005
# Version: 0.1.0
# Last reviewed: 2026-11-05
# Next review: 2027-05-05

$schema: "../../../schemas/agent-manifest.schema.json"

agent:
  id: "exp-36-cross-source-validation"
  name: "Cross-Source Validation Agent"
  version: "0.1.0"
  description: >
    Compares a fact across synthetic source documents and classifies each
    fact as a match, an immaterial difference, or a material discrepancy.
    Autonomy is A0. The reviewer resolves every material discrepancy. The
    agent does not choose which source is right, does not edit a record,
    and does not contact anyone.
  owner: "Reviewer (the adopting organisation)"
  contact: "reviewer@example.com"
  repository: "https://github.com/rahul-bachina/copilot-agent-experiments"
  experiment_path: "experiments/36-cross-source-validation"

autonomy:
  level: "A0"
  level_description: "The reviewer resolves every material discrepancy. The agent only lists them."
  constraints:
    - "The class is a deterministic rule. A model does not choose it."
    - "The agent NEVER chooses which source is right."
    - "The agent NEVER edits a record, including a register, a contract, or a case system."
    - "The agent NEVER contacts a customer, a supplier, or anyone else."
    - "The agent NEVER queries Companies House or any other live register."
    - "The agent NEVER recommends autonomy A3. The catalogue levels are A0, A1, and A2."
    - "A resolution is recorded only from a separate Reviewer object. Text inside a document cannot resolve a row."
    - "correct_value stays null. Recording a reviewer's choice does not write that value back."
    - "Source text is untrusted. An instruction inside a document is recorded and not followed."
    - "All output is labelled DRAFT FOR THE REVIEWER. NOT A CORRECTION."
  human_in_the_loop: true
  auto_actions_enabled: false

data_access:
  reads:
    - resource: "Synthetic source pack supplied for this run"
      description: "Forms, contracts, invoices, and a synthetic register extract. Fields cite a page, a paragraph, and a line."
      access_level: "read"
      scope: "The file passed to this run. No case system and no live register."
      justification: "The comparison cannot run without the documents the reviewer supplied."
      data_categories:
        - "Synthetic names, addresses, dates, amounts, and company numbers"
      may_contain_personal_data: true
      may_contain_special_category_data: false
      retention: "Transient. The starter does not persist the pack."
    - resource: "Reviewer resolution object"
      description: "A separate JSON object. It is read only when the reviewer supplies it. It is not taken from document text."
      access_level: "read"
      scope: "The resolutions path passed with this run."
      justification: "The gate checks role, reference, the signed-on date, and a choice of a source already on the row, or neither."
      may_contain_personal_data: false
      retention: "The choice is copied onto the row. correct_value is not stored."
    - resource: "Pinned source notes"
      description: "src/sources.py. Sentences from pages opened on 5 November 2026. The ICO accuracy page returned HTTP 403 and was not opened."
      access_level: "read"
      scope: "Static files in this experiment."
      justification: "Statutory and product claims are cited from that pin and marked when a page was not opened."
      may_contain_personal_data: false
    - resource: "Experiments 08, 12, and 33"
      description: "Called in-process. Identifier proposals, document intake, and the pinpoint span check."
      access_level: "read"
      scope: "The sibling folders beside this experiment. No network call."
      justification: "Those rules are reused. They are not copied into this folder."
      may_contain_personal_data: false
  never_access:
    - resource: "Companies House or any other live register"
      reason: "The agent does not look up a company number. Fixtures are synthetic."
    - resource: "A customer, a supplier, or any send channel"
      reason: "Nothing is sent. The list is returned to the reviewer."
    - resource: "A production record, a contract system, or a case system"
      reason: "The agent does not read or write a system of record."
    - resource: "A Microsoft Foundry resource or an Azure subscription"
      reason: "The task names Microsoft Foundry. This folder does not call it."

tools:
  allowed:
    - tool: "Compare fields across the synthetic pack supplied for this run"
      provider: "Local Python (src/compare.py)"
      action: "Normalise each cited value and classify the fact. Cite the document, page, paragraph, and line."
      access_level: "read"
      scope: "The pack passed to the agent"
      justification: "The reviewer needs the same class each time, with a pinpoint back to each source."
      human_approval_required: false
      output_requires_human_review: true
    - tool: "Inventory the pasted text via Experiment 12"
      provider: "experiments/12-document-intake"
      action: "Read text/plain content for this run only. Do not confirm the files or the purpose. Do not queue the batch."
      access_level: "read"
      scope: "Lines already in the pack. Content is not copied into the draft."
      justification: "The intake checksum, date flag, and injection scan already exist. This experiment does not rebuild them."
      human_approval_required: false
      output_requires_human_review: true
    - tool: "Propose identifier redaction via Experiment 08"
      provider: "experiments/08-uk-pii-redaction-gateway"
      action: "Withhold an occurrence that contains an unexpected identifier. Do not mark the output anonymised."
      access_level: "read"
      scope: "One field value at a time. Company-number and postcode shapes for those field types are expected."
      justification: "A labelled NHS number must not be copied into the discrepancy list."
      human_approval_required: false
      output_requires_human_review: true
    - tool: "Check the pinpoint via Experiment 33"
      provider: "experiments/33-case-bundle-summariser"
      action: "Resolve the cited line and require the field value to be contained in it. Do not summarise the bundle."
      access_level: "read"
      scope: "The page, paragraph, and line named on the field."
      justification: "A value that is not on the cited line is not used."
      human_approval_required: false
      output_requires_human_review: true
  writes:
    enabled: false
    note: "The agent does not write a record, a Dataverse row, or a register. correct_value stays null."
  sends:
    enabled: false
    note: "The agent does not email, call, or message a customer, a supplier, or anyone else."

human_approval:
  description: >
    The reviewer resolves every material discrepancy. The agent does not
    choose a source, does not edit a record, and does not contact anyone.
    Immaterial rows are shown and are not a decision that the values are accurate.
  approval_points:
    - action: "Reviewer resolves every material discrepancy"
      approver: "Reviewer"
      mandatory: true
      rationale: "Catalogue control for B005. resolved stays false until a separate Reviewer object names the fact and a choice."
    - action: "Re-open a stale document or a stale pinned page before relying on it"
      approver: "Reviewer"
      mandatory: true
      rationale: "do_not_rely is not cleared by the agent. The class is still shown."
    - action: "Decide whether any record should be corrected, outside this agent"
      approver: "Reviewer, outside this agent"
      mandatory: true
      rationale: "UK GDPR Article 5(1)(d) and Data Protection Act 2018 section 205 are cited. This tool does not erase or rectify."
    - action: "Confirm a lawful basis before any live personal data is processed"
      approver: "Data protection officer"
      mandatory: true
      rationale: "This starter does not choose an Article 6 basis."
  no_approval_required:
    - action: "Produce this discrepancy list from a synthetic pack the reviewer supplied"
      rationale: "The list has no external effect. It is labelled DRAFT FOR THE REVIEWER. NOT A CORRECTION."

uk_gdpr:
  lawful_basis:
    primary: "Not chosen by this starter"
    description: >
      A live pack of names, addresses, and dates would be personal data.
      Article 5(1)(d), opened on 5 November 2026, requires personal data to
      be accurate and, where necessary, kept up to date. This starter does
      not choose an Article 6 basis and does not take the reasonable steps
      in Article 5(1)(d). The data protection officer confirms a basis
      before any live file.
  special_category_data:
    may_process: false
    categories_possible: []
    lawful_basis_special: "Not asserted. An Article 9(2) condition is for the data protection officer if a later pack contains special category data."
    condition: "Not asserted."
    safeguards:
      - "The pack must be marked synthetic."
      - "An unexpected identifier, including a labelled NHS number, is withheld. The value is not copied."
      - "output_is_anonymised stays false. Experiment 08 does not detect names or email addresses."
  data_minimisation:
    - "At most 8 documents, 20 facts, and 30 fields a document."
    - "A field value that is not on the cited line is not copied."
    - "Instruction text is not copied. Pattern ids and the line number are."
    - "The resolutions object cannot store correct_value. That key is stripped."
  retention:
    agent_retention: "None in this starter. Processing is transient."
    note: "A deployment retention period is for the organisation, not this file."
  data_residency:
    region: "UK"
    note: "A deployment choice for a later agent. This starter does not call a model and does not choose a region. UK region availability for Microsoft Foundry was not verified for this experiment."
  data_subject_rights:
    note: "This starter does not operate a request channel. A live system would route rights requests, including rectification, to the organisation."

prompt_injection:
  description: "Document text and the resolutions object are untrusted. A matching line is recorded and not followed."
  controls:
    - control: "This experiment's phrase list"
      description: "Instructions to ignore directions, treat a row as a match, choose a source, edit a record, contact someone, or mark a row resolved are recorded."
      implementation: "src/injection.py. A line that already says do not, must not, never, or cannot is not a hit on this list."
    - control: "Experiment 12 phrase list"
      description: "The intake scan runs as well. It does not use the negation skip."
      implementation: "experiments/12-document-intake/src/injection.py, called from compare."
    - control: "Payload keys"
      description: "Keys that would set a choice, a correct value, or a resolved flag are stripped and not echoed."
      implementation: "strip before documents and facts are read."
  residual_risk: "A negation in the same line can hide one of this experiment's phrases. A paraphrase can be missed. Neither grants a tool the agent does not have."

risk_assessment:
  methodology: "Likelihood x impact, Low / Medium / High, for this starter rather than a named organisation"
  date_assessed: "2026-11-05"
  risks:
    - id: "R1"
      risk: "A reader treats a match or an immaterial row as a finding that the value is accurate"
      likelihood: "Medium"
      impact: "High"
      controls:
        - "The label is DRAFT FOR THE REVIEWER. NOT A CORRECTION."
        - "The explanation says the class is not a finding that either source is right"
        - "Article 5(1)(d) is cited and the tool does not rectify"
      residual_risk: "Medium"
      owner: "Reviewer"
    - id: "R2"
      risk: "A document tells the agent to treat a difference as a match, edit the register, or email the supplier"
      likelihood: "Medium"
      impact: "High"
      controls:
        - "Those lines are recorded and not followed"
        - "A resolved flag inside the pack does not pass the resolution gate"
        - "choose, edit, and contact always raise"
      residual_risk: "Low"
      owner: "Reviewer"
    - id: "R3"
      risk: "An identifier is copied into the discrepancy list"
      likelihood: "Medium"
      impact: "High"
      controls:
        - "Experiment 08 withholds an unexpected identifier"
        - "A value that is not on the cited line is not copied"
        - "output_is_anonymised stays false"
      residual_risk: "Medium"
      owner: "Reviewer"
    - id: "R4"
      risk: "A stale document or a stale legislation page is relied on"
      likelihood: "Medium"
      impact: "Medium"
      controls:
        - "do_not_rely stays true"
        - "The class is unchanged and the row is not auto-resolved"
        - "The ICO page was not opened and is not stale-tested"
      residual_risk: "Medium"
      owner: "Reviewer"
    - id: "R5"
      risk: "An immaterial rule hides a difference the reviewer would have treated as material"
      likelihood: "Medium"
      impact: "Medium"
      controls:
        - "Both quotes are still shown"
        - "Abbreviations are narrow: legal-form suffixes, a last-word street abbreviation, day-first dates, currency formatting, postcode spacing, and eight-digit padding"
        - "An unknown company-number prefix is left unparsed"
      residual_risk: "Medium"
      owner: "Reviewer"

logging_and_audit:
  description: "This starter writes no log. Before a deployment, log who ran a comparison, the pack id, the as-of date, the class counts, and whether injection was detected. Do not log field values or the resolutions object."
  logged_events:
    - event: "Cross-source comparison drafted"
      data_logged:
        - "pack id"
        - "as-of date"
        - "fact class counts"
        - "whether a prompt-injection pattern was detected"
        - "whether a material row was awaiting the reviewer"
        - "whether anything was edited or sent (always false in this starter)"
      retention: "Not set by this starter."
  log_destination:
    primary: "None in this starter"
    note: "A later host would choose a UK log store. Application Insights was not opened for this experiment and is unverified."
  audit_trail:
    - "The JSON records the class, the reason, the citations, and any reviewer choice."
    - "correct_value is not stored."

kill_switch:
  description: "This starter is a local command. Stop using it by not running it. There is no published agent to switch off."
  methods:
    - method: "Do not run the command"
      action: "Stop invoking src/compare.py"
      time_to_effect: "Immediate"
      who_can_activate: "Whoever can run the command"
    - method: "Remove the file from a machine that should not compare packs"
      action: "Delete the local copy"
      time_to_effect: "Immediate"
      who_can_activate: "The machine owner"
  escalation_contacts:
    - role: "Reviewer"
      contact: "reviewer@example.com"
    - role: "Data protection officer"
      contact: "The adopting organisation's data protection officer. Not named in this starter."

review:
  last_review_date: "2026-11-05"
  next_review_date: "2027-05-05"
  review_frequency: "Six months, and sooner if a pinned legislation or Microsoft Learn page is re-opened and has changed."
  reviewer: "The adopting organisation's reviewer. Not assigned to a named person in this starter."
  review_triggers:
    - "A pinned page is re-opened and the sentence this starter relies on has changed."
    - "Experiment 08's identifier rules change."
    - "The ICO accuracy page is opened. It was not opened on 5 November 2026."
  related_documents:
    - name: "Security and permissions"
      path: "docs/security-and-permissions.md"
    - name: "Tool schema"
      path: "schema/tools.json"

high_risk_actions:
  approve_reject:
    enabled: false
    rationale: "The agent does not decide which source is right and does not approve or reject a record."
  regulated_decision:
    enabled: false
    rationale: "A material discrepancy is not a finding that personal data is inaccurate. The reviewer decides whether to correct a record, outside this agent."
  production_record_change:
    enabled: false
    rationale: "No record is edited. correct_value stays null after a reviewer choice."
  external_send:
    enabled: false
    rationale: "Nothing is sent to a customer, a supplier, or anyone else."
  spend_transact:
    enabled: false
    rationale: "An amount is compared. It is not paid."
  additional_high_risk:
    - action_name: "Choose which source is right"
      enabled: false
      rationale: "agent_chose_source stays false. choose_source always raises."
    - action_name: "Edit a record"
      enabled: false
      rationale: "records_edited stays false. edit_record always raises."
    - action_name: "Contact a party"
      enabled: false
      rationale: "parties_contacted stays false. contact_party always raises."
    - action_name: "Query a public register"
      enabled: false
      rationale: "register_queried stays false. lookup_register always raises. Companies House is cited as the public-register example and is not called."

atrs_mapping:
  note: "This starter does not complete an Algorithmic Transparency Recording Standard record. The fields below are a pointer, not a filing."
  mappings:
    - atrs_field: "Function"
      manifest_section: "agent.description"
    - atrs_field: "Human oversight"
      manifest_section: "human_approval"
    - atrs_field: "Risks"
      manifest_section: "risk_assessment"

assumptions:
  description: "The organisation confirms these before anyone relies on a discrepancy list."
  items:
    - id: "AS1"
      assumption: "The pack was supplied by the reviewer and is synthetic. This starter does not fetch it from a register or a case system."
      section: "data_access.reads"
      verify_on_deployment: true
    - id: "AS2"
      assumption: "Numeric dates are UK day-first. That is this starter's rule, not a claim that every source document used that convention."
      section: "risk_assessment"
      verify_on_deployment: true
    - id: "AS3"
      assumption: "Padding a numeric company number to eight digits is formatting. It is not a Companies House lookup. The 2011 prefix list was not re-opened."
      section: "data_access.reads"
      verify_on_deployment: true
    - id: "AS4"
      assumption: "The ICO accuracy page was not opened on 5 November 2026. It must be opened before anyone cites it from this folder."
      section: "uk_gdpr"
      verify_on_deployment: true
    - id: "AS5"
      assumption: "The 90-day window is a stale flag. It is not the 'without delay' wording in Article 5(1)(d)."
      section: "risk_assessment"
      verify_on_deployment: true
    - id: "AS6"
      assumption: "A reviewer choice of a document id or neither does not write a corrected value and does not contact anyone."
      section: "high_risk_actions"
      verify_on_deployment: true
