# Agent manifest: Conflict-of-Interest Intake
# Experiment 70 — catalogue ID L005
# Version: 0.1.0
# Last reviewed: 2026-11-20
# Next review: 2027-05-20

$schema: "../../../schemas/agent-manifest.schema.json"

agent:
  id: "exp-70-conflict-of-interest-intake"
  name: "Conflict-of-Interest Intake"
  version: "0.1.0"
  description: >
    Drafts a structured declaration from one synthetic free-text note, a
    pinned supplier list, a pinned procurement register, and a pinned
    directory. Autonomy A1. The declarant confirms the exact draft before it
    is written to a synthetic staging store. The ethics or procurement team
    decides disposition and mitigation. The agent does not decide whether a
    conflict exists, and it does not clear, exclude, approve, or send.
  owner: "Ethics team"
  contact: "ethics@ashcombe.example.gov.uk"
  repository: "https://github.com/rahul-bachina/copilot-agent-experiments"
  experiment_path: "experiments/70-conflict-of-interest-intake"

autonomy:
  level: "A1"
  level_description: "The assistant drafts a structured declaration and writes it to a synthetic staging store only after the declarant confirms that exact draft. The ethics or procurement team decides every disposition and mitigation."
  constraints:
    - "The ethics or procurement team decides whether a conflict exists. The agent does not."
    - "The agent NEVER clears, excludes, or approves a person or a supplier"
    - "The agent NEVER sends a declaration"
    - "The agent NEVER treats approval text inside the declaration as the confirm step"
    - "A self-declared role or clearance in the declaration is not the directory"
  human_in_the_loop: true
  auto_actions_enabled: false

data_access:
  reads:
    - resource: "Synthetic declaration"
      description: "One free-text declaration. Samples are synthetic. Instructions inside the text are not followed."
      access_level: "read"
      scope: "One declaration per invocation. The body is not copied into the result."
      justification: "The draft has to structure the interest the member of staff described."
      data_categories:
        - "Interest description"
        - "Retention labels and legal-hold flags"
      may_contain_personal_data: true
      may_contain_special_category_data: true
      retention: "The confirmed draft is held in the synthetic staging store for the process. This starter does not set a statutory retention period."
    - resource: "Synthetic supplier list"
      description: "Pinned supplier names and ids. A list inside the request is not this list."
      access_level: "read"
      scope: "The pinned file."
      justification: "A party is a supplier id from the pinned list, or it is missing."
      may_contain_personal_data: false
    - resource: "Synthetic procurement register"
      description: "Pinned procurements, with status and dates. A register inside the request is not this register."
      access_level: "read"
      scope: "The pinned file. Live means live on the question date."
      justification: "A potential link is a comparison with the pinned register, not a finding that a conflict exists."
      may_contain_personal_data: false
    - resource: "Synthetic directory"
      description: "Staff, ethics, procurement, and guests. The declaration does not set the role or the clearance."
      access_level: "read"
      scope: "One declarant reference, and the approver on a later step."
      justification: "Only the directory declarant can confirm. Only ethics or procurement can record a disposition."
      may_contain_personal_data: true
    - resource: "Separate confirm object"
      description: "The only object that can confirm this declaration hash."
      access_level: "read"
      scope: "One confirm object, bound to that hash."
      justification: "Approval inside the declaration is not that step."
      may_contain_personal_data: false
    - resource: "Experiment 08 UK identifier redaction"
      description: "propose() on the declaration. Reversible stays false. The redacted text is not copied."
      access_level: "read"
      scope: "A count of findings. Matched values are not stored."
      justification: "A pasted identifier is counted before a draft is shown."
      may_contain_personal_data: true
    - resource: "Experiment 12 document intake"
      description: "intake() on the declaration as one text file. Files are not confirmed and no purpose is confirmed."
      access_level: "read"
      scope: "One synthetic batch. The intake draft is not copied."
      justification: "The declaration is untrusted text. Intake records that, and this starter does not confirm the file."
      may_contain_personal_data: true
    - resource: "Experiment 32 employee case intake patterns"
      description: "keyword_hits, special_category_indicators, and scan_narrative. draft_case() is not called."
      access_level: "read"
      scope: "Category ids and instruction signals. The narrative is not copied."
      justification: "A grievance or a protected disclosure uses the same negation rule as this starter. A denied phrase is not an inclusion."
      may_contain_personal_data: false

  never_access:
    - resource: "A live procurement register, a supplier mailbox, or an HR system"
      reason: "The text and the pinned files are what this starter reads. It does not send or write production."
    - resource: "A self-declared role, guest status, or clearance in the declaration"
      reason: "The directory is the source. The text is recorded as ignored."
    - resource: "Declaration text above the directory clearance"
      reason: "Parties and links are not copied. The higher marking, the legal hold, and the retention labels are kept."
    - resource: "A caller-supplied supplier list, register, directory, or criteria object"
      reason: "Differences are flagged. Matching uses the pinned files."

tools:
  allowed:
    - tool: "Draft declaration"
      provider: "Local Python (draft_declaration)"
      action: "Return a structured declaration for one synthetic note"
      access_level: "read"
      scope: "One synthetic request. No network. No model."
      justification: "Interest type, parties, dates, and links are deterministic. A language model must not decide that a conflict exists."
      human_approval_required: false
      output_requires_human_review: true
    - tool: "Confirm declaration"
      provider: "Local Python (confirm_declaration)"
      action: "Write the confirmed draft to the synthetic staging store"
      access_level: "write"
      scope: "The draft and a separate confirm object, bound to the declaration hash."
      justification: "The catalogue checkpoint is that the declarant confirms the draft before it is stored."
      human_approval_required: true
      output_requires_human_review: true
    - tool: "Record disposition"
      provider: "Local Python (record_disposition)"
      action: "Store the ethics or procurement officer's own words against the staged hash"
      access_level: "write"
      scope: "One staged row. The words are not interpreted."
      justification: "Disposition and mitigation are the team's. The agent does not apply them."
      human_approval_required: true
      output_requires_human_review: true
    - tool: "Record route seen"
      provider: "Local Python (record_route_seen)"
      action: "Record that ethics or procurement has seen a human route"
      access_level: "read"
      scope: "The draft and a separate seen object. Nothing is staged."
      justification: "Distress, a disclosure, a grievance, or special-category detail is not a routine declaration."
      human_approval_required: true
      output_requires_human_review: true
    - tool: "Text note"
      provider: "Microsoft Foundry"
      action: "Turn the JSON into a short note, using only fields already in the JSON"
      access_level: "read"
      scope: "The JSON for this run"
      justification: "Optional narrative. The hashes, the links, and the empty or recorded approval stay in the Python core."
      human_approval_required: false
      output_requires_human_review: true

  writes:
    enabled: true
    note: >
      The only write is a row in the in-memory synthetic staging store, and
      only after confirm_declaration matches the declarant and the declaration
      hash. record_disposition updates that row with the officer's words and
      does not apply them. Neither write is a production procurement register.
    allowed_writes:
      - tool: "Synthetic staging row"
        provider: "Local Python (confirm_declaration, record_disposition)"
        action: "Keep the confirmed draft, then the officer's uninterpreted text"
        access_level: "write"
        scope: "The synthetic store in this process. production_written stays false."
        justification: "The declarant confirms the draft before it is stored. The team records disposition afterwards."
        human_approval_required: true
        output_requires_human_review: true

  sends:
    enabled: false
    note: >
      No sends. Confirming a draft does not email the supplier, the declarant,
      or the ethics team.

high_risk_actions:
  approve_reject:
    enabled: false
    rationale: >
      The agent does not clear, exclude, or approve a person or a supplier.
      A confirm object records that the declarant has seen this hash. A
      sentence in the declaration cannot set it.
  regulated_decision:
    enabled: false
    rationale: >
      The agent does not decide that a conflict exists, that section 81, 82,
      or 83 of the Procurement Act 2023 was met, or that a supplier is an
      excluded supplier. It does not decide that UK GDPR Article 5 was met.
  production_record_change:
    enabled: false
    rationale: "The staging row is in-memory JSON. It is not a write to a procurement register or an HR system."
  external_send:
    enabled: false
    rationale: "The agent does not send the declaration."
  spend_transact:
    enabled: false
    rationale: "There is no payment. An amount is information for the ethics team."
  additional_high_risk:
    - enabled: false
      action_name: "Decide that a conflict exists, clear, exclude, approve, or send"
      rationale: "Those functions raise. conflict_exists stays null. The flags stay false."
    - enabled: false
      action_name: "Treat a declaration sentence as the declarant's confirmation"
      rationale: "human_approval stays null until confirm_declaration succeeds for the directory declarant and the exact hash."
    - enabled: false
      action_name: "Apply a biased criterion or mark a carve-out acceptable"
      rationale: "criteria_applied and marked_acceptable stay false."
    - enabled: false
      action_name: "Drop a legal hold or a retention label"
      rationale: "A hold and every retention label are copied onto the result and the staged row."

human_approval:
  description: >
    The declarant confirms the draft on a separate object, bound to the
    declaration hash. That writes the synthetic row. An ethics or procurement
    officer records disposition on a later object, bound to the declaration
    hash and the staged hash. Seeing a distress or disclosure route does not
    decide it. Approval text inside the declaration is not a step.

  approval_points:
    - action: "See a distress, disclosure, grievance, or special-category route"
      approver: "Ethics or procurement"
      mandatory: true
      rationale: "record_route_seen accepts the directory officer and the reason code. It does not stage the declaration."
    - action: "Confirm this declaration"
      approver: "Declarant"
      mandatory: true
      rationale: "confirm_declaration accepts the directory member of staff only when the declaration hash matches and the item is declaration-confirm."
    - action: "Acknowledge unverified statute pins"
      approver: "Declarant"
      mandatory: true
      rationale: "pins_seen must be the boolean true. Sections 81 to 83 and Articles 5 and 9 had no currency stamp in the extract."
    - action: "Acknowledge a stale register or a caller source that differs"
      approver: "Declarant"
      mandatory: true
      rationale: "register_seen and sources_seen must be the boolean true when those flags are set. A string is not coerced."
    - action: "Record disposition and mitigation"
      approver: "Ethics or procurement"
      mandatory: true
      rationale: "record_disposition stores the officer's words. It does not clear, exclude, approve, or send."
    - action: "Clear, exclude, approve, or send"
      approver: "Nobody"
      mandatory: true
      rationale: "Those actions are not tools. The flags stay false after a confirm step and after a disposition."

  no_approval_required:
    - action: "Read the draft"
      rationale: "Reading the draft has no external effect. human_approval stays null and nothing is staged."
    - action: "Re-run the same declaration"
      rationale: "No write and no send until the confirm object matches. The same inputs and the same question date produce the same JSON."

uk_gdpr:
  lawful_basis:
    primary: "Not asserted"
    description: >
      This starter does not decide the controller's lawful basis. Article 6
      was not opened on 20 November 2026. Article 5(1)(c) was opened as
      context for minimisation. It is not a finding that the principle was met.
    secondary: "None asserted."
  special_category_data:
    may_process: true
    categories_possible:
      - "Political opinions, health, religion or belief, trade union membership, ethnic origin, or sex life or sexual orientation, if a declarant pastes them"
    lawful_basis_special: "Not asserted. Article 9(2) was not applied. A family relationship is not in the Article 9(1) list that was opened."
    safeguards:
      - "A political opinion or other Article 9(1) detail is routed to a person. The detail is not copied."
      - "A family link keeps a relationship label only. The relative's name is not copied."
      - "Phone numbers, email addresses, dates of birth, postal addresses, personal names, and UK identifiers are masked or counted. The output is not described as anonymised."
      - "Samples in this repository are synthetic."
      - "No solely automated decision about a person or a supplier. The sample does not decide that a conflict exists."
  data_minimisation:
    - "The declaration body is not copied into the result."
    - "Parties are supplier ids. Relative names and political opinions are not stored."
    - "output is not described as anonymised. described_as_anonymised stays false."
  retention:
    agent_retention: "The synthetic store lives for the process. This starter does not set a disposal date."
    note: "A retention label and a legal hold on the declaration are kept. They are not a decision to dispose."
  data_residency:
    region: "UK"
    note: "A production Microsoft Foundry deployment should use UK South or UK West. This repository cannot enforce that."
  data_subject_rights:
    note: "The agent does not handle access, erasure, or objection requests. Those go through the organisation's privacy process."

prompt_injection:
  description: >
    Declaration text and a caller-supplied register are untrusted. They may
    say the ethics team has approved, that a person should be cleared, or
    that a label should be stripped. The core does not read the network.
  controls:
    - control: "Instruction sentences are not followed"
      description: "Clear, exclude, send, and pretend-approval sentences are recorded. followed stays false."
    - control: "Negation is not a positive match"
      description: "A phrase after not true that, or after a short not, in the same sentence, is not an inclusion."
    - control: "Approval is a separate object"
      description: "Approval keys on the request are stripped. human_approval stays null until confirm_declaration succeeds."
    - control: "Pinned sources win"
      description: "A supplier list, register, directory, or criteria object in the request is compared and not used for matching."
    - control: "No decide, clear, exclude, approve, or send tool"
      description: "Those functions raise DeclarationForbidden."
  residual_risk: >
    A manipulated model can still narrate a misleading note. The ethics team
    is the control. Nothing is sent even if the note is wrong. A paraphrase
    that uses none of the cue stems is not flagged.

risk_assessment:
  methodology: "Likelihood x impact, Low / Medium / High, for this starter rather than a named organisation"
  date_assessed: "2026-11-20"
  risks:
    - id: "R1"
      risk: "A sentence in the declaration is treated as the declarant's confirmation or as a decision that no conflict exists"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Those words are recorded and not followed"
        - "confirm_declaration reads only the separate confirm object and the declaration hash"
      residual_risk: "Low"
      owner: "Ethics team"
    - id: "R2"
      risk: "The agent decides that a conflict exists, or clears, excludes, approves, or sends"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Those functions raise"
        - "conflict_exists stays null after a confirm step and after a disposition"
      residual_risk: "Low"
      owner: "Ethics team"
    - id: "R3"
      risk: "A negated interest is treated as included, or a missing procurement is invented"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Negation is applied before a supplier or an interest counts"
        - "An unknown procurement id is listed as unknown and is not added to the pinned register"
      residual_risk: "Medium"
      owner: "Ethics team"
    - id: "R4"
      risk: "Special-category detail or a relative's name is copied into the draft"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "The body is not copied"
        - "Article 9(1) detail is a route. A family link keeps a label only"
      residual_risk: "Medium"
      owner: "Data protection officer"
    - id: "R5"
      risk: "An unreadable amount or date is coerced to zero or to today, or a caller register is trusted"
      likelihood: "Medium"
      impact: "Medium"
      inherent_risk: "Medium"
      controls:
        - "The value is flagged and coerced stays false"
        - "Matching uses the pinned files"
      residual_risk: "Low"
      owner: "Ethics team"
    - id: "R6"
      risk: "A legal hold or a retention label is dropped, or a SECRET cover is missed"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Metadata and content are both read"
        - "A compound marking takes the higher tier"
        - "The hold and every retention label are kept on the staged row"
      residual_risk: "Medium"
      owner: "Information governance"

logging_and_audit:
  description: >
    A production deployment should log the invocation, the declarant reference
    if it matched the synthetic pattern, the outcome, and whether a confirm
    step was recorded. This starter does not write an application log.
    Do not put the declaration or a quote in an application trace.
  logged_events:
    - event: "Draft returned"
      data_logged:
        - "Timestamp"
        - "Declarant reference, if it matched the synthetic pattern"
        - "Outcome"
        - "Whether human_approval was left null"
      retention: "Organisation's records schedule. Not set by this starter."
    - event: "Synthetic row written"
      data_logged:
        - "Whether the declaration hash matched"
        - "production_written false"
      retention: "Organisation's schedule. The agent does not write this event to a procurement system."
  log_destination:
    primary: "Not configured in this starter"
    note: "Choose a UK-resident store the organisation already operates."

kill_switch:
  description: "Ways to stop the agent being used. Times are the platform's, not a measured drill."
  methods:
    - method: "Turn off the Copilot Studio agent"
      action: "Set the agent to Off in Copilot Studio administration"
      time_to_effect: "Immediate once an administrator does it"
      who_can_activate: "Copilot Studio administrators"
    - method: "Remove Microsoft Foundry access"
      action: "Revoke the key or the managed-identity role used for an optional note"
      time_to_effect: "Immediate for new calls"
      who_can_activate: "Foundry or Key Vault administrators"
  escalation_contacts:
    - role: "Ethics team"
      contact: "ethics@ashcombe.example.gov.uk"
    - role: "Data protection officer"
      contact: "dpo@ashcombe.example.gov.uk"

review:
  last_review_date: "2026-11-20"
  next_review_date: "2027-05-20"
  review_frequency: "6 months, and sooner if the pinned legislation or the register changes"
  reviewer: "The adopting organisation's ethics lead and DPO. Not assigned to a named person in this starter."
  review_triggers:
    - "A change to Procurement Act 2023 sections 81, 82, or 83, or to UK GDPR Articles 5 or 9"
    - "A proposal to add a connector that can clear, exclude, approve, or send"
  related_documents:
    - name: "Experiment readme"
      path: "README.md"
    - name: "Declaration core"
      path: "src/declaration.py"
    - name: "Pinned sources"
      path: "src/sources.py"
    - name: "Security and permissions"
      path: "docs/security-and-permissions.md"

atrs_mapping:
  note: >
    Not an ATRS record and not a scope decision. A body that wants a draft
    pack uses Experiment 03. The declaration from this starter is not an
    approval of that pack.
  mappings:
    - atrs_field: "Name"
      manifest_section: "agent.name"
    - atrs_field: "Description"
      manifest_section: "agent.description"
    - atrs_field: "Human oversight"
      manifest_section: "human_approval"

assumptions:
  description: "Items an organisation must confirm before relying on this starter."
  items:
    - id: "A1"
      assumption: "No lawful basis is asserted. Article 6 was not opened on 20 November 2026. Article 9(2) is not applied."
      section: "uk_gdpr"
      verify_on_deployment: true
    - id: "A2"
      assumption: "Procurement Act 2023 sections 81, 82, and 83, and UK GDPR Articles 5 and 9, did not show an 'up to date on or before' date in the extract opened on 20 November 2026. Their currency is unverified."
      section: "src/sources.py"
      verify_on_deployment: true
    - id: "A3"
      assumption: "Sections 19, 41, 43, 55, and 80 of the Procurement Act 2023 were not opened. Section 82(4) is quoted as context and is not applied."
      section: "src/sources.py"
      verify_on_deployment: true
    - id: "A4"
      assumption: "A family relationship is not in the Article 9(1) list that was opened. Political opinions are. This starter does not decide that an Article 9 condition was met."
      section: "src/sources.py"
      verify_on_deployment: true
    - id: "A5"
      assumption: "Treating a register as stale on its review-due date is this starter's rule. It is not a statutory period. Experiment 12's document window is that experiment's rule."
      section: "src/declaration.py"
      verify_on_deployment: true
    - id: "A6"
      assumption: "The marking order is a starter rule. The Government Security Classifications Policy was not re-opened."
      section: "src/marking.py"
      verify_on_deployment: true
    - id: "A7"
      assumption: "The small-number threshold of 5 is a starter control. It is not anonymisation. The ICO anonymisation guidance was not opened."
      section: "fixtures/criteria.json"
      verify_on_deployment: true
    - id: "A8"
      assumption: "Entra Agent ID, Conditional Access for agents, Power Platform DLP as a configured policy, Microsoft Foundry prompt shields, Key Vault, Purview, and Application Insights were not opened on 20 November 2026. Treat that product behaviour as unverified."
      section: "docs/security-and-permissions.md"
      verify_on_deployment: true
    - id: "A9"
      assumption: "The harness overview opened on 20 November 2026 names a Microsoft Copilot harness. It does not use the words GitHub Copilot harness. Older wording that the harness is not the GitHub Copilot service is unverified against that page."
      section: "docs/harness-comparison.md"
      verify_on_deployment: true
    - id: "A10"
      assumption: "Contact addresses on ashcombe.example.gov.uk are placeholders. Ashcombe Borough Council, Northbridge Supplies Ltd, and the other supplier names are invented."
      section: "kill_switch.escalation_contacts"
      verify_on_deployment: true
