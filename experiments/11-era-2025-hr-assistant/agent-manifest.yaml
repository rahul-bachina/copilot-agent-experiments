# Agent manifest: Employment Rights Act 2025 HR assistant
# Experiment 11 — catalogue ID UK03
# Version: 0.1.0
# Last reviewed: 2026-10-27
# Next review: 2027-04-27

$schema: "../../../schemas/agent-manifest.schema.json"

# =============================================================================
# AGENT IDENTITY
# =============================================================================
agent:
  id: "exp-11-era-2025-hr-assistant"
  name: "Employment Rights Act 2025 HR Assistant"
  version: "0.1.0"
  description: >
    Helps an HR lead at a UK employer read one synthetic pack against pinned
    commencement dates for the Equality Act 2010 preventative duty and the
    Employment Rights Act 2025 harassment, whistleblowing, tribunal-limit, and
    unfair-dismissal changes. Autonomy A1. The agent drafts a gap note, a
    blank policy skeleton, and an optional handbook quotation or anonymised
    triage summary. An HR lead decides. The agent never decides compliance,
    harassment, discipline, or dismissal, never changes a personnel record,
    and never sends a message.
  owner: "People and culture"
  contact: "era-hr-assistant@example.com"
  repository: "https://github.com/rahul-bachina/copilot-agent-experiments"
  experiment_path: "experiments/11-era-2025-hr-assistant"

# =============================================================================
# AUTONOMY LEVEL
# =============================================================================
autonomy:
  level: "A1"
  level_description: "Human approves everything"
  constraints:
    - "An HR lead decides what to do with the draft. The agent only prepares it."
    - "The agent NEVER decides that the employer has taken or failed to take reasonable steps or all reasonable steps"
    - "The agent NEVER decides that harassment occurred or that a third party was permitted to harass an employee"
    - "The agent NEVER makes a disciplinary decision, issues a warning, suspends, or dismisses"
    - "The agent NEVER publishes a policy or changes a handbook"
    - "The agent NEVER writes a personnel, grievance, or case record"
    - "The agent NEVER sends a message to a worker, Acas, a tribunal, a union, or anyone else"
    - "In-force dates and the empty decision come from the deterministic core in src/review.py, not from model output"
    - "All output is advisory and is marked draft for HR review"
  human_in_the_loop: true
  auto_actions_enabled: false

# =============================================================================
# DATA ACCESS
# =============================================================================
data_access:
  reads:
    - resource: "One synthetic or employer-supplied pack"
      description: "A single pack the HR lead pastes for this run. Samples in this repository are synthetic and anonymised."
      access_level: "read"
      scope: "One employer pack per invocation. No browsing of the HR system."
      justification: "The draft cannot list recorded evidence without the pack the HR lead has supplied"
      data_categories:
        - "Employer name, jurisdiction, sector, and a worker count"
        - "Evidence flags the employer has typed"
        - "Approved handbook excerpts"
        - "An anonymised incident narrative, if supplied"
      may_contain_personal_data: true
      may_contain_special_category_data: false
      retention: "Transient. The starter does not persist the pack."

    - resource: "HR-confirmed inputs"
      description: "As-of date and the stale thresholds"
      access_level: "read"
      scope: "Fields the HR lead types for this run"
      justification: "Commencement is a date comparison. The core does not infer the day."
      may_contain_personal_data: false

    - resource: "Pinned source catalogue"
      description: "Static citations in src/sources.py. The core does not download them."
      access_level: "read"
      scope: "Files in this experiment"
      justification: "Every statutory sentence the core uses is pinned, with the date it was opened"
      may_contain_personal_data: false

  never_access:
    - resource: "The HR system, payroll, and personnel files"
      reason: "The agent does not look up a worker and does not change a record."
    - resource: "Grievance, disciplinary, and case-management systems"
      reason: "The agent does not open, update, or close a case."
    - resource: "Mailboxes, Teams chats, and the Acas helpline"
      reason: "The agent does not send a message and does not contact Acas."
    - resource: "Employment tribunal systems and the Equality and Human Rights Commission"
      reason: "The agent does not start a claim and does not report an employer."
    - resource: "A named worker's start date, contract, or disciplinary history"
      reason: "The qualifying period is stated as a commencement fact. It is not applied to a person."
    - resource: "Northern Ireland employment legislation"
      reason: "The sections that were opened are marked England and Wales and Scotland. This starter does not state Northern Ireland law."

# =============================================================================
# TOOLS AND ACTIONS
# =============================================================================
tools:
  allowed:
    - tool: "Employer pack review"
      provider: "Local Python (src/review.py)"
      action: "Compare one pack with the pinned commencement catalogue and list recorded evidence"
      access_level: "read"
      scope: "One pack. No network. No model."
      justification: "Whether a section is in force is a date comparison. A language model must not produce it."
      human_approval_required: false
      output_requires_human_review: true

    - tool: "Text analysis"
      provider: "Microsoft Foundry"
      action: "Turn the JSON into a short brief, using only fields already in the JSON"
      access_level: "read"
      scope: "The JSON for this run"
      justification: "Optional narrative. Citations, in-force flags, and the empty decision stay in the Python core."
      human_approval_required: false
      output_requires_human_review: true

    - tool: "Output check"
      provider: "Local Python"
      action: "Reject a result that records a compliance conclusion, a disciplinary decision, a send, or a write"
      access_level: "read"
      scope: "The draft for this run"
      justification: "A draft that decides, publishes, writes, or sends is not a valid result"
      human_approval_required: false
      output_requires_human_review: false

  writes:
    enabled: false
    note: >
      No writes. The draft is returned to the HR lead. Filing it, if they
      choose to, is done by a person in the employer's own system. A training
      attestation is not recorded by this starter.

  sends:
    enabled: false
    note: >
      No sends. Telling a worker about Acas, writing to a union, or
      acknowledging a report is a person's step. The agent does not contact anyone.

# =============================================================================
# HIGH-RISK ACTIONS
# =============================================================================
high_risk_actions:
  approve_reject:
    enabled: false
    rationale: >
      The agent does not uphold or reject a grievance, and it does not
      issue a disciplinary outcome. Those are the employer's decision.
      The output leaves hr_decision and disciplinary_decision empty.

  regulated_decision:
    enabled: false
    rationale: >
      Whether the employer took reasonable steps, or all reasonable steps,
      is a legal judgement. Whether harassment occurred, whether a
      disclosure was protected, and whether a dismissal was fair are the
      same. The agent states commencement and recorded evidence. It does
      not decide.

  production_record_change:
    enabled: false
    rationale: >
      No create or update against a personnel file, a policy library, a
      grievance, or any other production record.

  external_send:
    enabled: false
    rationale: >
      The agent does not contact a worker, an alleged harasser, Acas, a
      tribunal, a trade union, or the Equality and Human Rights Commission.

  spend_transact:
    enabled: false
    rationale: "No settlement is offered and no compensation is calculated or paid."

  additional_high_risk:
    - enabled: false
      action_name: "Publish or amend a policy"
      rationale: "HR owns policy changes. The skeleton has blank headings. The agent does not publish it."
    - enabled: false
      action_name: "Make a disciplinary decision or dismiss"
      rationale: "Catalogue checkpoint for UK03. There is no tool that warns, suspends, or dismisses."
    - enabled: false
      action_name: "Conclude that all reasonable steps were taken"
      rationale: "Section 40B regulations specifying steps were not opened. Acas examples are not that list. compliance_conclusion stays null."

# =============================================================================
# HUMAN APPROVAL
# =============================================================================
human_approval:
  description: >
    The HR lead decides what the draft means for the organisation. The
    agent has no path that acts on its own note. Approving a sentence in
    the chat does not publish a policy, write a record, or decide a case.

  approval_points:
    - action: "Treat the draft as the employer's assessment"
      approver: "HR lead"
      mandatory: true
      rationale: "Catalogue checkpoint for UK03. The core leaves hr_decision and compliance_conclusion null."

    - action: "Publish or change a policy, handbook, or intranet page"
      approver: "HR lead"
      mandatory: true
      rationale: "The skeleton is headings only. Publishing is outside the agent."

    - action: "Complete the risk-assessment ratings"
      approver: "HR lead"
      mandatory: true
      rationale: "Likelihood, impact, and residual risk are null. The agent does not set them."

    - action: "Act on a confidential triage summary"
      approver: "Named HR role"
      mandatory: true
      rationale: "The route is HR review. The agent does not close the report or decide misconduct."

    - action: "Reply to a worker, including with a handbook quotation"
      approver: "HR lead or the policy owner"
      mandatory: true
      rationale: "The agent may quote an already approved excerpt in the draft. It does not send the reply."

    - action: "Rely on the checklist after a pinned source is marked stale"
      approver: "HR lead"
      mandatory: true
      rationale: "The core does not download legislation.gov.uk, GOV.UK, or Acas."

    - action: "Rely on a policy excerpt after its review date is marked stale"
      approver: "Policy owner"
      mandatory: true
      rationale: "A stale excerpt can be shown and is marked not to be relied on."

    - action: "Take a disciplinary step, suspend, or dismiss"
      approver: "A person under the employer's own process"
      mandatory: true
      rationale: "Outside the agent, including after a draft is accepted."

    - action: "Contact Acas, a tribunal, a union, or the worker"
      approver: "HR lead"
      mandatory: true
      rationale: "Outside the agent. The draft may name Acas as a signpost for a person to mention."

  no_approval_required:
    - action: "View the draft"
      rationale: "Reading a draft has no external effect"
    - action: "Re-run the same pack"
      rationale: "No write and no send. The same inputs produce the same JSON."

# =============================================================================
# UK GDPR
# =============================================================================
uk_gdpr:
  lawful_basis:
    primary: "Not asserted"
    description: >
      This starter does not decide the employer's lawful basis. A candidate
      for the employer to confirm, before any production use, is Article
      6(1)(c), legal obligation, for the preventative duty in section 40A,
      or Article 6(1)(f), legitimate interests, for an internal draft. Do
      not copy the public-task basis from Experiment 01. The employer confirms.
    secondary: "Article 6(1)(f) may be relevant for an internal draft. The employer confirms it."

  special_category_data:
    may_process: false
    categories_possible: []
    lawful_basis_special: "Not asserted. A live sexual-harassment report may involve special-category data. This starter refuses a report that is not marked anonymised and does not assert an Article 9 basis."
    safeguards:
      - "Samples are synthetic and use role labels, not named people"
      - "A report that is not marked anonymised is refused, and the refusal does not echo the narrative"
      - "Nothing is written to a personnel record"
      - "No solely automated decision under the UK GDPR, including the safeguards inserted by the Data (Use and Access) Act 2025"

  data_minimisation:
    - "The core reads the pack. It does not retrieve a personnel file."
    - "Worker count and sector are recorded and are not used to lower a duty."
    - "Narratives and questions are scanned for instructions aimed at the agent. They are not stored."

  retention:
    agent_retention: "None in this starter. Processing is transient."
    note: "The employer's own retention for a grievance or a policy file applies to whatever a person then saves. That schedule is not set here."

  data_residency:
    region: "UK"
    note: "A production Microsoft Foundry deployment should use UK South or UK West. This repository cannot enforce that."

  data_subject_rights:
    note: >
      The agent does not handle access, erasure, or objection requests.
      Those go through the employer's privacy process.

# =============================================================================
# PROMPT INJECTION
# =============================================================================
prompt_injection:
  description: >
    Incident narratives, handbook excerpts, and questions are untrusted.
    They may tell the model to dismiss a worker, email the complainant,
    update a personnel record, or mark the employer compliant. The core
    does not read the network. The model is not given a tool that can
    decide, publish, write, or send.

  controls:
    - control: "Instructions separated from the pack"
      description: "Narratives and questions are data. An instruction is recorded and is not followed."
    - control: "Deterministic commencement"
      description: "In-force dates, the empty decision, and the refusal to conclude compliance are computed in Python."
    - control: "Prohibited keys are ignored"
      description: "A payload key that purports to set the HR decision, a dismissal, or a send is stripped and flagged."
    - control: "No tools with side effects"
      description: "Writes and sends are disabled in this manifest."
    - control: "Human decision"
      description: "Policy changes, risk ratings, and any case step remain outside the agent."

  residual_risk: >
    A manipulated model can still narrate a misleading brief. The HR lead
    is the control. There is no autonomous action to take even if the brief is wrong.

# =============================================================================
# RISK ASSESSMENT
# =============================================================================
risk_assessment:
  methodology: "Likelihood x impact, Low / Medium / High, for this starter rather than a named employer"
  date_assessed: "2026-10-27"
  risks:
    - id: "R1"
      risk: "A missing evidence flag is treated as a breach, or a complete pack is treated as proof that all reasonable steps were taken"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "compliance_conclusion stays null even when every prompt is evidenced"
        - "Acas prompts are marked not a statutory step"
        - "No section 40B regulations are applied"
      residual_risk: "Medium"
      owner: "People and culture"

    - id: "R2"
      risk: "Sections 20 to 22 are described as already in force before 30 October 2026, or a timetable date is treated as a commenced duty"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "In-force flags are date comparisons against the pinned instruments"
        - "The Scottish contract-claim date and the non-disclosure-agreement timetable are not applied"
        - "Tests lock the 29 October and 30 October boundary"
      residual_risk: "Low"
      owner: "People and culture"

    - id: "R3"
      risk: "The draft is used as a disciplinary decision or a dismissal"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "disciplinary_decision stays null"
        - "There is no dismiss, suspend, or warn tool"
        - "Injection telling the agent to dismiss is recorded and not followed"
      residual_risk: "Low"
      owner: "People and culture"

    - id: "R4"
      risk: "Prompt injection publishes a policy, writes a record, or emails a worker or Acas"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "No such tool exists"
        - "Prohibited payload keys are stripped"
        - "Tests cover dismiss, email, and personnel-record instructions"
      residual_risk: "Low"
      owner: "Information security"

    - id: "R5"
      risk: "A live harassment report, which may be special-category data, is pasted into a shared test run"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "The core refuses a pack that is not marked synthetic"
        - "A report that is not marked anonymised is refused without echoing the narrative"
        - "The starter does not persist the pack"
      residual_risk: "Medium"
      owner: "Data protection officer"

    - id: "R6"
      risk: "A pinned page changes and the checklist is still treated as current"
      likelihood: "Medium"
      impact: "Medium"
      inherent_risk: "Medium"
      controls:
        - "Each source has last_verified"
        - "Older than the threshold is stale and is not silently refreshed"
        - "A stale policy review date is flagged and is not a breach"
      residual_risk: "Medium"
      owner: "People and culture"

# =============================================================================
# LOGGING AND AUDIT
# =============================================================================
logging_and_audit:
  description: >
    A production deployment should log the invocation, the model version if
    any, the pack reference, and the HR lead's later decision. This starter
    logs nothing because it keeps no store. Do not log an incident narrative
    in an application trace.

  logged_events:
    - event: "Review requested"
      data_logged:
        - "Timestamp"
        - "HR identity"
        - "Pack reference"
        - "Whether the pack was marked synthetic"
      retention: "Employer's schedule. Not set by this starter."
    - event: "Checklist result"
      data_logged:
        - "Which duties were in force on the as-of date"
        - "Whether any source was stale"
        - "Whether the compliance conclusion was left null"
      retention: "Keep with the HR file if a person relies on the draft."
    - event: "HR lead recorded a decision outside the agent"
      data_logged:
        - "Decision"
        - "HR identity"
        - "Timestamp"
      retention: "Employer's schedule. The agent does not write this event."

  log_destination:
    primary: "Not configured in this starter"
    note: "Choose a UK-resident store the employer already operates. Do not log the incident narrative in an application trace."

# =============================================================================
# KILL SWITCH
# =============================================================================
kill_switch:
  description: "Ways to stop the agent being used. Times are the platform's, not a measured drill."
  methods:
    - method: "Turn off the Copilot Studio agent"
      action: "Set the agent to Off in Copilot Studio administration"
      time_to_effect: "Immediate once an administrator does it"
      who_can_activate: "Copilot Studio administrators"
    - method: "Remove Microsoft Foundry access"
      action: "Revoke the key or the managed-identity role used for an optional narrative"
      time_to_effect: "Immediate for new calls"
      who_can_activate: "Foundry or Key Vault administrators"
    - method: "Power Platform DLP"
      action: "Block any connector added later for mail, Teams send, the HR system, or a case system"
      time_to_effect: "Minutes"
      who_can_activate: "Power Platform administrators"
  escalation_contacts:
    - role: "People and culture lead"
      contact: "era-hr-assistant@example.com"
    - role: "Data protection officer"
      contact: "dpo@example.com"

# =============================================================================
# REVIEW
# =============================================================================
review:
  last_review_date: "2026-10-27"
  next_review_date: "2027-04-27"
  review_frequency: "6 months, and sooner if a commencement instrument or an Acas page used here changes"
  reviewer: "The adopting employer's HR lead and DPO. Not assigned to a named person in this starter."
  review_triggers:
    - "A change to Equality Act 2010 section 40A, or to Employment Rights Act 2025 sections 20, 21, 22, 23, 25, or 152"
    - "Regulations made under the new section 40B specifying reasonable steps"
    - "A change to the GOV.UK Employment Rights Act timeline"
    - "A proposal to add a connector that can email, write a personnel record, or publish a policy"
    - "A security incident involving a draft"
  related_documents:
    - name: "Experiment readme"
      path: "README.md"
    - name: "Review core"
      path: "src/review.py"
    - name: "Pinned sources"
      path: "src/sources.py"
    - name: "Security and permissions"
      path: "docs/security-and-permissions.md"

# =============================================================================
# ASSUMPTIONS
# =============================================================================
assumptions:
  description: "Items an employer must confirm before relying on this starter."
  items:
    - id: "A1"
      assumption: "Article 6 is a candidate basis only. The employer confirms it before live use. Article 9 is not asserted."
      section: "uk_gdpr"
      verify_on_deployment: true
    - id: "A2"
      assumption: "Production inference, if used, runs in Microsoft Foundry in a UK region and is not trained on the employer's reports"
      section: "uk_gdpr.data_residency"
      verify_on_deployment: true
    - id: "A3"
      assumption: "No mail, Teams send, HR-system, or case connector is added without updating this manifest"
      section: "data_access.never_access"
      verify_on_deployment: true
    - id: "A4"
      assumption: "Contact addresses on example.com are placeholders. Northwharf Community Kitchen CIC is invented."
      section: "kill_switch.escalation_contacts"
      verify_on_deployment: true
    - id: "A5"
      assumption: "The Scottish breach-of-contract time-limit date is a GOV.UK timeline sentence. The instrument was not opened on 27 October 2026. The core does not apply that date."
      section: "src/sources.py"
      verify_on_deployment: true
    - id: "A6"
      assumption: "No regulations specifying reasonable steps under Equality Act 2010 section 40B were opened. The employer must not treat the Acas prompts as that list."
      section: "src/sources.py"
      verify_on_deployment: true
