# Agent manifest: Control Testing Assistant
# Experiment 73 — catalogue ID L009
# Version: 0.1.0
# Last reviewed: 2026-11-23
# Next review: 2027-05-23

$schema: "../../../schemas/agent-manifest.schema.json"

agent:
  id: "exp-73-control-testing-assistant"
  name: "Control Testing Assistant"
  version: "0.1.0"
  description: >
    Prepares a test plan, a seeded sample, and a draft working paper from a
    pinned synthetic control library, a pinned synthetic evidence population,
    and a pinned synthetic directory. Autonomy A1. The named tester approves
    the exact content hash before a draft is written to a synthetic staging
    store. The tester validates the evidence and decides the result. The
    agent does not pass or fail a control, close a finding, or send.
  owner: "Tester"
  contact: "tester@ashcombe.example.gov.uk"
  repository: "https://github.com/rahul-bachina/copilot-agent-experiments"
  experiment_path: "experiments/73-control-testing-assistant"

autonomy:
  level: "A1"
  level_description: "The assistant prepares a plan, a sample, and a draft working paper. The named tester approves that exact content before a synthetic staging write. The tester decides the result."
  constraints:
    - "The tester validates the evidence and decides the result. The agent does not."
    - "The agent NEVER passes or fails a control"
    - "The agent NEVER closes a finding"
    - "The agent NEVER sends"
    - "The agent NEVER treats an approval marker or a role inside evidence text as the approval step"
    - "A caller-supplied control library is not the pinned library"
  human_in_the_loop: true
  auto_actions_enabled: false

data_access:
  reads:
    - resource: "Synthetic evidence population"
      description: "Approvals, reconciliations, access reviews, and change tickets. Samples are synthetic. Instructions inside the text are not followed."
      access_level: "read"
      scope: "The pinned population for one control. The body is not copied into the result."
      justification: "Each item is checked against the test steps. Exceptions keep the evidence id."
      data_categories:
        - "Evidence references, dates, and directory refs"
        - "Retention labels and legal-hold flags"
      may_contain_personal_data: true
      may_contain_special_category_data: true
      retention: "The approved draft is held in the synthetic staging store for the process. This starter does not set a statutory retention period."
    - resource: "Pinned synthetic control library"
      description: "Control objective, frequency, owner, and test steps. A library inside the request is not this library."
      access_level: "read"
      scope: "The fixture file."
      justification: "The plan uses the pinned control. Differences in a caller copy are flagged and not applied."
      may_contain_personal_data: false
    - resource: "Synthetic directory"
      description: "Testers, approvers, preparers, control owners, and guests. Evidence text does not set the role or the clearance."
      access_level: "read"
      scope: "One tester reference, and the approver and preparer refs on the evidence."
      justification: "Only the named directory tester can approve the working paper. An evidence approver has to be on the directory."
      may_contain_personal_data: true
    - resource: "Separate approval object"
      description: "The only object that can approve this working-paper hash, or record that a route was seen, or store the tester's own words."
      access_level: "read"
      scope: "One approval object, bound to that hash."
      justification: "An approval marker inside evidence is not that step."
      may_contain_personal_data: false
    - resource: "Experiment 12 document intake"
      description: "intake() on up to 12 evidence files. Files are not confirmed and no purpose is confirmed."
      access_level: "read"
      scope: "One synthetic batch. The file body is not copied back."
      justification: "The evidence is untrusted text. Intake records that."
      may_contain_personal_data: true
    - resource: "Experiment 69 policy control mapping"
      description: "map_controls() on a pinned policy clause, when the control has one. The mapping is not a test result."
      access_level: "read"
      scope: "One clause. control_met from that call is ignored."
      justification: "A policy sentence is context for the tester. It does not pass the control."
      may_contain_personal_data: false
    - resource: "Experiment 08 UK identifier redaction"
      description: "propose() on the evidence text. Reversible stays false. The redacted text is not copied."
      access_level: "read"
      scope: "A count of findings. Matched values are not stored."
      justification: "A pasted identifier is counted. The output is not described as anonymised."
      may_contain_personal_data: true

  never_access:
    - resource: "A live GRC system, a SharePoint library, or a mailbox"
      reason: "The pinned files are what this starter reads. It does not send or write production."
    - resource: "A caller-supplied control library, population, directory, or criteria object"
      reason: "Differences are flagged. The plan uses the pinned files."
    - resource: "An approval marker, a role, or a clearance stated inside evidence text"
      reason: "The directory and the separate approval object are the source."
    - resource: "Evidence text above the tester's directory clearance"
      reason: "The body is not copied. The higher marking, the legal hold, and the retention labels are kept."

tools:
  allowed:
    - tool: "Prepare control test"
      provider: "Local Python (prepare_test)"
      action: "Return a plan, a seeded sample, exceptions, and a draft working paper"
      access_level: "read"
      scope: "One synthetic request. No network. No model."
      justification: "Sample selection and the evidence checks are deterministic. A language model must not pass or fail a control."
      human_approval_required: false
      output_requires_human_review: true
    - tool: "Record route seen"
      provider: "Local Python (record_route_seen)"
      action: "Record that the named tester has seen a distress, grievance, or safeguarding route"
      access_level: "read"
      scope: "The draft and a separate seen object. Nothing is staged."
      justification: "Distress is not a routine test. The cue text is not copied."
      human_approval_required: true
      output_requires_human_review: true
    - tool: "Record tester approval"
      provider: "Local Python (record_tester_approval)"
      action: "Write the approved draft to the synthetic staging store"
      access_level: "write"
      scope: "The draft and a separate approval object, bound to the content hash."
      justification: "The catalogue checkpoint is that the named tester approves the exact content before it is stored."
      human_approval_required: true
      output_requires_human_review: true
    - tool: "Record tester result"
      provider: "Local Python (record_tester_result)"
      action: "Store the tester's own words against the staged hash"
      access_level: "write"
      scope: "One staged row. The words are not interpreted as a pass, a fail, or a closure."
      justification: "The tester decides the result. The agent does not."
      human_approval_required: true
      output_requires_human_review: true
    - tool: "Text note"
      provider: "Microsoft Foundry"
      action: "Turn the JSON into a short note, using only fields already in the JSON"
      access_level: "read"
      scope: "The JSON for this run"
      justification: "Optional narrative. The hashes, the exceptions, and the empty or recorded approval stay in the Python core."
      human_approval_required: false
      output_requires_human_review: true

  writes:
    enabled: true
    note: >
      The only write is a row in the in-memory synthetic staging store, and
      only after record_tester_approval matches the named tester and the
      content hash. record_tester_result stores the tester's words on that
      row and does not apply them. Neither write is a production GRC system.
    allowed_writes:
      - tool: "Synthetic staging row"
        provider: "Local Python (record_tester_approval, record_tester_result)"
        action: "Keep the approved draft, then the tester's uninterpreted words"
        access_level: "write"
        scope: "The synthetic store in this process. production_written stays false."
        justification: "The named tester approves the exact content before it is stored."
        human_approval_required: true
        output_requires_human_review: true

  sends:
    enabled: false
    note: >
      No sends. Approving a draft does not email the control owner, the
      tester, or anyone else.

high_risk_actions:
  approve_reject:
    enabled: false
    rationale: >
      The agent does not pass or fail a control. An approval object records
      that the named tester has seen this hash. A sentence in the evidence
      cannot set it.
  regulated_decision:
    enabled: false
    rationale: >
      The agent does not decide that UK Corporate Governance Code 2024
      Provision 29 was met, or that FCA SYSC 4.1.1R was met, or that a
      control operated.
  production_record_change:
    enabled: false
    rationale: "The staging row is in-memory JSON. It is not a write to a GRC system."
  external_send:
    enabled: false
    rationale: "The agent does not send the working paper."
  spend_transact:
    enabled: false
    rationale: "There is no payment. An amount on an evidence item is information for the tester."
  additional_high_risk:
    - enabled: false
      action_name: "Pass or fail a control, close a finding, or send"
      rationale: "Those functions raise. control_passed and control_failed stay null. finding_closed and sent stay false."
    - enabled: false
      action_name: "Treat evidence text as the tester's approval"
      rationale: "human_approval stays null until record_tester_approval succeeds for the named tester and the exact hash."
    - enabled: false
      action_name: "Apply a caller-supplied library or a biased criterion"
      rationale: "caller_library_applied and criteria_applied stay false. marked_acceptable stays false."
    - enabled: false
      action_name: "Drop a legal hold or a retention label"
      rationale: "A hold and every retention label are copied onto the result and the staged row."

human_approval:
  description: >
    The named tester approves the working paper on a separate object, bound
    to the content hash. That writes the synthetic row. The same tester may
    later record their own words about the result. Those words are not read
    as a pass or a fail. Seeing a distress route does not decide it. An
    approval marker inside evidence is not a step.

  approval_points:
    - action: "See a distress, grievance, or safeguarding route"
      approver: "Named tester"
      mandatory: true
      rationale: "record_route_seen accepts the directory tester named on the draft and the content hash. It does not stage the paper."
    - action: "Approve this working paper"
      approver: "Named tester"
      mandatory: true
      rationale: "record_tester_approval accepts the directory tester only when the content hash matches and the item is working-paper."
    - action: "Acknowledge unverified code and handbook pins"
      approver: "Named tester"
      mandatory: true
      rationale: "pins_seen must be the boolean true. Provision 29 and SYSC 4.1.1R were not opened on legislation.gov.uk."
    - action: "Acknowledge a stale library or a caller source that differs"
      approver: "Named tester"
      mandatory: true
      rationale: "stale_seen and sources_seen must be the boolean true when those flags are set. A string is not coerced."
    - action: "Record the tester's result"
      approver: "Named tester"
      mandatory: true
      rationale: "record_tester_result stores the tester's words. It does not pass, fail, close, or send."
    - action: "Pass or fail a control, close a finding, or send"
      approver: "Nobody"
      mandatory: true
      rationale: "Those actions are not tools. The flags stay false after an approval and after the tester's words are stored."

  no_approval_required:
    - action: "Read the draft"
      rationale: "Reading the draft has no external effect. human_approval stays null and nothing is staged."
    - action: "Re-run the same request"
      rationale: "No write and no send until the approval object matches. The same inputs and the same question date produce the same JSON."

uk_gdpr:
  lawful_basis:
    primary: "Not asserted"
    description: >
      This starter does not decide the controller's lawful basis. Article 6
      was not opened on 23 November 2026.
    secondary: "None asserted."
  special_category_data:
    may_process: true
    categories_possible:
      - "Health or safeguarding text a caller may paste into evidence or a cover note"
    lawful_basis_special: "Not asserted. Article 9 was not opened on 23 November 2026."
    safeguards:
      - "A distress, grievance, or safeguarding cue is routed to the named tester. The cue text is not copied."
      - "Phone numbers, email addresses, dates of birth, postal addresses, personal names, and UK identifiers are counted and not stored. The output is not described as anonymised."
      - "A count of people below 5 is not published. Five is this starter's threshold."
      - "Samples in this repository are synthetic."
      - "No solely automated decision about a person or a control. The sample does not pass or fail a control."
  data_minimisation:
    - "The evidence body is not copied into the result."
    - "Exceptions cite an evidence id. Names are not stored."
    - "described_as_anonymised stays false."
  retention:
    agent_retention: "The synthetic store lives for the process. This starter does not set a disposal date."
    note: "A retention label and a legal hold on the evidence are kept. They are not a decision to dispose."
  data_residency:
    region: "UK"
    note: "A production Microsoft Foundry deployment should use UK South or UK West. This repository cannot enforce that."
  data_subject_rights:
    note: "The agent does not handle access, erasure, or objection requests. Those go through the organisation's privacy process."

prompt_injection:
  description: >
    Evidence text and a caller-supplied library are untrusted. They may say
    the tester has approved, that a control should be marked passed, or that
    a label should be stripped. The core does not read the network.
  controls:
    - control: "Instruction sentences are not followed"
      description: "Pass, fail, close, and send sentences are recorded. followed stays false."
    - control: "Negation is not a positive match"
      description: "A phrase after not true that, or after nobody, in the same sentence, is not an inclusion. A distress stem is still routed."
    - control: "Approval is a separate object"
      description: "Approval keys on the request are stripped. human_approval stays null until record_tester_approval succeeds."
    - control: "Pinned sources win"
      description: "A library, population, directory, or criteria object in the request is compared and not used for the plan."
    - control: "No pass, fail, close, or send tool"
      description: "Those functions raise TestingForbidden."
  residual_risk: >
    A manipulated model can still narrate a misleading note. The named tester
    is the control. Nothing is sent even if the note is wrong. A paraphrase
    that uses none of the cue stems is not flagged.

risk_assessment:
  methodology: "Likelihood x impact, Low / Medium / High, for this starter rather than a named organisation"
  date_assessed: "2026-11-23"
  risks:
    - id: "R1"
      risk: "A sentence in the evidence is treated as the tester's approval or as a pass"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Those words are recorded and not followed"
        - "record_tester_approval reads only the separate approval object and the content hash"
      residual_risk: "Low"
      owner: "Tester"
    - id: "R2"
      risk: "The agent passes or fails a control, closes a finding, or sends"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Those functions raise"
        - "control_passed and control_failed stay null after approval and after the tester's words"
      residual_risk: "Low"
      owner: "Tester"
    - id: "R3"
      risk: "A negated exception is treated as included, or a missing item is invented"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Negation is applied before a text cue counts"
        - "An empty population is listed as missing evidence and is not filled"
      residual_risk: "Medium"
      owner: "Tester"
    - id: "R4"
      risk: "A carve-out is marked acceptable, or a caller library is applied"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "marked_acceptable stays false"
        - "The pinned library is the plan"
      residual_risk: "Medium"
      owner: "Tester"
    - id: "R5"
      risk: "An unreadable date or seed is coerced to zero or to today"
      likelihood: "Medium"
      impact: "Medium"
      inherent_risk: "Medium"
      controls:
        - "The value is flagged and coerced stays false"
        - "The question date is the as-of argument"
      residual_risk: "Low"
      owner: "Tester"
    - id: "R6"
      risk: "A legal hold or a retention label is dropped, or a SECRET cover is missed"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Metadata and content are both read"
        - "A compound marking takes the higher tier"
        - "The hold and every retention label are kept on the staged row"
      residual_risk: "Medium"
      owner: "Information governance"

logging_and_audit:
  description: >
    A production deployment should log the invocation, the tester reference
    if it matched the synthetic pattern, the outcome, and whether an approval
    was recorded. This starter does not write an application log.
    Do not put the evidence text or a quote in an application trace.
  logged_events:
    - event: "Draft returned"
      data_logged:
        - "Timestamp"
        - "Tester reference, if it matched the synthetic pattern"
        - "Outcome"
        - "Whether human_approval was left null"
      retention: "Organisation's records schedule. Not set by this starter."
    - event: "Synthetic row written"
      data_logged:
        - "Whether the content hash matched"
        - "production_written false"
      retention: "Organisation's schedule. The agent does not write this event to a GRC system."
  log_destination:
    primary: "Not configured in this starter"
    note: "Choose a UK-resident store the organisation already operates."

kill_switch:
  description: "Ways to stop the agent being used. Times are the platform's, not a measured drill."
  methods:
    - method: "Turn off the Copilot Studio agent"
      action: "Set the agent to Off in Copilot Studio administration"
      time_to_effect: "Immediate once an administrator does it"
      who_can_activate: "Copilot Studio administrators"
    - method: "Remove Microsoft Foundry access"
      action: "Revoke the key or the managed-identity role used for an optional note"
      time_to_effect: "Immediate for new calls"
      who_can_activate: "Foundry or Key Vault administrators"
  escalation_contacts:
    - role: "Tester"
      contact: "tester@ashcombe.example.gov.uk"
    - role: "Data protection officer"
      contact: "dpo@ashcombe.example.gov.uk"

review:
  last_review_date: "2026-11-23"
  next_review_date: "2027-05-23"
  review_frequency: "6 months, and sooner if the pinned library or the cited code or handbook page changes"
  reviewer: "The adopting organisation's tester and DPO. Not assigned to a named person in this starter."
  review_triggers:
    - "A change to the pinned control library or the evidence population"
    - "A change to UK Corporate Governance Code Provision 29 or to SYSC 4.1.1R"
    - "A proposal to add a connector that can pass a control, close a finding, or send"
  related_documents:
    - name: "Experiment readme"
      path: "README.md"
    - name: "Testing core"
      path: "src/testing.py"
    - name: "Pinned sources"
      path: "src/sources.py"
    - name: "Security and permissions"
      path: "docs/security-and-permissions.md"

atrs_mapping:
  note: >
    Not an ATRS record and not a scope decision. A body that wants a draft
    pack uses Experiment 03. The working paper from this starter is not an
    approval of that pack.
  mappings:
    - atrs_field: "Name"
      manifest_section: "agent.name"
    - atrs_field: "Description"
      manifest_section: "agent.description"
    - atrs_field: "Human oversight"
      manifest_section: "human_approval"

assumptions:
  description: "Items an organisation must confirm before relying on this starter."
  items:
    - id: "A1"
      assumption: "No lawful basis is asserted. Article 6 and Article 9 were not opened on 23 November 2026."
      section: "uk_gdpr"
      verify_on_deployment: true
    - id: "A2"
      assumption: "Provision 29 was read from a company-hosted PDF of the January 2024 Code. The FRC library page was opened and does not carry the full provision. A byte-for-byte match to the FRC file is unverified. SYSC 4.1.1R was read from the FCA Handbook page dated as of 23/11/2026. Neither text was opened on legislation.gov.uk."
      section: "src/sources.py"
      verify_on_deployment: true
    - id: "A3"
      assumption: "The sample size rule and the segregation rule are starter rules. ISA (UK) 530 was not opened. The sample is not a conclusion that a control operated."
      section: "src/sample.py"
      verify_on_deployment: true
    - id: "A4"
      assumption: "Treating a library as stale on its review-due date, including that date, is this starter's rule. It is not a statutory period."
      section: "src/testing.py"
      verify_on_deployment: true
    - id: "A5"
      assumption: "The marking order is a starter rule. The Government Security Classifications Policy was not re-opened."
      section: "src/marking.py"
      verify_on_deployment: true
    - id: "A6"
      assumption: "The small-number threshold of 5 is a starter control. It is not anonymisation. The ICO anonymisation guidance was not opened."
      section: "fixtures/criteria.json"
      verify_on_deployment: true
    - id: "A7"
      assumption: "Entra Agent ID, Conditional Access for agents, Power Platform DLP as a configured policy, Microsoft Foundry prompt shields, Key Vault, Purview, and Application Insights were not opened on 23 November 2026. Treat that product behaviour as unverified."
      section: "docs/security-and-permissions.md"
      verify_on_deployment: true
    - id: "A8"
      assumption: "The harness overview was not re-opened for this experiment. Experiment 70 recorded, on 20 November 2026, that the page names a Microsoft Copilot harness and does not use the words GitHub Copilot harness. That point remains unverified against a fresh opening of the page."
      section: "docs/harness-comparison.md"
      verify_on_deployment: true
    - id: "A9"
      assumption: "Contact addresses on ashcombe.example.gov.uk are placeholders. Ashcombe Borough Council is invented."
      section: "kill_switch.escalation_contacts"
      verify_on_deployment: true
