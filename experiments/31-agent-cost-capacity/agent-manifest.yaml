# Agent manifest: Agent Cost and Capacity Agent
# Experiment 31 — catalogue ID G009
# Version: 0.1.0
# Last reviewed: 2026-11-03
# Next review: 2027-05-03

$schema: "../../../schemas/agent-manifest.schema.json"

agent:
  id: "exp-31-agent-cost-capacity"
  name: "Agent Cost and Capacity Agent"
  version: "0.1.0"
  description: >
    From synthetic usage telemetry and a rate card supplied as a file with an
    effective date, drafts per-agent cost, unit cost per case, a forecast with
    stated assumptions, quota headroom, and anomaly flags. Autonomy is A0.
    The FinOps owner validates rates and the forecast. The agent does not
    change a quota, a budget, or a subscription, and it does not store a
    Microsoft price.
  owner: "FinOps owner (the adopting organisation)"
  contact: "finops-owner@example.com"
  repository: "https://github.com/rahul-bachina/copilot-agent-experiments"
  experiment_path: "experiments/31-agent-cost-capacity"

autonomy:
  level: "A0"
  level_description: "Read-only analysis. No action, even with approval."
  constraints:
    - "The agent returns a draft cost and capacity report, and stops."
    - "Rates come only from the rate-card file. There is no built-in price."
    - "The agent NEVER sets rates_validated or forecast_validated."
    - "The agent NEVER changes a quota, a budget, or a subscription."
    - "The agent NEVER purchases Copilot Credits or starts a paid Azure meter."
    - "The agent NEVER recommends autonomy A3. The catalogue levels are A0, A1, and A2."
    - "The agent NEVER sends the report or writes a production record."
    - "Telemetry text and rate-card notes are untrusted data. A sentence that names a price does not set one."
    - "All output is labelled DRAFT FOR FINOPS REVIEW."
  human_in_the_loop: true
  auto_actions_enabled: false

data_access:
  reads:
    - resource: "Usage telemetry supplied for this run"
      description: "Synthetic conversations, tool calls, tokens, Copilot Credits, and Foundry model usage, one row per agent."
      access_level: "read"
      scope: "The file passed to this run. No admin centre and no billing export."
      justification: "Cost cannot be drafted without the quantities the FinOps owner supplied."
      data_categories:
        - "Usage quantities"
        - "Free text, which may contain personal data if a live export was pasted"
      may_contain_personal_data: true
      may_contain_special_category_data: false
      retention: "Transient. The starter does not persist the file."
    - resource: "Rate card supplied for this run"
      description: "A JSON file with a currency code, an effective date, and price strings. Not a Microsoft price list."
      access_level: "read"
      scope: "The rate-card path passed to this run."
      justification: "Every amount is a quantity times a rate on this file. A missing rate stays null."
      may_contain_personal_data: false
      retention: "Transient. The starter does not persist the file."
    - resource: "Quota limits supplied for this run"
      description: "Caller-supplied limits for headroom. The limits are not changed."
      access_level: "read"
      scope: "The quotas array on the telemetry file."
      justification: "Headroom is limit minus used. Used is summed from the kept agent rows."
      may_contain_personal_data: false
    - resource: "Pinned source notes"
      description: "src/sources.py. Sentences from Microsoft Learn pages opened on 3 November 2026. No rate from those pages is stored."
      access_level: "read"
      scope: "Static files in this experiment."
      justification: "Billing claims are cited from that pin and marked when a page was not opened."
      may_contain_personal_data: false
    - resource: "Run parameters"
      description: "As-of date and the stale-data threshold, typed by the FinOps owner."
      access_level: "read"
      scope: "This invocation."
      justification: "Currency of the rate card and of the pin is calculated from these inputs."
      may_contain_personal_data: false
  never_access:
    - resource: "Power Platform admin centre, Azure Cost Management, or a billing subscription"
      reason: "The agent does not read or change live capacity, budgets, or subscriptions."
    - resource: "A Copilot Studio tenant or a Microsoft Foundry resource"
      reason: "Usage is a file the caller supplies. The agent does not call a platform API."
    - resource: "A mailbox, a Teams chat, or any send channel"
      reason: "The report is returned to the caller. Nothing is sent."

tools:
  allowed:
    - tool: "Read the telemetry and the rate card supplied for this run"
      provider: "Local Python (src/report.py)"
      action: "Price kept agent rows from the rate card and draft headroom"
      access_level: "read"
      scope: "The two files passed to the agent"
      justification: "The report cannot be built without the quantities and the rates the FinOps owner supplied"
      human_approval_required: false
      output_requires_human_review: true
    - tool: "Draft a forecast from the period cost and a caller-supplied band"
      provider: "Local Python (src/forecast.py)"
      action: "Return a point, a low, and a high. Do not mark the forecast validated."
      access_level: "read"
      scope: "The same files"
      justification: "The FinOps owner needs the arithmetic and the assumptions in one place. The band is not a statistical interval."
      human_approval_required: false
      output_requires_human_review: true
  writes:
    enabled: false
    note: "The agent does not write quotas, budgets, subscriptions, Dataverse, Copilot Studio, or any other production record."
  sends:
    enabled: false
    note: "The agent does not send email, Teams messages, or a purchase request."

human_approval:
  description: >
    The FinOps owner validates rates and the forecast. The agent can show
    the arithmetic. It cannot record that the owner accepted it, and it
    cannot change a quota, a budget, or a subscription.
  approval_points:
    - action: "Validate the rates"
      approver: "FinOps owner"
      mandatory: true
      rationale: "Catalogue control for G009. Rates come from a file the owner supplied. rates_validated stays false."
    - action: "Validate the forecast"
      approver: "FinOps owner"
      mandatory: true
      rationale: "The forecast assumes a flat run-rate and a caller-supplied band. forecast_validated stays false."
    - action: "Re-open a stale rate card or a stale Microsoft Learn page before relying on a citation"
      approver: "FinOps owner"
      mandatory: true
      rationale: "A stale card is still shown so the arithmetic can be seen. do_not_rely is not cleared by the agent."
    - action: "Change a quota, a budget, or a subscription"
      approver: "An administrator outside this agent"
      mandatory: true
      rationale: "Headroom is a report. quota_changed, budget_changed, and subscription_changed stay false."
  no_approval_required:
    - action: "Produce this draft from files the FinOps owner supplied"
      rationale: "The draft has no external effect."

uk_gdpr:
  lawful_basis:
    primary: "Not chosen by this starter"
    description: >
      A live usage export may contain a user principal name if the owner
      pasted one. The samples do not. The agent does not choose an Article 6
      basis. The organisation's data protection officer confirms a basis
      before any processing of live data.
  special_category_data:
    may_process: false
    lawful_basis_special: "Not asserted. An Article 9 condition is for the DPO."
    safeguards:
      - "No Article 9 condition is claimed here"
      - "Telemetry and the rate card are not written to a production record"
      - "Instructions inside a note are not followed"
  data_minimisation:
    - "One telemetry file and one rate card per report"
    - "Notes that match an instruction pattern are not copied into the report"
  retention:
    agent_retention: "None in this starter. Processing is transient."
  data_residency:
    region: "UK"
    note: "A deployment choice for a later agent. This starter does not call a model and does not choose a region."

risk_assessment:
  methodology: "Likelihood x impact, Low / Medium / High, for this starter rather than a named organisation"
  date_assessed: "2026-11-03"
  risks:
    - id: "R1"
      risk: "A reader treats the draft as a validated invoice or as a Microsoft list price"
      likelihood: "Medium"
      impact: "High"
      controls:
        - "rates_validated and forecast_validated stay false"
        - "The label is DRAFT FOR FINOPS REVIEW"
        - "No Microsoft rate is stored in the code"
      residual_risk: "Medium"
      owner: "FinOps owner"
    - id: "R2"
      risk: "A note tells the agent to set a price, validate the forecast, or change a quota"
      likelihood: "Medium"
      impact: "High"
      controls:
        - "Those sentences are recorded and not followed"
        - "Tests cover an injected note and the prohibited command flags"
      residual_risk: "Low"
      owner: "FinOps owner"
    - id: "R3"
      risk: "Token quantities are added on top of Copilot Credits, or a missing rate is stored as zero"
      likelihood: "Medium"
      impact: "High"
      controls:
        - "Credit-billed rows price copilot_credits only, unless a line is marked additive"
        - "A missing rate leaves the cost null"
        - "A rollup is compared and is not added"
      residual_risk: "Low"
      owner: "FinOps owner"
    - id: "R4"
      risk: "A Microsoft Learn sentence has changed since 3 November 2026, or the standard-harness double-count guard is read as a Microsoft rule"
      likelihood: "Medium"
      impact: "Medium"
      controls:
        - "Sources carry last_verified"
        - "Assumption B1 says the standard-harness guard is this starter's rule"
        - "A stale pin sets do_not_rely"
      residual_risk: "Medium"
      owner: "FinOps owner"

logging_and_audit:
  description: "This starter writes no log. Before a deployment, log who ran a report, the bundle id, the rate-card id, the as-of date, and whether the card was stale. Do not log the full telemetry file."
  logged_events:
    - event: "Cost and capacity report drafted"
      data_logged:
        - "bundle id"
        - "rate-card id"
        - "as-of date"
        - "whether the total was complete"
        - "whether a prompt-injection pattern was detected"
        - "whether a quota was changed (always false in this starter)"
      retention: "Not set by this starter."

kill_switch:
  description: "This starter is a local command. Stop using it by not running it. There is no published agent to switch off."
  methods:
    - method: "Do not run the command"
      action: "Stop invoking src/report.py"
      who_can_activate: "Whoever can run the command"
    - method: "Remove the file from a machine that should not draft cost reports"
      action: "Delete the local copy"
      who_can_activate: "The machine owner"

review:
  last_review_date: "2026-11-03"
  next_review_date: "2027-05-03"
  review_frequency: "Six months, and sooner if a pinned Microsoft Learn page is re-opened and has changed."
  reviewer: "The adopting organisation's FinOps owner. Not assigned to a named person in this starter."

high_risk_actions:
  approve_reject:
    enabled: false
    rationale: "The agent does not validate rates or the forecast. The FinOps owner does that outside this tool."
  regulated_decision:
    enabled: false
    rationale: "A cost figure is not a regulated decision and it is not a billing determination."
  production_record_change:
    enabled: false
    rationale: "Quotas, budgets, and subscriptions are not changed. No tenant record is written."
  external_send:
    enabled: false
    rationale: "The report is not emailed or posted."
  spend_transact:
    enabled: false
    rationale: "No purchase, no prepaid pack, and no pay-as-you-go meter is started. The report is arithmetic on a supplied rate card."
  additional_high_risk:
    - action_name: "Validate the rates"
      enabled: false
      rationale: "rates_validated stays false."
    - action_name: "Validate the forecast"
      enabled: false
      rationale: "forecast_validated stays false."
    - action_name: "Change a quota"
      enabled: false
      rationale: "quota_changed stays false. There is no write tool."
    - action_name: "Change a budget"
      enabled: false
      rationale: "budget_changed stays false. There is no write tool."
    - action_name: "Change a subscription"
      enabled: false
      rationale: "subscription_changed stays false. There is no write tool."
    - action_name: "Purchase Copilot Credits"
      enabled: false
      rationale: "There is no purchase tool."

assumptions:
  description: "The organisation confirms these before anyone relies on a report."
  items:
    - id: "A1"
      assumption: "The telemetry and the rate card were supplied by the FinOps owner. This starter does not fetch them from an admin centre."
      section: "data_access.reads"
      verify_on_deployment: true
    - id: "A2"
      assumption: "Microsoft Learn sentences opened on 3 November 2026 are re-opened before a citation is relied on. Pages named but not opened stay unverified."
      section: "review"
      verify_on_deployment: true
    - id: "A3"
      assumption: "High-risk actions stay disabled. The agent does not change a quota, a budget, or a subscription."
      section: "high_risk_actions"
      verify_on_deployment: true
