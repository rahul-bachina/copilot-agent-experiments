# Agent manifest: Case Summary Agent
# Experiment 41 — catalogue ID C002
# Version: 0.1.0
# Last reviewed: 2026-11-09
# Next review: 2027-05-09

$schema: "../../../schemas/agent-manifest.schema.json"

agent:
  id: "exp-41-case-summary"
  name: "Case Summary Agent"
  version: "0.1.0"
  description: >
    Drafts a reading of one synthetic contact-centre or complaints case.
    Every summary sentence carries a pinpoint citation: event id, paragraph,
    and line. A deterministic checker fails a sentence whose cited span does
    not contain it, or that has no citation. Lines that contain a UK identifier
    are not copied. Autonomy is A0. The service representative checks accuracy.
    The agent does not contact the customer and does not change the record.
  owner: "Service representative (the adopting organisation)"
  contact: "case-summary@example.com"
  repository: "https://github.com/rahul-bachina/copilot-agent-experiments"
  experiment_path: "experiments/41-case-summary"

autonomy:
  level: "A0"
  level_description: "Read-only analysis. No action, even with approval."
  constraints:
    - "The summariser returns a draft reading and stops."
    - "The summariser NEVER contacts the customer. customer_contacted stays false."
    - "The summariser NEVER changes the case record. record_changed stays false."
    - "The summariser NEVER closes a complaint or offers redress."
    - "The summariser NEVER decides a case outcome. case_outcome stays null."
    - "The summariser NEVER marks the summary accurate. accuracy_checked stays false on the agent path."
    - "The summariser NEVER recommends autonomy A3. The catalogue levels are A0, A1, and A2."
    - "The summariser NEVER sends, spends, or writes a production record."
    - "Case text is untrusted data. It cannot set a contact, a write, or a verdict."
    - "All output is labelled DRAFT FOR THE SERVICE REPRESENTATIVE. NOT A CUSTOMER CONTACT. NOT A RECORD CHANGE."
  human_in_the_loop: true
  auto_actions_enabled: false

data_access:
  reads:
    - resource: "Synthetic case history supplied for this run"
      description: "Events with paragraph and line text, plus the fact keys the caller asked for."
      access_level: "read"
      scope: "The one JSON case passed to this run. Synthetic fixtures only."
      justification: "A sentence cannot be cited without the span it came from."
      data_categories:
        - "Test configuration"
      may_contain_personal_data: false
      may_contain_special_category_data: false
      retention: "Transient. The starter does not persist the case."
    - resource: "Pinned source notes"
      description: "src/sources.py. Pages opened on 9 November 2026, and one ICO page that was not opened."
      access_level: "read"
      scope: "Static files in this experiment."
      justification: "Legal and harness notes are cited from that pin."
      may_contain_personal_data: false
    - resource: "Experiment 08 redaction proposal"
      description: "In-process call to propose(). The redacted text is not copied into the draft."
      access_level: "read"
      scope: "The case text of this run."
      justification: "UK identifiers are withheld from the summary."
      may_contain_personal_data: false
    - resource: "Run parameters"
      description: "As-of date and the staleness window, typed by the caller."
      access_level: "read"
      scope: "This invocation."
      justification: "Currency of events and pinned pages is calculated from these inputs."
      may_contain_personal_data: false

  never_access:
    - resource: "A live case system, a model endpoint, or any network host"
      reason: "The summariser has no HTTP client. Microsoft Foundry is not called."
    - resource: "Live council, utility, housing, or financial-services records"
      reason: "Fixtures are synthetic. A case that is not marked synthetic is refused."
    - resource: "A mailbox, a telephone, an SMS gateway, or any send channel"
      reason: "The draft is returned to the caller. The customer is not contacted."
    - resource: "A production case record"
      reason: "The summariser does not update Dynamics 365, a housing system, or any other case store."

tools:
  allowed:
    - tool: "Extract a cited case summary"
      provider: "Local Python (src/summarise.py)"
      action: "Copy current lines that match the caller's fact keys. Do not paraphrase. Do not copy identifier lines."
      access_level: "read"
      scope: "The case passed to this run"
      justification: "The service representative needs a draft in which every sentence names its lines."
      human_approval_required: false
      output_requires_human_review: true
    - tool: "Check pinpoint citations"
      provider: "Local Python (src/citations.py)"
      action: "One verdict per sentence. A missing or unsupported citation fails."
      access_level: "read"
      scope: "The sentences in the draft, or proposed sentences passed beside the case"
      justification: "A sentence that the cited lines do not contain must not pass."
      human_approval_required: false
      output_requires_human_review: true
    - tool: "List gaps and stale data"
      provider: "Local Python (src/summarise.py)"
      action: "Name missing fact keys, contradictions, withheld lines, and unused events. Do not pick a winner."
      access_level: "read"
      scope: "The shown sentences and the caller's fact-key list"
      justification: "An omission or a stale note is part of the reading. It is not a finding of fact."
      human_approval_required: false
      output_requires_human_review: true
    - tool: "Count UK identifiers"
      provider: "Experiment 08 propose()"
      action: "Record finding counts and entity types. Do not copy redacted text. Do not call release()."
      access_level: "read"
      scope: "The case text of this run"
      justification: "Data minimisation. The summary must not repeat a detected UK identifier."
      human_approval_required: false
      output_requires_human_review: true
  writes:
    enabled: false
    note: "The summariser does not write Dynamics 365, a housing system, Dataverse, or any other production record."
  sends:
    enabled: false
    note: "The summariser does not email, text, call, or write to the customer."

human_approval:
  description: >
    The service representative checks the accuracy of every cited sentence.
    The summariser cannot record that check. Contacting the customer, changing
    the record, closing a complaint, and offering redress stay outside this tool.
  approval_points:
    - action: "Check the accuracy of every cited sentence"
      approver: "Service representative"
      mandatory: true
      rationale: "Catalogue checkpoint for C002. Autonomy A0. The draft is not a customer contact and not a record change."
    - action: "Contact the customer"
      approver: "Service representative"
      mandatory: true
      rationale: "customer_contacted stays false. contact_customer always raises."
    - action: "Change the case record"
      approver: "Service representative"
      mandatory: true
      rationale: "record_changed stays false. write_case_record always raises."
    - action: "Close a complaint or offer redress"
      approver: "Service representative"
      mandatory: true
      rationale: "complaint_closed and redress_offered stay false. Those functions always raise."
    - action: "Re-open a pinned page before relying on a legal note"
      approver: "Service representative"
      mandatory: true
      rationale: "The legislation pages and the harness overview were opened on 9 November 2026. The ICO page was not."
    - action: "Confirm a lawful basis before any live processing"
      approver: "Data protection officer"
      mandatory: true
      rationale: "This starter does not choose an Article 6 basis. Article 5(3) was read. Compatibility is not itself a basis."
  no_approval_required:
    - action: "Produce this draft from a synthetic case"
      rationale: "The draft has no external effect."

uk_gdpr:
  lawful_basis:
    primary: "Not chosen by this starter"
    description: >
      The samples are synthetic. The summariser does not choose an Article 6 basis.
      Article 5 was read on 9 November 2026, including paragraph 1(c) data minimisation
      and paragraph 1(d) accuracy. Article 5(3) says compatible further processing is
      not, by itself, lawful. UK GDPR Article 22 was shown as omitted. The Data (Use
      and Access) Act 2025 section 80 substitutes Articles 22A to 22D. Articles 22B,
      22C, and 22D were read inside section 80. The ICO AI accuracy page was requested
      and was not opened. The organisation's data protection officer confirms the basis
      before any live processing. Live data is outside this starter.
  special_category_data:
    may_process: false
    lawful_basis_special: "Not asserted. An Article 9 condition is for the DPO. Article 9 was not opened on 9 November 2026."
    safeguards:
      - "No Article 9 condition is claimed here"
      - "The starter does not label a customer as vulnerable"
      - "A live case that includes health information would need its own assessment"
  data_minimisation:
    - "One case per draft"
    - "Only fact keys the caller named are turned into sentences when a list is supplied"
    - "Instruction text found in an event is not copied into the summary"
    - "A line Experiment 08 flags is not copied. The redacted text is not copied either"
    - "A case that is not marked synthetic is refused and the text is not echoed"
  retention:
    agent_retention: "None in this starter. Processing is transient."
  data_residency:
    region: "UK"
    note: "A deployment choice for a later agent. This starter does not call a model and does not choose a region. UK region availability for a Foundry deployment was not opened on 9 November 2026."

prompt_injection:
  description: >
    The summariser reads untrusted case text. That text cannot contact the
    customer, change the record, close a complaint, or set a verdict.
  controls:
    - control: "Strip output-shaped keys"
      description: "Keys that would set a contact, a write, a closure, or an accuracy flag are removed before drafting. Their values are not echoed."
      implementation: "src/injection.py"
    - control: "Record instructions and do not follow them"
      description: "A closed phrase list, including text hidden in comments, form feeds, trailing blank lines, or zero-width characters."
      implementation: "src/injection.py"
    - control: "Refuse a non-synthetic case"
      description: "synthetic must be true. Other sectors are refused."
      implementation: "src/summarise.py"
    - control: "Withhold identifier lines"
      description: "Experiment 08 propose() is called. A flagged line is not copied. release() is not called."
      implementation: "src/summarise.py"
  residual_risk: "Medium. A phrase that is not on the list is not detected. A verbatim quote can still omit the surrounding lines. Experiment 08 does not redact names, email addresses, or telephone numbers."

risk_assessment:
  methodology: "Likelihood x impact, Low / Medium / High, for this starter rather than a named organisation"
  date_assessed: "2026-11-09"
  risks:
    - id: "R1"
      risk: "A reader treats a cited draft as a customer contact, a record change, or a complaint outcome"
      likelihood: "Medium"
      impact: "High"
      controls:
        - "The label says the draft is not a customer contact and not a record change"
        - "customer_contacted, record_changed, complaint_closed, and redress_offered stay false"
        - "case_outcome stays null and accuracy_checked stays false on the agent path"
      residual_risk: "Medium"
      owner: "Service representative"
    - id: "R2"
      risk: "Case text tells the summariser to contact the customer or to close the complaint"
      likelihood: "Medium"
      impact: "High"
      controls:
        - "Those phrases do not change the flags"
        - "A proposed sentence that states them fails the checker"
        - "Tests cover an injected event"
      residual_risk: "Low"
      owner: "Service representative"
    - id: "R3"
      risk: "A verbatim sentence is true to its lines and still misleading because of what it leaves out"
      likelihood: "High"
      impact: "High"
      controls:
        - "Gaps, contradictions, stale events, and withheld lines are listed and are not resolved"
        - "The service representative checks every cited sentence against the source"
        - "checker_passed is not a finding that the reading is complete or that Article 5(1)(d) is met"
      residual_risk: "High"
      owner: "Service representative"
    - id: "R4"
      risk: "A detected UK identifier, or a name Experiment 08 does not detect, is repeated in a later log"
      likelihood: "Medium"
      impact: "High"
      controls:
        - "Flagged lines are not copied"
        - "redacted_text is not stored"
        - "output_is_anonymised stays false"
      residual_risk: "High"
      owner: "Service representative"
    - id: "R5"
      risk: "A pinned statute has changed since 9 November 2026, or the unread ICO page is treated as quoted"
      likelihood: "Medium"
      impact: "Medium"
      controls:
        - "Sources carry last_verified"
        - "A stale pin sets do_not_rely"
        - "The ICO page is marked opened false and is not quoted"
      residual_risk: "Medium"
      owner: "Service representative"

logging_and_audit:
  description: "This starter writes no log. Before a deployment, log the case id, the as-of date, the sentence count, the verdict counts, and the Experiment 08 finding count and input hash. Do not log case text or raw identifiers."
  logged_events:
    - event: "Case summary draft produced"
      data_logged:
        - "case id"
        - "as-of date"
        - "sentence count and verdict counts"
        - "whether an event or a pin was stale"
        - "whether an instruction was detected"
        - "Experiment 08 finding count and input hash"
      retention: "Not set by this starter."

kill_switch:
  description: "This starter is a local command. Stop using it by not running it. There is no published agent to switch off."
  methods:
    - method: "Do not run the command"
      action: "Stop invoking src/summarise.py"
      who_can_activate: "Whoever can run the command"
    - method: "Remove the file from a machine that should not draft readings"
      action: "Delete the local copy"
      who_can_activate: "The machine owner"

review:
  last_review_date: "2026-11-09"
  next_review_date: "2027-05-09"
  review_frequency: "Six months, and sooner if a pinned page is re-opened and has changed."
  reviewer: "The adopting organisation's service representative. Not assigned to a named person in this starter."

high_risk_actions:
  approve_reject:
    enabled: false
    rationale: "The summariser does not accept a summary, uphold a complaint, or reject one."
  regulated_decision:
    enabled: false
    rationale: "A cited sentence is not a complaint outcome, an eligibility decision, or a redress decision."
  production_record_change:
    enabled: false
    rationale: "No case record is written."
  external_send:
    enabled: false
    rationale: "The draft is not emailed, texted, or posted to the customer."
  spend_transact:
    enabled: false
    rationale: "No payment and no redress is made."
  additional_high_risk:
    - action_name: "Contact the customer"
      enabled: false
      rationale: "customer_contacted stays false. contact_customer always raises."
    - action_name: "Change the case record"
      enabled: false
      rationale: "record_changed stays false. write_case_record always raises."
    - action_name: "Close a complaint"
      enabled: false
      rationale: "complaint_closed stays false. close_complaint always raises."
    - action_name: "Offer redress"
      enabled: false
      rationale: "redress_offered stays false. offer_redress always raises."
    - action_name: "Label a customer as vulnerable"
      enabled: false
      rationale: "customer_labelled_vulnerable stays false. A vulnerability label in a proposed sentence fails the checker."

assumptions:
  description: "The organisation confirms these before anyone relies on a draft."
  items:
    - id: "A1"
      assumption: "The case is synthetic. This starter does not fetch a live case file."
      section: "data_access.never_access"
      verify_on_deployment: true
    - id: "A2"
      assumption: "The legislation pages opened on 9 November 2026 are re-opened before a legal note is relied on. The ICO page was not opened."
      section: "review"
      verify_on_deployment: true
    - id: "A3"
      assumption: "High-risk actions stay disabled. The service representative checks every cited sentence outside this tool."
      section: "high_risk_actions"
      verify_on_deployment: true
