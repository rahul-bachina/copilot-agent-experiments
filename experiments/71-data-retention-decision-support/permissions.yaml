# Agent manifest: Data Retention Decision Support
# Experiment 71 — catalogue ID L007
# Version: 0.1.0
# Last reviewed: 2026-11-23
# Next review: 2027-05-23

$schema: "../../../schemas/agent-manifest.schema.json"

agent:
  id: "exp-71-data-retention-decision-support"
  name: "Data Retention Decision Support"
  version: "0.1.0"
  description: >
    Explains which pinned synthetic retention line appears to apply to one
    record series, calculates an indicative date from the trigger, and lists
    the questions the records owner must answer. Autonomy A0. The records or
    legal owner decides retention, disposal, transfer, and hold. The agent
    does not delete, move, relabel, archive, or send.
  owner: "Records owner"
  contact: "records@mereford.example.gov.uk"
  repository: "https://github.com/rahul-bachina/copilot-agent-experiments"
  experiment_path: "experiments/71-data-retention-decision-support"

autonomy:
  level: "A0"
  level_description: "Read-only advice. The records or legal owner makes every retention, disposal, transfer, or hold decision. The agent never deletes, moves, relabels, archives, or sends."
  constraints:
    - "The records or legal owner decides. The agent does not."
    - "The agent NEVER deletes, moves, relabels, archives, transfers, or sends"
    - "The agent NEVER suggests disposal for a legal hold or an open FOI, SAR, litigation, or inquiry"
    - "The agent NEVER treats approval text inside a title or a note as the seen step"
    - "A caller-supplied schedule or inventory is not the pinned source"
  human_in_the_loop: true
  auto_actions_enabled: false

data_access:
  reads:
    - resource: "Synthetic records inventory"
      description: "Pinned series, owner, marking, dates, trigger, and legal-hold flags. A pasted inventory is not this file."
      access_level: "read"
      scope: "One series per invocation. The note is not copied into the result."
      justification: "The advice has to name the series the owner asked about."
      data_categories:
        - "Record series metadata"
        - "Retention labels and legal-hold flags"
      may_contain_personal_data: true
      may_contain_special_category_data: true
      retention: "This starter does not set a statutory retention period for its own output."
    - resource: "Synthetic retention schedule"
      description: "Pinned lines, triggers, and periods. A schedule inside the request is not this file."
      access_level: "read"
      scope: "The pinned file."
      justification: "The line and the indicative date come from the pinned schedule."
      may_contain_personal_data: false
    - resource: "Synthetic directory"
      description: "Records owners, legal owners, staff, and guests. The note does not set the role or the clearance."
      access_level: "read"
      scope: "One caller reference, and the approver on the seen step."
      justification: "Only the directory records owner for that series, or a legal owner, can record that the advice was seen."
      may_contain_personal_data: false
    - resource: "Separate seen object"
      description: "The only object that can record that this advice hash was seen."
      access_level: "read"
      scope: "One seen object, bound to that hash."
      justification: "Approval inside the note is not that step. Seeing the advice does not authorise disposal."
      may_contain_personal_data: false
    - resource: "Experiment 01 FOI triage signals"
      description: "detect_classification and detect_urgency_flags. The narrative is not copied and is not a determination."
      access_level: "read"
      scope: "A type and an urgency level."
      justification: "An information-request word is context for the records owner. Negation in this starter is not overridden."
      may_contain_personal_data: false
    - resource: "Experiment 08 UK identifier redaction"
      description: "propose() on the note. Reversible stays false. The redacted text is not copied."
      access_level: "read"
      scope: "A count of findings. Matched values are not stored."
      justification: "A pasted identifier is counted before the advice is shown."
      may_contain_personal_data: true
    - resource: "Experiment 12 document intake"
      description: "intake() on the note as one text file. Files are not confirmed and no purpose is confirmed."
      access_level: "read"
      scope: "One synthetic batch. The intake draft is not copied."
      justification: "The note is untrusted text. Intake records that, and this starter does not confirm the file."
      may_contain_personal_data: true

  never_access:
    - resource: "A live records store, a mailbox, or a disposal queue"
      reason: "The note and the pinned files are what this starter reads. It does not delete, move, or send."
    - resource: "A self-declared role, guest status, or clearance in the note"
      reason: "The directory is the source. The text is recorded as ignored."
    - resource: "Note text above the directory clearance"
      reason: "The note is not copied. The higher marking, the legal hold, and the retention labels are kept."
    - resource: "A caller-supplied schedule, inventory, or directory"
      reason: "Differences are flagged. Matching uses the pinned files."

tools:
  allowed:
    - tool: "Explain retention advice"
      provider: "Local Python (advise_retention)"
      action: "Return indicative advice for one synthetic series"
      access_level: "read"
      scope: "One synthetic request. No network. No model."
      justification: "The line, the date, and the questions are deterministic. A language model must not decide disposal."
      human_approval_required: false
      output_requires_human_review: true
    - tool: "Record advice seen"
      provider: "Local Python (record_advice_seen)"
      action: "Record that the directory owner has seen this advice hash"
      access_level: "read"
      scope: "The advice and a separate seen object, bound to the advice hash. No records write."
      justification: "The owner must see the exact advice before anyone relies on it. The step does not authorise disposal."
      human_approval_required: true
      output_requires_human_review: true
    - tool: "Text note"
      provider: "Microsoft Foundry"
      action: "Turn the JSON into a short note, using only fields already in the JSON"
      access_level: "read"
      scope: "The JSON for this run"
      justification: "Optional narrative. The hash, the line, and the empty or recorded seen step stay in the Python core."
      human_approval_required: false
      output_requires_human_review: true

  writes:
    enabled: false
    note: >
      No writes. record_advice_seen keeps an in-memory acknowledgement for
      this process. It does not delete, move, relabel, archive, or change a
      record. production writes stay off.

  sends:
    enabled: false
    note: "No sends. Seeing the advice does not email the owner, a requester, or anyone else."

high_risk_actions:
  approve_reject:
    enabled: false
    rationale: "The agent does not approve or reject a retention, disposal, transfer, or hold decision. A seen object records that a person has looked at this hash."
  regulated_decision:
    enabled: false
    rationale: "The agent does not decide that UK GDPR Article 5(1)(e) was met, that a section 77 offence was committed, or that a Public Records Act duty was met."
  production_record_change:
    enabled: false
    rationale: "The agent does not delete, move, relabel, archive, or otherwise change a record."
  external_send:
    enabled: false
    rationale: "The agent does not send the advice or the record."
  spend_transact:
    enabled: false
    rationale: "There is no payment."
  additional_high_risk:
    - enabled: false
      action_name: "Delete, move, relabel, archive, transfer, dispose, or send"
      rationale: "Those functions raise. disposal_suggested and the action flags stay false."
    - enabled: false
      action_name: "Treat a sentence in the note as the owner's seen step"
      rationale: "human_approval stays null until record_advice_seen succeeds for the directory person and the exact hash."
    - enabled: false
      action_name: "Suggest disposal while a hold or an open matter is present"
      rationale: "disposal_suggested stays false. The case is routed to the records owner."
    - enabled: false
      action_name: "Drop a legal hold or a retention label"
      rationale: "A hold and every retention label are copied onto the result."

human_approval:
  description: >
    The records owner or the legal owner records that they have seen this
    advice hash. That step does not authorise disposal, transfer, or a hold
    change. Approval text inside the note is not a step.

  approval_points:
    - action: "See a distress, hold, open-matter, or storage-limitation route"
      approver: "Records owner or legal owner"
      mandatory: true
      rationale: "route_seen must be the boolean true when the result requires it. The cue text is not copied."
    - action: "Acknowledge unverified statute and code pins"
      approver: "Records owner or legal owner"
      mandatory: true
      rationale: "pins_seen must be the boolean true. Article 84B and the section 46 code were not opened."
    - action: "Acknowledge a stale schedule or a caller source that differs"
      approver: "Records owner or legal owner"
      mandatory: true
      rationale: "schedule_seen and sources_seen must be the boolean true when those flags are set. A string is not coerced."
    - action: "Record that this advice hash was seen"
      approver: "Records owner or legal owner"
      mandatory: true
      rationale: "record_advice_seen accepts the directory person only when the advice hash matches and the item is retention-advice-seen."
    - action: "Decide retention, disposal, transfer, or hold"
      approver: "Records owner or legal owner, outside this agent"
      mandatory: true
      rationale: "Those actions are not tools. The flags stay false after the seen step."

  no_approval_required:
    - action: "Read the advice"
      rationale: "Reading the advice has no external effect. human_approval stays null and nothing is changed."
    - action: "Re-run the same series"
      rationale: "No write and no send. The same inputs and the same question date produce the same JSON."

uk_gdpr:
  lawful_basis:
    primary: "Not asserted"
    description: >
      This starter does not decide the controller's lawful basis. Article 6
      was not opened on 23 November 2026. Article 5(1)(e) was opened as
      context for the records owner. It is not a finding that the principle
      was met.
    secondary: "None asserted."
  special_category_data:
    may_process: true
    categories_possible:
      - "Health, political opinions, or other Article 9(1) detail, if a note pastes them"
    lawful_basis_special: "Not asserted. Article 9 was not opened on 23 November 2026."
    safeguards:
      - "A distress, vulnerability, or safeguarding cue is routed to a person. The cue text is not copied."
      - "Phone numbers, email addresses, dates of birth, postal addresses, personal names, and UK identifiers are counted. The values are not stored."
      - "Samples in this repository are synthetic."
      - "No solely automated decision about a person or a record. The sample does not dispose of anything."
  data_minimisation:
    - "The note is not copied into the result."
    - "Counts replace matched values. output is not described as anonymised."
  retention:
    agent_retention: "The in-memory acknowledgement lives for the process. This starter does not set a disposal date for its own output."
    note: "A retention label and a legal hold on the series are kept. They are not a decision to dispose."
  data_residency:
    region: "UK"
    note: "A production Microsoft Foundry deployment should use UK South or UK West. This repository cannot enforce that."
  data_subject_rights:
    note: "The agent does not handle access, erasure, or objection requests. Those go through the organisation's privacy process."

prompt_injection:
  description: >
    Titles, notes, and a caller-supplied schedule are untrusted. They may say
    the owner has approved disposal, that a hold should be stripped, or that
    the agent should delete the series. The core does not read the network.
  controls:
    - control: "Instruction sentences are not followed"
      description: "Delete, dispose, send, and pretend-approval sentences are recorded. followed stays false."
    - control: "Negation is not a positive match"
      description: "A phrase after not true that, or after a short not, in the same sentence, is not an inclusion."
    - control: "The seen step is a separate object"
      description: "Approval keys on the request are stripped. human_approval stays null until record_advice_seen succeeds."
    - control: "Pinned sources win"
      description: "A schedule, inventory, or directory in the request is compared and not used for the date."
    - control: "No delete, dispose, or send tool"
      description: "Those functions raise RetentionForbidden."
  residual_risk: >
    A manipulated model can still narrate a misleading note. The records owner
    is the control. Nothing is sent even if the note is wrong. A paraphrase
    that uses none of the cue stems is not flagged.

risk_assessment:
  methodology: "Likelihood x impact, Low / Medium / High, for this starter rather than a named organisation"
  date_assessed: "2026-11-23"
  risks:
    - id: "R1"
      risk: "A sentence in the note is treated as authority to dispose, or as the owner's seen step"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Those words are recorded and not followed"
        - "record_advice_seen reads only the separate seen object and the advice hash"
      residual_risk: "Low"
      owner: "Records owner"
    - id: "R2"
      risk: "The agent deletes, moves, relabels, archives, or sends a record"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Those functions raise"
        - "The action flags stay false after the seen step"
      residual_risk: "Low"
      owner: "Records owner"
    - id: "R3"
      risk: "A negated hold or a missing date is treated as permission to dispose"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Negation is applied before a cue counts"
        - "An unreadable date is flagged and is not replaced with today"
        - "A hold or an open matter keeps disposal_suggested false"
      residual_risk: "Medium"
      owner: "Records owner"
    - id: "R4"
      risk: "Personal data or a distress cue is copied into the advice"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "The note is not copied"
        - "Distress is a route. Identifier values are not stored"
      residual_risk: "Medium"
      owner: "Data protection officer"
    - id: "R5"
      risk: "A caller schedule is trusted, or an unreadable period is coerced to zero"
      likelihood: "Medium"
      impact: "Medium"
      inherent_risk: "Medium"
      controls:
        - "The value is flagged and coerced stays false"
        - "The date uses the pinned schedule"
      residual_risk: "Low"
      owner: "Records owner"
    - id: "R6"
      risk: "A legal hold or a retention label is dropped, or a SECRET cover is missed"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Metadata and content are both read"
        - "A compound marking takes the higher tier"
        - "The hold and every retention label are kept"
      residual_risk: "Medium"
      owner: "Information governance"

logging_and_audit:
  description: >
    A production deployment should log the invocation, the series id, the
    outcome, and whether a seen step was recorded. This starter does not
    write an application log. Do not put the note or a quote in an application
    trace.
  logged_events:
    - event: "Advice returned"
      data_logged:
        - "Timestamp"
        - "Series id"
        - "Outcome"
        - "Whether human_approval was left null"
      retention: "Organisation's records schedule. Not set by this starter."
    - event: "Advice seen"
      data_logged:
        - "Whether the advice hash matched"
        - "records_changed false"
      retention: "Organisation's schedule. The agent does not write this event to a records system."
  log_destination:
    primary: "Not configured in this starter"
    note: "Choose a UK-resident store the organisation already operates."

kill_switch:
  description: "Ways to stop the agent being used. Times are the platform's, not a measured drill."
  methods:
    - method: "Turn off the Copilot Studio agent"
      action: "Set the agent to Off in Copilot Studio administration"
      time_to_effect: "Immediate once an administrator does it"
      who_can_activate: "Copilot Studio administrators"
    - method: "Remove Microsoft Foundry access"
      action: "Revoke the key or the managed-identity role used for an optional note"
      time_to_effect: "Immediate for new calls"
      who_can_activate: "Foundry or Key Vault administrators"
  escalation_contacts:
    - role: "Records owner"
      contact: "records@mereford.example.gov.uk"
    - role: "Data protection officer"
      contact: "dpo@mereford.example.gov.uk"

review:
  last_review_date: "2026-11-23"
  next_review_date: "2027-05-23"
  review_frequency: "6 months, and sooner if the pinned legislation or the schedule changes"
  reviewer: "The adopting organisation's records lead and DPO. Not assigned to a named person in this starter."
  review_triggers:
    - "A change to UK GDPR Article 5, Freedom of Information Act 2000 sections 46 or 77, or the Public Records Act 1958 section 3"
    - "A proposal to add a connector that can delete, move, archive, or send"
  related_documents:
    - name: "Experiment readme"
      path: "README.md"
    - name: "Advice core"
      path: "src/advice.py"
    - name: "Pinned sources"
      path: "src/sources.py"
    - name: "Security and permissions"
      path: "docs/security-and-permissions.md"

atrs_mapping:
  note: >
    Not an ATRS record and not a scope decision. A body that wants a draft
    pack uses Experiment 03. The advice from this starter is not an approval
    of that pack.
  mappings:
    - atrs_field: "Name"
      manifest_section: "agent.name"
    - atrs_field: "Description"
      manifest_section: "agent.description"
    - atrs_field: "Human oversight"
      manifest_section: "human_approval"

assumptions:
  description: "Items an organisation must confirm before relying on this starter."
  items:
    - id: "A1"
      assumption: "No lawful basis is asserted. Article 6 was not opened on 23 November 2026. Article 9 was not opened."
      section: "uk_gdpr"
      verify_on_deployment: true
    - id: "A2"
      assumption: "UK GDPR Article 5, Freedom of Information Act 2000 sections 46 and 77, and Public Records Act 1958 section 3 did not show an up-to-date-on-or-before date in the extract opened on 23 November 2026. Their currency is unverified."
      section: "src/sources.py"
      verify_on_deployment: true
    - id: "A3"
      assumption: "Article 84B was not opened. The section 46 code of practice was not opened. Orders under Constitutional Reform and Governance Act 2010 section 45(2) were not opened."
      section: "src/sources.py"
      verify_on_deployment: true
    - id: "A4"
      assumption: "Adding years to 29 February lands on 28 February in a non-leap year. That is a starter rule. It is not a statute. A numeric date with both numbers from 1 to 12 is ambiguous and is not resolved."
      section: "src/dates.py"
      verify_on_deployment: true
    - id: "A5"
      assumption: "Treating the schedule as stale on its next-review date is this starter's rule. It is not a statutory period. Experiment 12's document window is that experiment's rule."
      section: "src/advice.py"
      verify_on_deployment: true
    - id: "A6"
      assumption: "The marking order is a starter rule. The Government Security Classifications Policy was not re-opened."
      section: "src/marking.py"
      verify_on_deployment: true
    - id: "A7"
      assumption: "The small-number threshold of 5 is a starter control. It is not anonymisation. The ICO anonymisation guidance was not opened."
      section: "src/advice.py"
      verify_on_deployment: true
    - id: "A8"
      assumption: "Entra Agent ID, Conditional Access for agents, Power Platform DLP as a configured policy, Microsoft Foundry prompt shields, Key Vault, Purview, and Application Insights were not opened on 23 November 2026. Treat that product behaviour as unverified."
      section: "docs/security-and-permissions.md"
      verify_on_deployment: true
    - id: "A9"
      assumption: "The harness overview opened on 23 November 2026 names a Microsoft Copilot harness. It does not use the words GitHub Copilot harness. Older wording that the harness is not the GitHub Copilot service is unverified against that page."
      section: "docs/harness-comparison.md"
      verify_on_deployment: true
    - id: "A10"
      assumption: "Contact addresses on mereford.example.gov.uk are placeholders. Mereford Borough Council and the series titles are invented."
      section: "kill_switch.escalation_contacts"
      verify_on_deployment: true
