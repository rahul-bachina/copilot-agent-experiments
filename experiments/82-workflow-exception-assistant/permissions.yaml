# Agent manifest: Workflow Exception Assistant
# Experiment 82 — catalogue ID O009
# Version: 0.1.0
# Last reviewed: 2026-11-26
# Next review: 2027-05-26

$schema: "../../../schemas/agent-manifest.schema.json"

agent:
  id: "exp-82-workflow-exception-assistant"
  name: "Workflow Exception Assistant"
  version: "0.1.0"
  description: >
    Diagnoses a failed or stuck synthetic workflow run, groups related
    failures, and proposes retry, route, or cancel with risks. Autonomy A1.
    The named process owner chooses. The agent does not retry, cancel, edit
    a record, or re-run a flow.
  owner: "Process owner"
  contact: "flows@reedmarsh.example"
  repository: "https://github.com/rahul-bachina/copilot-agent-experiments"
  experiment_path: "experiments/82-workflow-exception-assistant"

autonomy:
  level: "A1"
  level_description: "The agent drafts a reading and options. The named process owner chooses retry, route, or cancel on a separate object. The agent never carries out that choice."
  constraints:
    - "The process owner chooses. The agent does not."
    - "The agent NEVER retries, cancels, edits a record, or re-runs a flow"
    - "The agent NEVER treats error text, a payload sentence, or a caller-supplied register as authoritative"
    - "Retry is marked safe only when the pinned register says the step is idempotent and has no side effect"
  human_in_the_loop: true
  auto_actions_enabled: false

data_access:
  reads:
    - resource: "Synthetic workflow run histories"
      description: "Power Automate-style runs and step error codes. Error text is untrusted. Instructions in it are not followed."
      access_level: "read"
      scope: "One synthetic process in one request. Text above the owner's directory clearance is not copied out."
      justification: "The reading cites the run and the step. The owner chooses what happens next."
      data_categories:
        - "Run and step status"
        - "Structured error codes"
        - "Protective markings, retention labels, and legal-hold flags"
      may_contain_personal_data: true
      may_contain_special_category_data: true
      retention: "The in-memory held copy lives for the process. This starter does not set a statutory retention period."
    - resource: "Pinned synthetic process register"
      description: "Process owner, deputies, idempotency, and side effects. A register in the request is not this file."
      access_level: "read"
      scope: "One process id."
      justification: "Retry is marked safe only from this register."
      may_contain_personal_data: false
    - resource: "Synthetic directory"
      description: "Process owners and deputies. Run text does not set the role or the clearance."
      access_level: "read"
      scope: "The owner and deputies named on the register."
      justification: "Only a named directory process owner can record the decision."
      may_contain_personal_data: true
    - resource: "Separate decision object"
      description: "The only object that can record retry, route, or cancel for this hash, or record that a route was seen."
      access_level: "read"
      scope: "One object, bound to the agent-held hash."
      justification: "A sentence in an error payload is not that step."
      may_contain_personal_data: false
    - resource: "Experiment 08 UK identifier redaction"
      description: "propose() on run text. Reversible stays false. The redacted text is not stored as a field."
      access_level: "read"
      scope: "A count of findings. Matched values are not stored."
      justification: "A pasted identifier is counted. The output is not described as anonymised."
      may_contain_personal_data: true

  never_access:
    - resource: "A live Power Automate environment or a production record"
      reason: "The synthetic runs are what this starter reads. It does not retry, cancel, edit, or re-run."
    - resource: "A caller-supplied register, directory, or taxonomy"
      reason: "Differences are flagged. The decision uses the pinned register and the pinned directory."
    - resource: "An approval marker, a role, or a clearance stated inside a payload"
      reason: "The directory and the separate decision object are the source."
    - resource: "Run text above the owner's directory clearance"
      reason: "The body is not copied. The higher marking, the legal hold, and the retention labels are kept."
    - resource: "Experiment 17 invoice exception triage"
      reason: "That starter is a different workflow. This one does not call it."

tools:
  allowed:
    - tool: "Diagnose workflow exception"
      provider: "Local Python (diagnose)"
      action: "Classify a synthetic run from pinned codes and return options with risks"
      access_level: "read"
      scope: "One synthetic request. No network. No model. No flow call."
      justification: "The class comes from the pinned taxonomy. A language model must not decide that a retry is safe."
      human_approval_required: false
      output_requires_human_review: true
    - tool: "Record route seen"
      provider: "Local Python (record_route_seen)"
      action: "Record that the named owner has seen a distress, safeguarding, whistleblowing, grievance, or leading-criterion route"
      access_level: "read"
      scope: "The diagnosis and a separate seen object. Nothing is retried."
      justification: "Those cues are not a routine failure. The cue text is not copied."
      human_approval_required: true
      output_requires_human_review: true
    - tool: "Record owner decision"
      provider: "Local Python (record_owner_decision)"
      action: "Record that the named process owner chooses retry, route, or cancel for this held hash"
      access_level: "read"
      scope: "The diagnosis and a separate decision object, bound to the content hash."
      justification: "The catalogue checkpoint is that the process owner chooses. The step does not carry out the choice."
      human_approval_required: true
      output_requires_human_review: true
    - tool: "Text note"
      provider: "Microsoft Foundry"
      action: "Turn the JSON into a short note, using only fields already in the JSON"
      access_level: "read"
      scope: "The JSON for this run"
      justification: "Optional narrative. The hash, the class, and the empty or recorded decision stay in the Python core."
      human_approval_required: false
      output_requires_human_review: true

  writes:
    enabled: false
    note: >
      No writes. record_owner_decision keeps an in-memory acknowledgement for
      this process. It does not edit a record or call a flow.

  sends:
    enabled: false
    note: "No sends. Recording a route does not email the owner or anyone else."

high_risk_actions:
  approve_reject:
    enabled: false
    rationale: "The agent does not approve or reject a run. A decision object records the owner's choice. A sentence in a payload cannot set it, and the choice is not carried out."
  regulated_decision:
    enabled: false
    rationale: "The agent does not decide that a firm met an impact tolerance, that a business rule was satisfied, or that a retry is the right business outcome."
  production_record_change:
    enabled: false
    rationale: "The agent does not edit a record, cancel a run in a flow service, or write a production system."
  external_send:
    enabled: false
    rationale: "The agent does not send the reading or a message about the run."
  spend_transact:
    enabled: false
    rationale: "There is no payment. A payment step is a duplicate risk to flag, not a transaction."
  additional_high_risk:
    - enabled: false
      action_name: "Retry, cancel, edit a record, or re-run a flow"
      rationale: "Those functions raise. retried, cancelled, records_edited, and flow_rerun stay false."
    - enabled: false
      action_name: "Treat error text as the exception class"
      rationale: "error_text_used_for_class stays false. The pinned taxonomy is the class."
    - enabled: false
      action_name: "Treat payload text as the owner's decision"
      rationale: "owner_decision_recorded stays false until record_owner_decision succeeds for the named owner and the held hash."
    - enabled: false
      action_name: "Mark a retry safe when the pinned step is not idempotent"
      rationale: "retry_safe is true only for an idempotent step with no side effect, no qualifier, and a transient or timeout class."
    - enabled: false
      action_name: "Drop a legal hold, a retention label, or a protective marking"
      rationale: "A hold, every retention label, and the higher marking are copied onto the result and sit inside the hash."
    - enabled: false
      action_name: "Apply a caller-supplied register, directory, or taxonomy"
      rationale: "caller_register_applied, caller_directory_applied, and caller_taxonomy_applied stay false."

human_approval:
  description: >
    The named process owner chooses retry, route, or cancel on a separate
    object, bound to the agent-held proposal and its hash. That choice does
    not retry, cancel, edit, or re-run the flow. An approval marker inside a
    payload is not a step.

  approval_points:
    - action: "See a distress, safeguarding, whistleblowing, grievance, or leading-criterion route"
      approver: "Named process owner"
      mandatory: true
      rationale: "record_route_seen accepts the directory owner or deputy named on the diagnosis and the content hash. It does not choose the action."
    - action: "Choose retry, route, or cancel for this held proposal"
      approver: "Named process owner"
      mandatory: true
      rationale: "record_owner_decision accepts the directory process owner or deputy only when the content hash matches the agent-held copy. The choice is not carried out."
    - action: "Acknowledge the opened data-protection and resilience pins"
      approver: "Named process owner"
      mandatory: true
      rationale: "pins_seen must be the boolean true. Article 22B, Article 22C, Article 22D, and SYSC 15A were not opened."
    - action: "Acknowledge a stale run, an unreadable timestamp, or a marking"
      approver: "Named process owner"
      mandatory: true
      rationale: "dates_seen and markings_seen must be the boolean true when those flags are set. A string is not coerced."
    - action: "Acknowledge partial completion, a caller register, or conflicting codes"
      approver: "Named process owner"
      mandatory: true
      rationale: "partial_seen, register_seen, and conflict_seen must be the boolean true when those flags are set."
    - action: "Retry, cancel, edit a record, or re-run a flow"
      approver: "Nobody"
      mandatory: true
      rationale: "Those actions are not tools. The flags stay false after a decision."

  no_approval_required:
    - action: "Read the diagnosis"
      rationale: "Reading the diagnosis has no external effect. owner_decision_recorded stays false and nothing is retried."
    - action: "Re-run the same request"
      rationale: "No flow call until the decision object matches. The same inputs and the same question date produce the same JSON."

uk_gdpr:
  lawful_basis:
    primary: "Not asserted"
    description: >
      This starter does not decide the controller's lawful basis. Article 6
      was not opened on 26 November 2026. Article 5(1)(c) was opened and is
      quoted as context for data minimisation. It is not a finding that the
      duty was met.
    secondary: "None asserted."
  special_category_data:
    may_process: true
    categories_possible:
      - "Health, safeguarding, or other sensitive text a caller may paste into an error payload"
    lawful_basis_special: "Not asserted. Article 9 was not opened on 26 November 2026."
    safeguards:
      - "A distress, safeguarding, whistleblowing, or grievance cue is routed to the named owner. The cue text is not copied."
      - "Phone numbers, email addresses, dates of birth, postal addresses, personal names, secrets, and UK identifiers are counted and not stored. The output is not described as anonymised."
      - "A count of people below 5 is not published, and neither is a difference or a percentage of that count. Five is this starter's threshold."
      - "Samples in this repository are synthetic."
      - "No solely automated decision about a person or a run. The diagnosis does not retry a flow."
  data_minimisation:
    - "Run text above the owner's clearance is not copied into the result."
    - "Cue text is not copied."
    - "described_as_anonymised stays false."
  retention:
    agent_retention: "The held copy lives for the process. This starter does not set a disposal date."
    note: "A retention label and a legal hold on the runs are kept. They are not a decision to dispose."
  data_residency:
    region: "UK"
    note: "A production Microsoft Foundry deployment should use UK South or UK West. This repository cannot enforce that."
  data_subject_rights:
    note: "The agent does not handle access, erasure, or objection requests. Those go through the organisation's privacy process."

prompt_injection:
  description: >
    Error text, notes, and a caller register are untrusted. They may say the
    run is already approved, that the agent should retry now, or that a label
    should be stripped. The core does not read the network and does not call a flow.
  controls:
    - control: "Instruction sentences are not followed"
      description: "Retry, cancel, and drop-the-hold sentences are recorded. followed stays false."
    - control: "Negation is not a positive inclusion"
      description: "A phrase after not true that, in the same sentence, is not an instruction. A distress stem is still routed."
    - control: "The decision is a separate object"
      description: "Decision keys on the request are stripped. owner_decision_recorded stays false until record_owner_decision succeeds against the agent-held copy."
    - control: "The pinned register wins"
      description: "A register, directory, or taxonomy in the request is not used for the class or the decision."
    - control: "No retry, cancel, edit, or re-run tool"
      description: "Those functions raise WorkflowForbidden."
  residual_risk: >
    A manipulated model can still narrate a misleading note. The named
    process owner is the control. Nothing is retried even if the note is wrong.
    A paraphrase that uses none of the cue stems is not flagged.

risk_assessment:
  methodology: "Likelihood x impact, Low / Medium / High, for this starter rather than a named organisation"
  date_assessed: "2026-11-26"
  risks:
    - id: "R1"
      risk: "A sentence in an error payload is treated as the owner's decision or as an instruction to retry"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Those words are recorded and not followed"
        - "record_owner_decision reads only the separate object, the content hash, and the held copy"
      residual_risk: "Low"
      owner: "Process owner"
    - id: "R2"
      risk: "The agent retries, cancels, edits a record, or re-runs a flow"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Those functions raise"
        - "The flags stay false after a decision"
      residual_risk: "Low"
      owner: "Process owner"
    - id: "R3"
      risk: "A payment, email, or record write is retried because the error text says the step is idempotent"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Idempotency and side effects come from the pinned register"
        - "A caller register is not applied"
        - "Partial completion is flagged"
      residual_risk: "Low"
      owner: "Process owner"
    - id: "R4"
      risk: "Error text is used as the exception class"
      likelihood: "Medium"
      impact: "Medium"
      inherent_risk: "Medium"
      controls:
        - "The class comes from the pinned taxonomy"
        - "Conflicting codes are not picked"
      residual_risk: "Low"
      owner: "Process owner"
    - id: "R5"
      risk: "An unreadable or future timestamp is coerced, or a stale run is treated as current"
      likelihood: "Medium"
      impact: "Medium"
      inherent_risk: "Medium"
      controls:
        - "The value is flagged and coerced stays false"
        - "The question date is the as-of argument"
      residual_risk: "Low"
      owner: "Process owner"
    - id: "R6"
      risk: "A legal hold or a retention label is dropped, or a SECRET cover is missed"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "Metadata and content are both read"
        - "A compound marking takes the higher tier"
        - "The hold and every retention label are kept inside the hash"
      residual_risk: "Medium"
      owner: "Information governance"
    - id: "R7"
      risk: "A small count of people identifies one person through a difference or a percentage"
      likelihood: "Medium"
      impact: "High"
      inherent_risk: "High"
      controls:
        - "A count below 5 is not published and is not differenced"
      residual_risk: "Medium"
      owner: "Process owner"

logging_and_audit:
  description: >
    A production deployment should log the invocation, the owner reference
    if it matched the synthetic pattern, the outcome, and whether a decision
    was recorded. This starter does not write an application log. Do not put
    error text that identifies a person in an application trace. The held
    hash is the audit link between the proposal and the owner's choice.
    That link is a starter control. It is not a finding that an operational
    resilience duty was met.
  logged_events:
    - event: "Diagnosis returned"
      data_logged:
        - "Timestamp"
        - "Owner reference, if it matched the synthetic pattern"
        - "Outcome"
        - "Whether owner_decision_recorded was left false"
      retention: "Organisation's records schedule. Not set by this starter."
    - event: "Owner decision recorded in memory"
      data_logged:
        - "Whether the content hash matched the held copy"
        - "The action id"
        - "production_written false"
      retention: "Organisation's schedule. The agent does not write this event to a flow service."
  log_destination:
    primary: "Not configured in this starter"
    note: "Choose a UK-resident store the organisation already operates."

kill_switch:
  description: "Ways to stop the agent being used. Times are the platform's, not a measured drill."
  methods:
    - method: "Turn off the Copilot Studio agent"
      action: "Set the agent to Off in Copilot Studio administration"
      time_to_effect: "Immediate once an administrator does it"
      who_can_activate: "Copilot Studio administrators"
    - method: "Remove Microsoft Foundry access"
      action: "Revoke the key or the managed-identity role used for an optional note"
      time_to_effect: "Immediate for new calls"
      who_can_activate: "Foundry or Key Vault administrators"
  escalation_contacts:
    - role: "Process owner"
      contact: "flows@reedmarsh.example"
    - role: "Data protection officer"
      contact: "dpo@reedmarsh.example"

review:
  last_review_date: "2026-11-26"
  next_review_date: "2027-05-26"
  review_frequency: "6 months, and sooner if the cited statute text changes"
  reviewer: "The adopting organisation's process owner and DPO. Not assigned to a named person in this starter."
  review_triggers:
    - "A change to the pinned register or the pinned error taxonomy"
    - "A change to UK GDPR Article 5(1)(c) or Article 22A"
    - "A proposal to add a connector that can retry, cancel, edit, or send"
  related_documents:
    - name: "Experiment readme"
      path: "README.md"
    - name: "Diagnosis core"
      path: "src/workflow.py"
    - name: "Opened sources"
      path: "src/sources.py"
    - name: "Security and permissions"
      path: "docs/security-and-permissions.md"

atrs_mapping:
  note: >
    Not an ATRS record and not a scope decision. A body that wants a draft
    pack uses Experiment 03. The diagnosis from this starter is not an
    approval of that pack.
  mappings:
    - atrs_field: "Name"
      manifest_section: "agent.name"
    - atrs_field: "Description"
      manifest_section: "agent.description"
    - atrs_field: "Human oversight"
      manifest_section: "human_approval"

assumptions:
  description: "Items an organisation must confirm before relying on this starter."
  items:
    - id: "A1"
      assumption: "No lawful basis is asserted. Article 6 and Article 9 were not opened on 26 November 2026. Article 5(1)(c) and Article 22A(1)(a) and (b) were opened and are quoted."
      section: "uk_gdpr"
      verify_on_deployment: true
    - id: "A2"
      assumption: "Article 22B, Article 22C, and Article 22D were not opened. S.I. 2026/82 was not opened. SYSC 15A was not opened. This starter does not decide that a workflow action is a significant decision or that a firm met an impact tolerance."
      section: "src/sources.py"
      verify_on_deployment: true
    - id: "A3"
      assumption: "Treating a run as stale when its latest date is on or before the question date minus the pinned stale_after_days, including that boundary, is this starter's rule. It is not a statutory period. Calendar-day hours for a stuck run are a lower bound, not a measured duration."
      section: "src/workflow.py"
      verify_on_deployment: true
    - id: "A4"
      assumption: "The marking order is a starter rule. The Government Security Classifications Policy was not re-opened."
      section: "src/marking.py"
      verify_on_deployment: true
    - id: "A5"
      assumption: "The small-number threshold of 5 is a starter control. It is not anonymisation. The ICO anonymisation guidance was not opened."
      section: "src/mask.py"
      verify_on_deployment: true
    - id: "A6"
      assumption: "Entra Agent ID, Conditional Access for agents, Power Platform DLP as a configured policy, Microsoft Foundry prompt shields, Key Vault, Purview, and Application Insights were not opened on 26 November 2026. Treat that product behaviour as unverified."
      section: "docs/security-and-permissions.md"
      verify_on_deployment: true
    - id: "A7"
      assumption: "The harness overview was opened on 26 November 2026. It names a Microsoft Copilot harness. It does not use the words GitHub Copilot harness. The common-brief sentence that this harness is not the GitHub Copilot service was not on that page. That sentence is unverified. The page says that harness retries and finds alternative paths. This starter does not enable that behaviour."
      section: "docs/harness-comparison.md"
      verify_on_deployment: true
    - id: "A8"
      assumption: "Reedmarsh Internal Services is invented. The contact addresses are not real. The FCA operational-resilience overview was opened. It is context for an audit trail. It is not a finding about a firm."
      section: "fixtures/directory.json"
      verify_on_deployment: true
